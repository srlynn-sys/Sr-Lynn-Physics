<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homework</title><link rel="stylesheet" href="academic.css"><style>input{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccd6e3;border-radius:10px}button{padding:12px 18px;border:0;border-radius:10px;background:#0f2747;color:#fff;font-weight:700}.score{margin-top:18px;padding:16px;background:#f6f8fb;border-radius:12px}</style></head>
<body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="index.html">← Home</a></div><section class="hero"><h1>📚 Homework</h1><p>Maximum contribution: 30 marks</p></section><section class="panel"><label>Student ID</label><input id="id" placeholder="e.g. 11MM 003"><label>Homework Mark / 30</label><input id="mark" type="number" min="0" max="30" placeholder="0–30"><button onclick="save()">Save Homework</button><div id="out" class="score">Enter a student's homework mark.</div></section></main><script>function save(){const id=document.getElementById('id').value.trim();const m=Number(document.getElementById('mark').value);if(!id||m<0||m>30){out.textContent='Student ID နှင့် 0–30 အတွင်း mark ထည့်ပါ။';return}localStorage.setItem('homework_'+id,m);out.textContent=id+' — Homework: '+m+'/30';}</script></body></html>
