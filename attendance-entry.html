<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance ဖြည့်ရန်</title><link rel="stylesheet" href="academic.css"><style>input,select{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccd6e3;border-radius:10px}button{padding:12px 18px;border:0;border-radius:10px;background:#0f2747;color:#fff;font-weight:700;cursor:pointer}.clock,.workday{padding:14px;border-radius:12px;margin:15px 0}.clock{background:#f6f8fb}.workday{background:#eaf3ff;color:#174a83;font-weight:700}.closed{background:#fff1f1;color:#a52a2a}.msg{margin-top:14px;padding:12px;border-radius:10px}.ok{background:#e8f7ee;color:#176b3b}.err{background:#fff0f0;color:#a52a2a}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="attendance.html">← Attendance</a></div><section class="hero"><h1>📅 Attendance ဖြည့်ရန်</h1><p>Firebase Cloud Data • Myanmar Time (Asia/Yangon)</p></section><section class="panel"><div id="clock" class="clock"></div><div id="workday" class="workday"></div><label>Student ID</label><input id="id" placeholder="ဥပမာ 11MM 003" autocomplete="off"><label>Attendance</label><select id="status"><option value="Present">Present</option><option value="Absent">Absent</option><option value="Leave">Leave</option></select><button id="saveBtn" type="button">Attendance ဖြည့်မည်</button><div id="msg" class="msg"></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,doc,setDoc,getDocs,query,where,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,myanmarParts}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig)),ref=collection(db,'attendance_records');const clockEl=document.getElementById('clock'),workdayEl=document.getElementById('workday'),saveBtn=document.getElementById('saveBtn'),msgEl=document.getElementById('msg'),idEl=document.getElementById('id'),statusEl=document.getElementById('status');function render(){const p=myanmarParts(),dow=new Date(Date.UTC(p.year,Number(p.month)-1,Number(p.day))).getUTCDay(),workday=dow>=1&&dow<=5;clockEl.textContent='Myanmar Time — '+p.year+'-'+p.month+'-'+p.day+' '+p.hour+':'+p.minute+':'+p.second+' (UTC+06:30)';if(workday){workdayEl.className='workday';workdayEl.textContent='🟢 ယနေ့သည် Workday ဖြစ်ပါသည် — Attendance ဖြည့်နိုင်ပါသည်။';saveBtn.disabled=false;saveBtn.style.opacity='1'}else{workdayEl.className='workday closed';workdayEl.textContent='🔴 စနေ / တနင်္ဂနွေ — Weekend ဖြစ်သောကြောင့် Attendance ဖြည့်၍ မရပါ။ Monday–Friday အလုပ်ရက်များတွင်သာ ဖြည့်နိုင်ပါသည်။';saveBtn.disabled=true;saveBtn.style.opacity='.5'}}setInterval(render,1000);render();async function save(){const p=myanmarParts(),dow=new Date(Date.UTC(p.year,Number(p.month)-1,Number(p.day))).getUTCDay();if(dow<1||dow>5){msgEl.className='msg err';msgEl.textContent='Weekend ဖြစ်သောကြောင့် Attendance ဖြည့်၍ မရပါ။ Monday–Friday အလုပ်ရက်များတွင်သာ ဖြည့်နိုင်ပါသည်။';return}const id=idEl.value.trim().toUpperCase(),s=statusEl.value;if(!students[id]){msgEl.className='msg err';msgEl.textContent='Student ID မမှန်ပါ။ အသုံးပြုခွင့်ရှိသော Student ID ကိုထည့်ပါ။';return}const date=`${p.year}-${p.month}-${p.day}`;saveBtn.disabled=true;msgEl.className='msg';msgEl.textContent='Firebase တွင် သိမ်းနေသည်…';try{const existing=await getDocs(query(ref,where('id','==',id),where('date','==',date)));const payload={id,name:students[id],status:s,date,time:`${p.hour}:${p.minute}:${p.second}`,timestamp:new Date().toISOString(),updatedAt:serverTimestamp()};if(!existing.empty){await setDoc(doc(db,'attendance_records',existing.docs[0].id),payload,{merge:true});msgEl.className='msg ok';msgEl.textContent=id+' — '+students[id]+' — '+s+' ကို Firebase ရှိ ယနေ့ record ထဲသို့ Update လုပ်ပြီးပါပြီ။'}else{const recordId=`${id.replace(/\s+/g,'_')}_${date}`;await setDoc(doc(db,'attendance_records',recordId),payload,{merge:false});msgEl.className='msg ok';msgEl.textContent=id+' — '+students[id]+' — '+s+' ကို Firebase တွင် အသစ်သိမ်းပြီးပါပြီ။'}idEl.value=''}catch(e){console.error(e);msgEl.className='msg err';msgEl.textContent='Firebase save error: '+e.message}finally{render();saveBtn.disabled=false}}window.save=save;saveBtn.addEventListener('click',save);</script></body></html>
