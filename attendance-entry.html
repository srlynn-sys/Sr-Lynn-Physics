<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance ဖြည့်ရန်</title><link rel="stylesheet" href="academic.css"><style>input,select{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccd6e3;border-radius:10px}button{padding:12px 18px;border:0;border-radius:10px;background:#0f2747;color:#fff;font-weight:700}.clock{padding:14px;background:#f6f8fb;border-radius:12px;margin:15px 0}.msg{margin-top:14px;padding:12px;border-radius:10px}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="attendance.html">← Attendance</a></div><section class="hero"><h1>📅 Attendance ဖြည့်ရန်</h1><p>Myanmar Time (Asia/Yangon) • စာသင်ချိန် စတင်ချိန် ၁:၀၀ PM</p></section><section class="panel"><div id="clock" class="clock"></div><label>Student ID</label><input id="id" placeholder="ဥပမာ 11MM 003"><label>Attendance</label><select id="status"><option value="Present">Present</option><option value="Absent">Absent</option><option value="Leave">Leave</option></select><button onclick="save()">Attendance ဖြည့်မည်</button><div id="msg" class="msg"></div></section></main><script>const TZ='Asia/Yangon';function now(){return new Date()}function parts(d){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d).reduce((o,x)=>(o[x.type]=x.value,o),{})}function render(){const p=parts(now());clock.textContent='Myanmar Time — '+p.year+'-'+p.month+'-'+p.day+'  '+p.hour+':'+p.minute+':'+p.second+' (UTC+06:30)';}setInterval(render,1000);render();function save(){const id=document.getElementById('id').value.trim();const s=document.getElementById('status').value;const d=now(),p=parts(d);if(!id){msg.textContent='Student ID ထည့်ပါ။';return}if(Number(p.hour)<13){msg.textContent='Attendance ဖြည့်ရန် ညနေ ၁:၀၀ PM မှ စတင်ခွင့်ပြုပါသည်။';return}const item={id,status:s,date:p.year+'-'+p.month+'-'+p.day,time:p.hour+':'+p.minute+':'+p.second,timestamp:d.toISOString()};const key='attendance_records';const rows=JSON.parse(localStorage.getItem(key)||'[]');rows.push(item);localStorage.setItem(key,JSON.stringify(rows));msg.textContent=id+' — '+s+' — '+item.date+' '+item.time+' Myanmar Time ဖြင့် သိမ်းပြီးပါပြီ။';}</script></body></html>
