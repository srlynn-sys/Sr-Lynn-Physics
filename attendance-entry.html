<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance ဖြည့်ရန်</title><link rel="stylesheet" href="academic.css"><style>input,select{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccd6e3;border-radius:10px}button{padding:12px 18px;border:0;border-radius:10px;background:#0f2747;color:#fff;font-weight:700}.clock{padding:14px;background:#f6f8fb;border-radius:12px;margin:15px 0}.msg{margin-top:14px;padding:12px;border-radius:10px}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="attendance.html">← Attendance</a></div><section class="hero"><h1>📅 Attendance ဖြည့်ရန်</h1><p>Firebase Cloud Data • Myanmar Time (Asia/Yangon)</p></section><section class="panel"><div id="clock" class="clock"></div><label>Student ID</label><input id="id" placeholder="ဥပမာ 11MM 003" autocomplete="off"><label>Attendance</label><select id="status"><option value="Present">Present</option><option value="Absent">Absent</option><option value="Leave">Leave</option></select><button onclick="save()">Attendance ဖြည့်မည်</button><div id="msg" class="msg"></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,addDoc,serverTimestamp,query,where,getDocs}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,myanmarParts}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig)),ref=collection(db,'attendance_records');function render(){const p=myanmarParts();clock.textContent='Myanmar Time — '+p.year+'-'+p.month+'-'+p.day+' '+p.hour+':'+p.minute+':'+p.second+' (UTC+06:30)'}setInterval(render,1000);render();window.save=async()=>{const id=document.getElementById('id').value.trim().toUpperCase(),s=document.getElementById('status').value;if(!students[id]){msg.textContent='Student ID မမှန်ပါ။ အသုံးပြုခွင့်ရှိသော Student ID ကိုထည့်ပါ။';return}const p=myanmarParts(),date=`${p.year}-${p.month}-${p.day}`;try{const existing=await getDocs(query(ref,where('id','==',id),where('date','==',date)));if(!existing.empty){msg.textContent=id+' — '+students[id]+' အတွက် ယနေ့ Attendance ဖြည့်ပြီးသားဖြစ်ပါတယ်။ တစ်ရက်လျှင် တစ်ကြိမ်သာ ဖြည့်နိုင်ပါတယ်။';return}await addDoc(ref,{id,name:students[id],status:s,date,time:`${p.hour}:${p.minute}:${p.second}`,timestamp:new Date().toISOString(),updatedAt:serverTimestamp()});msg.textContent=id+' — '+students[id]+' — '+s+' ကို ယနေ့အတွက် Firebase တွင် သိမ်းပြီးပါပြီ။';document.getElementById('id').value=''}catch(e){msg.textContent='Firebase save error: '+e.message}};</script></body></html>
