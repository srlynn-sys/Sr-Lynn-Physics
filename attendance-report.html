<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Report — Grade 11 Physics</title><link rel="stylesheet" href="academic.css"><style>body{background:linear-gradient(135deg,#f2eee5,#faf9f5)}.export-bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid #6f5a34;border-radius:4px;padding:10px 15px;background:#2f3e4a;color:#fff;font-weight:800;cursor:pointer}.report-wrap{overflow:auto}.report{width:1120px;background:#fffdf8;padding:34px 38px;box-sizing:border-box;color:#243746;font-family:Georgia,"Noto Serif Myanmar",serif;border:1px solid #bdb4a5}.report-header{text-align:center;border-bottom:1px solid #8b6f3d;padding-bottom:15px}.report-logo{width:62px;height:62px}.school{font-size:23px;font-weight:900}.report-title{font-size:18px;font-weight:900;margin-top:7px}.period{font-size:12px;color:#6d7880;margin-top:5px}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.metric{border:1px solid #cfc7b8;padding:11px 8px;background:#fbf8f0;text-align:center}.metric .label{font-size:10px;color:#6d7880;font-weight:800}.metric .value{font-size:20px;font-weight:900;margin-top:4px}.report table{width:100%;border-collapse:collapse;font-size:12px}.report th,.report td{border:1px solid #cfc7b8;padding:9px 8px;text-align:center}.report th{background:#344754;color:#fff}.report td.name{text-align:left;font-weight:700}.note{margin-top:14px;padding:10px 12px;background:#f7f3ea;border-left:3px solid #8b6f3d;font-size:11px;line-height:1.6}.sheet{position:fixed;left:-20000px;top:0}@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="report-card-menu.html">← Report Card Generator</a></div><section class="hero"><h1>📅 For Attending</h1><p>Official Attendance Report Generator</p></section><section class="panel"><div class="note">Historic attendance + submitted live attendance only. Current unfilled day is excluded and is never shown as Absent.</div><div class="export-bar"><button class="btn" id="png">🖼️ PNG ထုတ်မည်</button><button class="btn" id="pdf">📄 A4 Landscape PDF ထုတ်မည်</button></div><div class="report-wrap"><div id="report" class="report"></div></div></section></main><div id="sheet" class="sheet"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students}from'./firebase-data.js';import{historicalAttendance}from'./attendance-homework-policy.js';import{myanmarDateTime}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig)),LOGO='https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ',ids=Object.keys(students);let records=[];const today=()=>myanmarDateTime().date,same=(a,b)=>String(a??'').trim().toUpperCase()===String(b??'').trim().toUpperCase();function realRows(id){const m={};historicalAttendance(id).forEach(x=>m[x.date]=x);records.filter(x=>same(x.id,id)&&x.date<=today()).forEach(x=>m[x.date]={...m[x.date],...x});return Object.values(m).filter(x=>x.status)}function build(){const rs=ids.map(id=>{const r=realRows(id),p=r.filter(x=>String(x.status).toLowerCase()==='present').length,a=r.filter(x=>String(x.status).toLowerCase()==='absent').length,l=r.filter(x=>String(x.status).toLowerCase()==='leave').length;return{id,name:students[id],present:p,absent:a,leave:l,total:r.length,pct:r.length?p/r.length*100:0}}).sort((a,b)=>b.pct-a.pct||a.id.localeCompare(b.id));const tp=rs.reduce((s,r)=>s+r.present,0),ta=rs.reduce((s,r)=>s+r.absent,0),tl=rs.reduce((s,r)=>s+r.leave,0),possible=rs.reduce((s,r)=>s+r.total,0);report.innerHTML='<div class="report-header"><img class="report-logo" src="'+LOGO+'"><div class="school">VICTORY LAND FEDERAL SCHOOL</div><div class="report-title">GRADE 11 PHYSICS — ATTENDANCE REPORT</div><div class="period">Recorded student days · Generated: '+today()+'</div></div><div class="summary"><div class="metric"><div class="label">Recorded Days</div><div class="value">'+possible+'</div></div><div class="metric"><div class="label">Present</div><div class="value">'+tp+'</div></div><div class="metric"><div class="label">Absent</div><div class="value">'+ta+'</div></div><div class="metric"><div class="label">Leave</div><div class="value">'+tl+'</div></div><div class="metric"><div class="label">Overall Recorded</div><div class="value">'+(possible?tp/possible*100:0).toFixed(2)+'%</div></div></div><table><thead><tr><th>Rank</th><th>Student ID</th><th>Student Name</th><th>Recorded Days</th><th>Present</th><th>Absent</th><th>Leave</th><th>Attendance %</th></tr></thead><tbody>'+rs.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+r.id+'</td><td class="name">'+r.name+'</td><td>'+r.total+'</td><td>'+r.present+'</td><td>'+r.absent+'</td><td>'+r.leave+'</td><td><b>'+r.pct.toFixed(2)+'%</b></td></tr>').join('')+'</tbody></table><div class="note"><b>Rule:</b> Each student has an individual recorded-day denominator. Historic Aug 10–Sep 14 data is preserved; a submitted current day is added only for that student. An unfilled current/future day is excluded.</div>'}async function canvas(){sheet.innerHTML=report.outerHTML;sheet.style.display='block';await new Promise(r=>setTimeout(r,150));const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff',useCORS:true});sheet.style.display='none';return c}png.onclick=async()=>{const c=await canvas(),a=document.createElement('a');a.download='Grade11_Physics_Attendance_Report.png';a.href=c.toDataURL('image/png');a.click()};pdf.onclick=async()=>{const c=await canvas(),{jsPDF}=window.jspdf,p=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),m=8,w=281,h=194,q=Math.min(w/c.width,h/c.height);p.addImage(c.toDataURL('image/png'),'PNG',m+(w-c.width*q)/2,m+(h-c.height*q)/2,c.width*q,c.height*q);p.save('Grade11_Physics_Attendance_Report.pdf')};onSnapshot(collection(db,'attendance_records'),s=>{records=s.docs.map(d=>d.data());build()},e=>report.innerHTML='<p>Firebase connection error: '+e.message+'</p>');build();</script></body></html>
