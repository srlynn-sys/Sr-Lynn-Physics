<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Report — Grade 11 Physics</title><link rel="stylesheet" href="academic.css"><style>.export-bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:12px;padding:11px 15px;background:#142b43;color:#fff;font-weight:700;cursor:pointer}.report-wrap{overflow:auto}.report{width:1120px;background:#fff;padding:28px;box-sizing:border-box;color:#142b43}.report h1{text-align:center;margin:0}.sub{text-align:center;color:#718090;margin:5px 0 18px}.report table{width:100%;border-collapse:collapse}.report th,.report td{border:1px solid #ccd8e1;padding:11px;text-align:center}.report th{background:#142b43;color:#fff}.report tr:nth-child(even){background:#f7fafc}.pct{font-weight:900}.note{padding:10px 12px;background:#eef6ff;border-radius:10px;color:#28567c}.sheet{position:fixed;left:-20000px;top:0}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="report-card-menu.html">← Report Card Generator</a></div><section class="hero"><h1>📅 For Attending</h1><p>All Students Attendance Percentage Report</p></section><section class="panel"><div class="note">Attendance period: <b>10 August 2026 → 14 September 2026</b> · School workdays only · Not-entered workdays are counted as Absent.</div><div class="export-bar"><button class="btn" id="png">🖼️ PNG ထုတ်မည်</button><button class="btn" id="pdf">📄 PDF ထုတ်မည်</button></div><div class="report-wrap"><div id="report" class="report"></div></div></section></main><div id="sheet" class="sheet"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds}from'./firebase-data.js';import{schoolDates,historicalAttendance}from'./attendance-homework-policy.js';const db=getFirestore(initializeApp(firebaseConfig)),LOGO='https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ';let records=[];function realRows(id){const map={};historicalAttendance(id).forEach(x=>map[x.date]=x);records.filter(x=>x.id===id&&x.date>='2026-08-10').forEach(x=>map[x.date]={...map[x.date],...x});return Object.values(map)}function build(){const total=schoolDates().length;const rows=studentIds.map(id=>{const r=realRows(id),p=r.filter(x=>x.status==='Present').length,a=r.filter(x=>x.status==='Absent').length,l=r.filter(x=>x.status==='Leave').length;return{id,name:students[id],present:p,absent:a,leave:l,pct:p/total*100}});document.getElementById('report').innerHTML=`<h1>VICTORY LAND FEDERAL SCHOOL</h1><div class="sub">Grade 11 · Physics · Attendance Report · 10 August 2026 — 14 September 2026</div><table><thead><tr><th>Rank</th><th>Student ID</th><th>Student Name</th><th>Present</th><th>Absent</th><th>Leave</th><th>Attendance %</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td style="text-align:left">${r.name}</td><td>${r.present}/${total}</td><td>${r.absent}</td><td>${r.leave}</td><td class="pct">${r.pct.toFixed(2)}%</td></tr>`).join('')}</tbody></table><p style="text-align:center;color:#718090;margin-top:18px">School workdays: ${total} · Firebase Live + Historical Attendance Policy</p>`}async function canvas(){const report=document.getElementById('report'),sheet=document.getElementById('sheet');sheet.innerHTML=`<div style="width:1120px;background:#fff;padding:28px;box-sizing:border-box;color:#142b43"><img src="${LOGO}" style="display:block;width:70px;height:70px;object-fit:contain;margin:0 auto 8px"><h1 style="text-align:center">VICTORY LAND FEDERAL SCHOOL</h1><div style="text-align:center;color:#718090;margin-bottom:18px">Grade 11 · Physics · Attendance Report · 10 August 2026 — 14 September 2026</div>${report.innerHTML}</div>`;sheet.style.display='block';await new Promise(r=>setTimeout(r,100));const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff',useCORS:true});sheet.style.display='none';return c}document.getElementById('png').onclick=async()=>{const c=await canvas();const a=document.createElement('a');a.download='Grade11_Physics_Attendance_Report.png';a.href=c.toDataURL('image/png');a.click()};document.getElementById('pdf').onclick=async()=>{const c=await canvas(),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,297,210);pdf.save('Grade11_Physics_Attendance_Report.pdf')};onSnapshot(collection(db,'attendance_records'),s=>{records=s.docs.map(d=>d.data());build()});build();</script></body></html>
