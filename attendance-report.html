<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance List — Grade 11 Physics</title><link rel="stylesheet" href="academic.css"><style>
body{background:#fff}
.export-bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.month-picker{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.month-picker label{font-weight:700}.month-picker input{padding:10px 12px;border:1px solid #ccd6e3;border-radius:8px;background:#fff;font:inherit}
.btn{border:1px solid #142b43;border-radius:8px;padding:10px 15px;background:#142b43;color:#fff;font-weight:800;cursor:pointer}
.report-wrap{overflow:auto}
.report{position:relative;width:794px;min-height:1123px;background:#fff;color:#111;padding:48px 48px 55px;box-sizing:border-box;font-family:Arial,"Noto Sans Myanmar",sans-serif;border:0;overflow:hidden}
.report:before{content:"";position:absolute;inset:0;background:url('https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ') center center/330px auto no-repeat;opacity:.14;filter:grayscale(1);pointer-events:none}
.report>*{position:relative;z-index:1}
.report-header{text-align:center;margin-bottom:28px}
.report-logo{width:72px;height:72px;object-fit:contain;display:block;margin:0 auto 10px}
.school{font-size:25px;font-weight:800;line-height:1.25}
.subject{font-size:20px;font-weight:700;margin-top:6px}
.report table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.75);border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.report th,.report td{border-right:1px solid rgba(30,45,60,.16);border-bottom:1px solid rgba(30,45,60,.16);padding:10px 8px;text-align:center;height:38px;background:rgba(255,255,255,.28)}
.report th{background:rgba(255,255,255,.42);color:#111;font-weight:800}
.report td.name{text-align:left}.report tr:last-child td{border-bottom:0}.report th:last-child,.report td:last-child{border-right:0}
.signature{position:absolute;right:48px;bottom:32px;text-align:center;font-size:14px;line-height:1.5}
.signature .line{width:150px;border-top:1px solid #222;margin-bottom:4px}
.sheet{position:fixed;left:-20000px;top:0}
@media(max-width:700px){.report{width:794px}.report-wrap{overflow:auto}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="report-card-menu.html">← Report Card Generator</a></div><section class="hero"><h1>📅 For Attending</h1><p>Attendance List Generator</p></section><section class="panel"><div class="month-picker"><label for="month">Attendance Month</label><input id="month" type="month"></div><div class="export-bar"><button class="btn" id="png">🖼️ PNG ထုတ်မည်</button><button class="btn" id="pdf">📄 A4 PDF ထုတ်မည်</button></div><div class="report-wrap"><div id="report" class="report"></div></div></section></main><div id="sheet" class="sheet"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';
import{firebaseConfig,students,studentIds,myanmarDateTime}from'./firebase-data.js';
import{historicalAttendance}from'./attendance-homework-policy.js';
const db=getFirestore(initializeApp(firebaseConfig)),LOGO='https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ',ids=studentIds;
let records=[],settings={};
const monthEl=document.getElementById('month'),today=()=>myanmarDateTime().date;
const now=today().slice(0,7);monthEl.value=now;
const same=(a,b)=>String(a??'').trim().toUpperCase()===String(b??'').trim().toUpperCase();
const vt=v=>v&&typeof v.toMillis==='function'?v.toMillis():v instanceof Date?v.getTime():typeof v==='number'?v:new Date(v).getTime()||0;
const tm=x=>vt(x?.timestamp)||vt(x?.updatedAt)||vt(x?.date&&x?.time?x.date+'T'+x.time:x?.date?x.date+'T00:00:00':0);
const cut=()=>Math.max(...[settings.allResetAt,settings.gradingResetAt,settings.attendanceResetAt].filter(Boolean).map(vt).filter(Boolean),0);
function realRows(id){const c=cut(),m={};historicalAttendance(id).filter(x=>x.date<=today()&&(!c||tm(x)>=c)).forEach(x=>m[x.date]=x);records.filter(x=>same(x.id,id)&&x.date<=today()&&(!c||tm(x)>=c)).forEach(x=>m[x.date]={...m[x.date],...x});return Object.values(m).filter(x=>x.status)}
function monthRows(id,ym){return realRows(id).filter(x=>String(x.date||'').slice(0,7)===ym)}
function monthLabel(ym){const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleString('en-US',{month:'long',year:'numeric'})}
function build(){
 const ym=monthEl.value||now;
 const all=ids.flatMap(id=>monthRows(id,ym));
 const classDays=[...new Set(all.map(x=>x.date).filter(Boolean))].sort();
 const rows=ids.map(id=>{const r=monthRows(id,ym),p=r.filter(x=>String(x.status).toLowerCase()==='present').length;return{id,name:students[id],present:p,pct:classDays.length?p/classDays.length*100:0}}).sort((a,b)=>a.id.localeCompare(b.id));
 report.innerHTML='<div class="report-header"><img class="report-logo" crossorigin="anonymous" src="'+LOGO+'"><div class="school">VICTORY LAND FEDERAL SCHOOL</div><div class="subject">Subject-Physics</div></div><table><thead><tr><th>No</th><th>Code</th><th>Name</th><th>Total Present Day</th><th>Percentage</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+r.id+'</td><td class="name">'+r.name+'</td><td>'+r.present+'</td><td>'+r.pct.toFixed(2)+'%</td></tr>').join('')+'</tbody></table><div class="signature"><div class="line"></div><div>Teacher Sign</div></div></div>';
}
async function canvas(){sheet.innerHTML=report.outerHTML;sheet.style.display='block';await new Promise(r=>setTimeout(r,250));const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff',useCORS:true,allowTaint:false});sheet.style.display='none';return c}
png.onclick=async()=>{const c=await canvas(),a=document.createElement('a');a.download='Attendance_List_'+monthEl.value+'.png';a.href=c.toDataURL('image/png');a.click()};
pdf.onclick=async()=>{const c=await canvas(),{jsPDF}=window.jspdf,p=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'}),w=210,h=297,q=Math.min(w/c.width,h/c.height),iw=c.width*q,ih=c.height*q;p.addImage(c.toDataURL('image/png'),'PNG',(w-iw)/2,(h-ih)/2,iw,ih);p.save('Attendance_List_'+monthEl.value+'.pdf')};
monthEl.addEventListener('change',build);
onSnapshot(collection(db,'attendance_records'),s=>{records=s.docs.map(d=>d.data());build()},e=>report.innerHTML='<p>Firebase connection error: '+e.message+'</p>');
onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};build()});
build();
</script></body></html>
