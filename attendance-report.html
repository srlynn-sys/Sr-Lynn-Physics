<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Report — Grade 11 Physics</title><link rel="stylesheet" href="academic.css"><style>:root{--navy:#17324d;--blue:#2f6fa8;--line:#d8e1e8;--green:#187a55;--red:#b94a48;--gold:#b68a2c}.export-bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}.report-wrap{overflow:auto}.report{width:1120px;background:#fff;padding:34px 38px;box-sizing:border-box;color:#17324d;font-family:Arial,"Noto Sans Myanmar",sans-serif}.report-header{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:15px}.report-logo{width:68px;height:68px;object-fit:contain;margin:0 auto 7px;display:block}.school{font-size:23px;font-weight:900}.report-title{font-size:19px;font-weight:900;margin-top:6px}.period{font-size:13px;color:#657789;margin-top:5px}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}.metric{border:1px solid var(--line);border-radius:13px;padding:12px;background:linear-gradient(135deg,#fff,#f5f9fc);text-align:center}.metric .label{font-size:10px;color:#657789;font-weight:800}.metric .value{font-size:21px;font-weight:900;margin-top:4px}.present .value{color:var(--green)}.absent .value{color:var(--red)}.leave .value{color:var(--gold)}.overall .value{color:var(--blue)}.report table{width:100%;border-collapse:collapse;font-size:13px}.report th,.report td{border:1px solid var(--line);padding:10px;text-align:center}.report th{background:var(--navy);color:#fff}.report tbody tr:nth-child(even){background:#f7fafc}.report td.name{text-align:left;font-weight:700}.pct{font-weight:900}.good{color:var(--green)}.warn{color:var(--red)}.note{margin-top:14px;padding:10px 12px;background:#f3f7fa;border-left:4px solid var(--blue);font-size:11px;line-height:1.6}.footer{display:flex;justify-content:space-between;margin-top:25px;padding-top:12px;border-top:1px solid var(--line);font-size:10px;color:#748392}.signature{margin-top:25px;display:flex;justify-content:flex-end}.sigbox{width:180px;text-align:center;border-top:1px solid #8b98a4;padding-top:6px;font-size:11px}.sheet{position:fixed;left:-20000px;top:0}@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="report-card-menu.html">← Report Card Generator</a></div><section class="hero"><h1>📅 For Attending</h1><p>Official Attendance Report Generator</p></section><section class="panel"><div class="note">Attendance data ကို <b>Firebase attendance_records</b> မှ တိုက်ရိုက်ယူပြီး 10 August 2026 မှ ယနေ့အထိ Monday–Friday စာသင်ရက်များအပေါ်တွက်ချက်ပါသည်။ မဖြည့်ထားသော စာသင်ရက်ကို Absent အဖြစ်တွက်ပါသည်။</div><div class="export-bar"><button class="btn" id="png">🖼️ PNG ထုတ်မည်</button><button class="btn" id="pdf">📄 A4 Landscape PDF ထုတ်မည်</button></div><div class="report-wrap"><div id="report" class="report"></div></div></section></main><div id="sheet" class="sheet"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students}from'./firebase-data.js';import{schoolDates,historicalAttendance}from'./attendance-homework-policy.js';import{forcedAbsent}from'./attendance-authority.js';const db=getFirestore(initializeApp(firebaseConfig)),LOGO='https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ';const studentIds=Object.keys(students);let records=[];function today(){return new Date().toISOString().slice(0,10)}function currentDates(){return schoolDates().filter(d=>d<=today())}function realRows(id){const map={};historicalAttendance(id).filter(x=>x.date<=today()).forEach(x=>map[x.date]=x);records.filter(x=>x.id===id&&!forcedAbsent(id,x.date)&&x.date>='2026-08-10'&&x.date<=today()).forEach(x=>map[x.date]={...map[x.date],...x});return currentDates().map(date=>map[date]||{id,date,status:'Absent'})}function build(){const dates=currentDates(),total=dates.length||1;const rows=studentIds.map(id=>{const r=realRows(id),present=r.filter(x=>x.status==='Present').length,absent=r.filter(x=>x.status==='Absent').length,leave=r.filter(x=>x.status==='Leave').length;return{id,name:students[id],present,absent,leave,pct:present/total*100}}).sort((a,b)=>b.pct-a.pct||a.id.localeCompare(b.id));const tp=rows.reduce((s,r)=>s+r.present,0),ta=rows.reduce((s,r)=>s+r.absent,0),tl=rows.reduce((s,r)=>s+r.leave,0),possible=total*rows.length,overall=tp/possible*100;document.getElementById('report').innerHTML=`<div class="report-header"><img class="report-logo" src="${LOGO}"><div class="school">VICTORY LAND FEDERAL SCHOOL</div><div class="report-title">GRADE 11 PHYSICS — ATTENDANCE REPORT</div><div class="period">Attendance Period: 10 August 2026 — ${today()} · Monday–Friday</div></div><div class="summary"><div class="metric"><div class="label">Total School Days</div><div class="value">${total} Days</div></div><div class="metric present"><div class="label">Total Present</div><div class="value">${tp}</div></div><div class="metric absent"><div class="label">Total Absent</div><div class="value">${ta}</div></div><div class="metric leave"><div class="label">Total Leave</div><div class="value">${tl}</div></div><div class="metric overall"><div class="label">Overall Attendance</div><div class="value">${overall.toFixed(2)}%</div></div></div><table><thead><tr><th>Rank</th><th>Student ID</th><th>Student Name</th><th>Total School Days</th><th>Present</th><th>Absent</th><th>Leave</th><th>Attendance %</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td class="name">${r.name}</td><td>${total}</td><td class="good"><b>${r.present}</b></td><td class="warn"><b>${r.absent}</b></td><td>${r.leave}</td><td class="pct">${r.pct.toFixed(2)}%</td></tr>`).join('')}</tbody></table><div class="note"><b>Calculation:</b> Attendance % = Present ÷ Total School Days × 100. ယနေ့အထိ စာသင်ရက်အားလုံး တက်ရောက်ထားလျှင် <b>100%</b> ဖြစ်ပါမည်။</div><div class="footer"><span>Firebase Live Attendance Records · Monday–Friday</span><span>Report generated: ${today()}</span></div><div class="signature"><div class="sigbox">Authorized Signature</div></div>`}async function canvas(){const sheet=document.getElementById('sheet');sheet.innerHTML=document.getElementById('report').outerHTML;sheet.style.display='block';await new Promise(r=>setTimeout(r,150));const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff',useCORS:true});sheet.style.display='none';return c}document.getElementById('png').onclick=async()=>{const c=await canvas(),a=document.createElement('a');a.download='Grade11_Physics_Attendance_Report.png';a.href=c.toDataURL('image/png');a.click()};document.getElementById('pdf').onclick=async()=>{const c=await canvas(),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),margin=8,w=297-margin*2,h=210-margin*2,ratio=Math.min(w/c.width,h/c.height),iw=c.width*ratio,ih=c.height*ratio;pdf.addImage(c.toDataURL('image/png'),'PNG',margin+(w-iw)/2,margin+(h-ih)/2,iw,ih);pdf.setProperties({title:'Grade 11 Physics Attendance Report',author:'Victory Land Federal School'});pdf.save('Grade11_Physics_Attendance_Report.pdf')};onSnapshot(collection(db,'attendance_records'),s=>{records=s.docs.map(d=>d.data());build()},e=>document.getElementById('report').innerHTML='<p>Firebase connection error: '+e.message+'</p>');build();</script></body></html>
