<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Report — Grade 11 Physics</title><link rel="stylesheet" href="academic.css"><style>:root{--ink:#243746;--line:#cfc7b8;--paper:#fffdf8;--accent:#8b6f3d}body{background:linear-gradient(135deg,#f2eee5,#faf9f5)}.export-bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid #6f5a34;border-radius:4px;padding:10px 15px;background:#2f3e4a;color:#fff;font-weight:800;cursor:pointer}.report-wrap{overflow:auto}.report{width:1120px;background:var(--paper);padding:34px 38px;box-sizing:border-box;color:var(--ink);font-family:Georgia,"Noto Serif Myanmar",serif;border:1px solid #bdb4a5}.report-header{text-align:center;border-bottom:1px solid var(--accent);padding-bottom:15px}.report-logo{width:62px;height:62px}.school{font-size:23px;font-weight:900}.report-title{font-size:18px;font-weight:900;margin-top:7px}.period{font-size:12px;color:#6d7880;margin-top:5px}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.metric{border:1px solid var(--line);padding:11px 8px;background:#fbf8f0;text-align:center}.metric .label{font-size:10px;color:#6d7880;font-weight:800}.metric .value{font-size:20px;font-weight:900;margin-top:4px}.report table{width:100%;border-collapse:collapse;font-size:12px}.report th,.report td{border:1px solid var(--line);padding:9px 8px;text-align:center}.report th{background:#344754;color:#fff}.report td.name{text-align:left;font-weight:700}.note{margin-top:14px;padding:10px 12px;background:#f7f3ea;border-left:3px solid var(--accent);font-size:11px;line-height:1.6}.sheet{position:fixed;left:-20000px;top:0}@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}}@media print{.report{box-shadow:none}}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="report-card-menu.html">← Report Card Generator</a></div><section class="hero"><h1>📅 For Attending</h1><p>Official Attendance Report Generator</p></section><section class="panel"><div class="note">Historic attendance + ကျောင်းသားက တကယ်ဖြည့်ထားသော live attendance ကိုသာ တွက်ချက်ပါသည်။ လက်ရှိနေ့ မဖြည့်ရသေးလျှင် Absent မပြဘဲ မတွက်သေးပါ။</div><div class="export-bar"><button class="btn" id="png">🖼️ PNG ထုတ်မည်</button><button class="btn" id="pdf">📄 A4 Landscape PDF ထုတ်မည်</button></div><div class="report-wrap"><div id="report" class="report"></div></div></section></main><div id="sheet" class="sheet"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students}from'./firebase-data.js';import{historicalAttendance,today}from'./attendance-homework-policy.js';import{forcedAbsent}from'./attendance-authority.js';const db=getFirestore(initializeApp(firebaseConfig)),LOGO='https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ');const ids=Object.keys(students);let records=[];function same(a,b){return String(a??'').trim().toUpperCase()===String(b??'').trim().toUpperCase()}function realRows(id){const map={};historicalAttendance(id).forEach(x=>map[x.date]=x);records.filter(x=>same(x.id,id)&&x.date>='2026-08-10'&&x.date<=today()&&!forcedAbsent(id,x.date)).forEach(x=>map[x.date]={...map[x.date],...x});return Object.values(map).filter(x=>x.status)}function build(){const rs=ids.map(id=>{const r=realRows(id),present=r.filter(x=>String(x.status??'').trim().toLowerCase()==='present').length,absent=r.filter(x=>String(x.status??'').trim().toLowerCase()==='absent').length,leave=r.filter(x=>String(x.status??'').trim().toLowerCase()==='leave').length,total=r.length;return{id,name:students[id],present,absent,leave,total,pct:total?present/total*100:0}}).sort((a,b)=>b.pct-a.pct||a.id.localeCompare(b.id));const tp=rs.reduce((s,r)=>s+r.present,0),ta=rs.reduce((s,r)=>s+r.absent,0),tl=rs.reduce((s,r)=>s+r.leave,0),possible=rs.reduce((s,r)=>s+r.total,0),overall=possible?tp/possible*100:0;document.getElementById('report').innerHTML=`<div class="report-header"><img class="report-logo" src="${LOGO}"><div class="school">VICTORY LAND FEDERAL SCHOOL</div><div class="report-title">GRADE 11 PHYSICS — ATTENDANCE REPORT</div><div class="period">Historic + submitted live records · Generated: ${today()}</div></div><div class="summary"><div class="metric"><div class="label">Calendar School Days</div><div class="value">${requireDays()} Days</div></div><div class="metric"><div class="label">Recorded Present</div><div class="value">${tp}</div></div><div class="metric"><div class="label">Recorded Absent</div><div class="value">${ta}</div></div><div class="metric"><div class="label">Leave</div><div class="value">${tl}</div></div><div class="metric"><div class="label">Overall Recorded</div><div class="value">${overall.toFixed(2)}%</div></div></div><table><thead><tr><th>Rank</th><th>Student ID</th><th>Student Name</th><th>Recorded Days</th><th>Present</th><th>Absent</th><th>Leave</th><th>Attendance %</th></tr></thead><tbody>${rs.map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td class="name">${r.name}</td><td>${r.total}</td><td>${r.present}</td><td>${r.absent}</td><td>${r.leave}</td><td><b>${r.pct.toFixed(2)}%</b></td></tr>`).join('')}</tbody></table><div class="note"><b>Rule:</b> Current/future school days are not counted until the student submits attendance. Therefore, if 002 submits today, 002 has one more recorded day; students who have not submitted today remain at the previous recorded-day total. No unfilled day is shown as Absent.</div>`}function requireDays(){const s=new Set();records.forEach(x=>{if(x.date&&x.date>='2026-08-10'&&x.date<=today())s.add(x.date)});return Math.max(26,s.size)}async function canvas(){const sheet=document.getElementById('sheet');sheet.innerHTML=document.getElementById('report').outerHTML;sheet.style.display='block';await new Promise(r=>setTimeout(r,150));const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff',useCORS:true});sheet.style.display='none';return c}png.onclick=async()=>{const c=await canvas(),a=document.createElement('a');a.download='Grade11_Physics_Attendance_Report.png';a.href=c.toDataURL('image/png');a.click()};pdf.onclick=async()=>{const c=await canvas(),{jsPDF}=window.jspdf,p=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),m=8,w=297-2*m,h=210-2*m,q=Math.min(w/c.width,h/c.height);p.addImage(c.toDataURL('image/png'),'PNG',m+(w-c.width*q)/2,m+(h-c.height*q)/2,c.width*q,c.height*q);p.save('Grade11_Physics_Attendance_Report.pdf')};onSnapshot(collection(db,'attendance_records'),s=>{records=s.docs.map(d=>d.data());build()},e=>document.getElementById('report').innerHTML='<p>Firebase connection error: '+e.message+'</p>');build();</script></body></html>
