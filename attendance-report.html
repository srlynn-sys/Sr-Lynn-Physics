<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance Report — Grade 11 Physics</title>
<link rel="stylesheet" href="academic.css">
<style>
:root{--navy:#17324d;--blue:#2f6fa8;--line:#d8e1e8;--soft:#f4f8fb;--green:#187a55;--red:#b94a48;--gold:#b68a2c}
.export-bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 5px 14px #17324d20}.btn:hover{transform:translateY(-1px)}
.report-wrap{overflow:auto}.report{width:1120px;background:#fff;padding:34px 38px;box-sizing:border-box;color:#17324d;font-family:Arial,"Noto Sans Myanmar",sans-serif}.report-header{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:15px}.report-logo{width:68px;height:68px;object-fit:contain;margin:0 auto 7px;display:block}.school{font-size:23px;font-weight:900;letter-spacing:.6px}.report-title{font-size:19px;font-weight:900;margin-top:6px}.period{font-size:13px;color:#657789;margin-top:5px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.metric{border:1px solid var(--line);border-radius:13px;padding:13px 15px;background:linear-gradient(135deg,#fff,#f5f9fc);text-align:center}.metric .label{font-size:11px;color:#657789;font-weight:800;text-transform:uppercase;letter-spacing:.5px}.metric .value{font-size:23px;font-weight:900;margin-top:4px;color:var(--navy)}.metric.present .value{color:var(--green)}.metric.absent .value{color:var(--red)}.metric.leave .value{color:var(--gold)}
.report table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}.report th,.report td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 9px;text-align:center}.report th{background:var(--navy);color:#fff;font-weight:800}.report th:last-child,.report td:last-child{border-right:0}.report tr:last-child td{border-bottom:0}.report tbody tr:nth-child(even){background:#f7fafc}.report td.name{text-align:left;font-weight:700}.pct{font-weight:900}.good{color:var(--green)}.warn{color:var(--red)}.note{margin-top:14px;padding:10px 12px;background:#f3f7fa;border-left:4px solid var(--blue);font-size:11px;color:#566a7b;line-height:1.6}.footer{display:flex;justify-content:space-between;margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:10px;color:#748392}.signature{margin-top:25px;display:flex;justify-content:flex-end}.sigbox{width:180px;text-align:center;border-top:1px solid #8b98a4;padding-top:6px;font-size:11px;color:#566a7b}.sheet{position:fixed;left:-20000px;top:0}.print-only{display:none}
@media(max-width:700px){.report{width:100%;padding:22px}.summary{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="report-card-menu.html">← Report Card Generator</a></div>
<section class="hero"><h1>📅 For Attending</h1><p>Official Attendance Report Generator</p></section>
<section class="panel"><div class="note">Attendance period: <b>10 August 2026 → 14 September 2026</b> · Monday–Friday school days only · Missing entries are counted as Absent.</div>
<div class="export-bar"><button class="btn" id="png">🖼️ PNG ထုတ်မည်</button><button class="btn" id="pdf">📄 A4 Landscape PDF ထုတ်မည်</button></div>
<div class="report-wrap"><div id="report" class="report"></div></div></section></main>
<div id="sheet" class="sheet"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import{getFirestore,collection,onSnapshot}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';
import{firebaseConfig,students}from'./firebase-data.js';
import{schoolDates,historicalAttendance}from'./attendance-homework-policy.js';
const db=getFirestore(initializeApp(firebaseConfig)),LOGO='https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ';
const studentIds=Object.keys(students);let records=[];
function realRows(id){const map={};historicalAttendance(id).forEach(x=>map[x.date]=x);records.filter(x=>x.id===id&&x.date>='2026-08-10'&&x.date<='2026-09-14').forEach(x=>map[x.date]={...map[x.date],...x});return Object.values(map)}
function build(){
 const dates=schoolDates(),total=dates.length;
 const rows=studentIds.map(id=>{const r=realRows(id),present=r.filter(x=>x.status==='Present').length,absent=r.filter(x=>x.status==='Absent').length,leave=r.filter(x=>x.status==='Leave').length;return{id,name:students[id],present,absent,leave,pct:total?present/total*100:0}});
 const totalPresent=rows.reduce((s,r)=>s+r.present,0),totalAbsent=rows.reduce((s,r)=>s+r.absent,0),totalLeave=rows.reduce((s,r)=>s+r.leave,0),possible=total*rows.length,totalPct=possible?totalPresent/possible*100:0;
 rows.sort((a,b)=>b.pct-a.pct||a.id.localeCompare(b.id));
 document.getElementById('report').innerHTML=`
 <div class="report-header"><img class="report-logo" src="${LOGO}"><div class="school">VICTORY LAND FEDERAL SCHOOL</div><div class="report-title">GRADE 11 PHYSICS — ATTENDANCE REPORT</div><div class="period">Attendance Period: 10 August 2026 — 14 September 2026 · Monday–Friday</div></div>
 <div class="summary">
  <div class="metric"><div class="label">Total School Days</div><div class="value">${total}</div></div>
  <div class="metric present"><div class="label">Total Present</div><div class="value">${totalPresent}</div></div>
  <div class="metric absent"><div class="label">Total Absent</div><div class="value">${totalAbsent}</div></div>
  <div class="metric leave"><div class="label">Total Leave</div><div class="value">${totalLeave}</div></div>
 </div>
 <table><thead><tr><th>Rank</th><th>Student ID</th><th>Student Name</th><th>Total School Days</th><th>Present</th><th>Absent</th><th>Leave</th><th>Attendance %</th></tr></thead><tbody>
 ${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td class="name">${r.name}</td><td>${total}</td><td class="good"><b>${r.present}</b></td><td class="warn"><b>${r.absent}</b></td><td>${r.leave}</td><td class="pct">${r.pct.toFixed(2)}%</td></tr>`).join('')}</tbody></table>
 <div class="note"><b>Overall attendance:</b> ${totalPresent} attended out of ${possible} student-days = <b>${totalPct.toFixed(2)}%</b>. Attendance % is calculated as Present ÷ Total School Days. Leave is shown separately and is not counted as Present.</div>
 <div class="footer"><span>Generated from Firebase live attendance records + school attendance policy</span><span>Report date: 14 September 2026</span></div>
 <div class="signature"><div class="sigbox">Authorized Signature</div></div>`;
}
async function canvas(){const report=document.getElementById('report'),sheet=document.getElementById('sheet');sheet.innerHTML=report.outerHTML;sheet.style.display='block';await new Promise(r=>setTimeout(r,150));const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff',useCORS:true,logging:false});sheet.style.display='none';return c}
document.getElementById('png').onclick=async()=>{const c=await canvas();const a=document.createElement('a');a.download='Grade11_Physics_Attendance_Report_2026-09-14.png';a.href=c.toDataURL('image/png');a.click()};
document.getElementById('pdf').onclick=async()=>{const c=await canvas(),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});const img=c.toDataURL('image/png'),margin=8,w=297-margin*2,h=210-margin*2,ratio=Math.min(w/(c.width),h/(c.height)),iw=c.width*ratio,ih=c.height*ratio;pdf.addImage(img,'PNG',margin+(w-iw)/2,margin+(h-ih)/2,iw,ih);pdf.setProperties({title:'Grade 11 Physics Attendance Report',subject:'Attendance Report — 10 August 2026 to 14 September 2026',author:'Victory Land Federal School'});pdf.save('Grade11_Physics_Attendance_Report_2026-09-14.pdf')};
onSnapshot(collection(db,'attendance_records'),s=>{records=s.docs.map(d=>d.data());build()});build();
</script></body></html>
