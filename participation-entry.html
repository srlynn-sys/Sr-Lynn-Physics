<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Participation ဖြည့်ရန်</title><link rel="stylesheet" href="academic.css"><style>input{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccd6e3;border-radius:10px}button{padding:12px 18px;border:0;border-radius:10px;background:#0f2747;color:#fff;font-weight:700}.clock{padding:14px;background:#f6f8fb;border-radius:12px;margin:15px 0}.msg{margin-top:14px;padding:12px;border-radius:10px}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="participation.html">← Participation</a></div><section class="hero"><h1>⭐ Participation ဖြည့်ရန်</h1><p>Firebase Cloud Data • Maximum 30 marks</p></section><section class="panel"><div id="clock" class="clock"></div><label>Student ID</label><input id="id" placeholder="11MM 003" autocomplete="off"><label>Participation Mark / 30</label><input id="mark" type="number" min="0" max="30" step="1"><button id="saveBtn">Save Participation</button><p id="msg" class="msg"></p></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,doc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,myanmarParts}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig));const clock=document.getElementById('clock'),msg=document.getElementById('msg');function tick(){const p=myanmarParts();clock.textContent=`Myanmar Time — ${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}:${p.second} (UTC+06:30)`}setInterval(tick,1000);tick();document.getElementById('saveBtn').onclick=async()=>{const id=document.getElementById('id').value.trim().toUpperCase(),m=Number(document.getElementById('mark').value);if(!students[id]){msg.textContent='Student ID မမှန်ပါ။ အသုံးပြုခွင့်ရှိသော Student ID ကိုထည့်ပါ။';return}if(!Number.isFinite(m)||m<0||m>30){msg.textContent='Participation mark ကို 0–30 အတွင်းထည့်ပါ။';return}const p=myanmarParts(),d=new Date();try{await setDoc(doc(db,'participation_records',id),{id,name:students[id],mark:m,date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}:${p.second}`,timestamp:d.toISOString(),updatedAt:serverTimestamp()});msg.textContent=`${id} — ${students[id]} — ${m}/30 ကို Firebase တွင် သိမ်းပြီးပါပြီ။ Device အားလုံးမှာ sync ဖြစ်ပါမည်။`;document.getElementById('id').value='';document.getElementById('mark').value=''}catch(e){msg.textContent='Firebase save error: '+e.message}};</script></body></html>
