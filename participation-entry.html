<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Participation ဖြည့်ရန်</title><link rel="stylesheet" href="academic.css"><style>input{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccd6e3;border-radius:10px}button{padding:12px 18px;border:0;border-radius:10px;background:#0f2747;color:#fff;font-weight:700}.clock{padding:14px;background:#f6f8fb;border-radius:12px;margin:15px 0}.msg{margin-top:14px;padding:12px;border-radius:10px}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="participation.html">← Participation</a></div><section class="hero"><h1>⭐ Participation ဖြည့်ရန်</h1><p>Teacher-only entry • Maximum 30 marks</p></section><section class="panel"><div id="clock" class="clock"></div><label>Student ID</label><input id="id" placeholder="11MM 003" autocomplete="off"><label>Participation Mark / 30</label><input id="mark" type="number" min="0" max="30" step="1"><button onclick="save()">Save Participation</button><p id="msg" class="msg"></p></section></main><script>const TZ='Asia/Yangon';function parts(d){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d).reduce((o,x)=>(o[x.type]=x.value,o),{})}function clockNow(){const p=parts(new Date());document.getElementById('clock').textContent='Myanmar Time — '+p.year+'-'+p.month+'-'+p.day+' '+p.hour+':'+p.minute+':'+p.second+' (UTC+06:30)'}setInterval(clockNow,1000);clockNow();function save(){const id=document.getElementById('id').value.trim().toUpperCase(),m=Number(document.getElementById('mark').value),msg=document.getElementById('msg');if(!id||!Number.isFinite(m)||m<0||m>30){msg.textContent='Student ID နှင့် 0–30 mark ထည့်ပါ။';return}const d=new Date(),p=parts(d),item={id,mark:m,date:p.year+'-'+p.month+'-'+p.day,time:p.hour+':'+p.minute+':'+p.second,timestamp:d.toISOString(),enteredBy:'teacher'};const rows=JSON.parse(localStorage.getItem('participation_records')||'[]');rows.push(item);localStorage.setItem('participation_records',JSON.stringify(rows));msg.textContent=id+' — '+m+'/30 — '+item.date+' '+item.time+' Myanmar Time ဖြင့် သိမ်းပြီးပါပြီ။';document.getElementById('id').value='';document.getElementById('mark').value='';}</script></body></html>
