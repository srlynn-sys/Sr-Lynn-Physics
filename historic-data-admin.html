<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historic Data Admin</title><link rel="stylesheet" href="academic.css"><style>body{margin:0;background:linear-gradient(135deg,#eef3f8,#fffaf0);font-family:system-ui;color:#17324d}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dce6ee;border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:0 14px 45px #263f5815}.head{background:linear-gradient(135deg,#102a43,#24577a);color:#fff}.head h1{color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd6df;border-radius:11px;background:#fff;font-size:1rem}.btn{border:0;border-radius:12px;padding:12px 16px;background:#102a43;color:#fff;font-weight:800;cursor:pointer}.gold{background:#c9a227;color:#17263a}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{border:1px solid #dce6ee;padding:9px;text-align:center}.table th{background:#102a43;color:#fff}.msg{padding:12px;border-radius:12px;background:#f5f8fb}@media(max-width:700px){.grid{grid-template-columns:1fr}.btn{width:100%}}</style></head><body><main class="wrap"><section class="card head"><div class="row"><div><div>FIREBASE REALTIME · ADMIN</div><h1>🗂️ Historic Attendance & Homework</h1><div>2026-08-10 → 2026-09-14 · 26 school days</div></div><button class="btn gold" onclick="location.href='admin-panel.html'">⚙️ Admin Panel</button></div></section><section class="card"><h2>📅 Historic Record Editor</h2><div class="grid"><div class="field"><label>Student</label><select id="student"><option value="">— Student ရွေးပါ —</option><option value="11MM 002">11MM 002 — မမေဖြိုးဦး</option><option value="11MM 003">11MM 003 — နော်ခိုင်ဇင်ဝင့်သူ</option><option value="11MM 005">11MM 005 — မောင်ခန့်လင်းလက်ပိုင်</option><option value="11MM 006">11MM 006 — မနော်ပွင့်ဖူးမြိုင်</option><option value="11MM 008">11MM 008 — မဝင်းလဲ့မှူးအိမ်</option><option value="11MM 009">11MM 009 — မဆုမြတ်နဒီကျော်</option><option value="11MM 010">11MM 010 — မောင်စောရှိုင်းလင်းခိုင်</option></select></div><div class="field"><label>Date</label><input id="date" type="date" min="2026-08-10" max="2026-09-14"></div><div class="field"><label>Attendance</label><select id="attendance"><option>Present</option><option>Absent</option><option>Leave</option></select></div><div class="field"><label>Homework</label><select id="homework"><option value="completed">Completed</option><option value="not_completed">Not Completed</option></select></div></div><p><button class="btn gold" id="save">💾 Save Historic Record</button> <button class="btn" id="load">🔎 Load Existing Record</button></p><div id="msg" class="msg">Ready.</div></section><section class="card"><div class="row"><h2>📊 Current 26-Day Data</h2><button class="btn" id="refresh">↻ Refresh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Attendance</th><th>Homework</th><th>Source</th></tr></thead><tbody id="rows"><tr><td colspan="4">Student ရွေးပါ။</td></tr></tbody></table></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig)),START='2026-08-10',END='2026-09-14',students={'11MM 002':'မမေဖြိုးဦး','11MM 003':'နော်ခိုင်ဇင်ဝင့်သူ','11MM 005':'မောင်ခန့်လင်းလက်ပိုင်','11MM 006':'မနော်ပွင့်ဖူးမြိုင်','11MM 008':'မဝင်းလဲ့မှူးအိမ်','11MM 009':'မဆုမြတ်နဒီကျော်','11MM 010':'မောင်စောရှိုင်းလင်းခိုင်'},student=document.getElementById('student'),date=document.getElementById('date'),attendance=document.getElementById('attendance'),homework=document.getElementById('homework'),msg=document.getElementById('msg'),rows=document.getElementById('rows');let ar=[],hr=[];function same(a,b){return String(a??'').trim().toUpperCase()===String(b??'').trim().toUpperCase()}function valid(d){return d>=START&&d<=END}function load(){const a=ar.find(x=>same(x.id,student.value)&&x.date===date.value),h=hr.find(x=>same(x.id,student.value)&&x.date===date.value);if(a)attendance.value=a.status;if(h)homework.value=h.completed?'completed':'not_completed';msg.textContent=a||h?'✓ Existing Firebase record loaded.':'Baseline record — Save to create admin-managed record.'}function render(){if(!student.value){rows.innerHTML='<tr><td colspan="4">Student ရွေးပါ။</td></tr>';return}const m={};ar.filter(x=>same(x.id,student.value)&&valid(x.date)).forEach(x=>m[x.date]={...(m[x.date]||{}),a:x});hr.filter(x=>same(x.id,student.value)&&valid(x.date)).forEach(x=>m[x.date]={...(m[x.date]||{}),h:x});rows.innerHTML=Object.keys(m).sort().map(d=>{const a=m[d].a,h=m[d].h;return '<tr><td>'+d+'</td><td>'+(a?.status||'—')+'</td><td>'+(h?(h.completed?'Completed':'Not Completed'):'—')+'</td><td>'+(a||h?'Firebase Record':'Baseline')+'</td></tr>'}).join('')||'<tr><td colspan="4">No records yet.</td></tr>'}student.onchange=()=>{render();load()};date.onchange=load;document.getElementById('load').onclick=load;document.getElementById('refresh').onclick=render;document.getElementById('save').onclick=async()=>{if(!student.value)return alert('Student ကိုရွေးပါ။');if(!valid(date.value))return alert('2026-08-10 မှ 2026-09-14 အတွင်း date ရွေးပါ။');const id=student.value;try{await setDoc(doc(db,'attendance_records',id+'_'+date.value),{id,name:students[id],status:attendance.value,date:date.value,time:new Date().toLocaleTimeString('en-GB',{hour12:false}),timestamp:serverTimestamp(),updatedAt:serverTimestamp(),adminManaged:true},{merge:true});await setDoc(doc(db,'homework_records',id+'_'+date.value),{id,name:students[id],completed:homework.value==='completed',status:homework.value==='completed'?'Completed':'Not Completed',date:date.value,time:new Date().toLocaleTimeString('en-GB',{hour12:false}),timestamp:serverTimestamp(),updatedAt:serverTimestamp(),adminManaged:true},{merge:true});msg.textContent='✓ Historic Attendance + Homework saved.'}catch(e){msg.textContent='Save error: '+e.message}};onSnapshot(collection(db,'attendance_records'),s=>{ar=s.docs.map(d=>d.data());render();load()},e=>msg.textContent='Attendance Firebase error: '+e.message);onSnapshot(collection(db,'homework_records'),s=>{hr=s.docs.map(d=>d.data());render();load()},e=>msg.textContent='Homework Firebase error: '+e.message);date.value=END;</script></body></html>
