<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Grading Result</title><link rel="stylesheet" href="academic.css"><style>
body{background:linear-gradient(135deg,#eef3f8,#fffaf0)}.wrap{max-width:760px;margin:auto;padding:18px}.card{position:relative;overflow:hidden;background:#fff;border:4px solid #173b59;border-radius:18px;padding:28px;box-shadow:0 15px 45px #142b4318}.watermark{position:absolute;left:50%;top:55%;width:430px;height:430px;transform:translate(-50%,-50%);object-fit:contain;opacity:.09;z-index:0;pointer-events:none}.content{position:relative;z-index:1}.head{text-align:center;border-bottom:3px solid #d4af37;padding-bottom:15px;margin-bottom:18px}.logo{width:78px;height:78px;object-fit:contain}.school{font-size:25px;font-weight:900}.title{font-size:21px;color:#24577a;font-weight:900;margin-top:7px}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.info div{padding:10px;border:1px solid #c9d5df}.table{width:100%;border-collapse:collapse}.table th{background:#173b59;color:#fff;padding:10px}.table td{padding:10px;border:1px solid #c9d5df;text-align:center}.grade{font-size:24px;font-weight:900}.grade-a{background:#e8f7ed!important;color:#116530!important}.grade-b{background:#e8f0ff!important;color:#174a8b!important}.grade-c{background:#fff4dc!important;color:#7a4b00!important}.grade-d{background:#ffe9e9!important;color:#9b1c1c!important}.note{margin-top:16px;padding:11px;border:2px solid #d4af37;background:#fffaf0;text-align:center;font-size:11px}.status{text-align:center;padding:18px}.error{color:#9b1c1c;font-weight:800}@media(max-width:600px){.card{padding:18px}.info{grid-template-columns:1fr}.school{font-size:21px}.table th,.table td{padding:7px;font-size:12px}}
</style></head><body><main class="wrap"><div id="status" class="status">Loading result…</div><section id="card" class="card" style="display:none"><img class="watermark" src="https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ" aria-hidden="true"><div class="content"><div class="head"><img class="logo" src="https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ" alt="School Logo"><div class="school">VICTORY LAND FEDERAL SCHOOL</div><div>Grade 11 · Physics</div><div class="title">STUDENT GRADING RESULT</div></div><div id="body"></div></div></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';
import{firebaseConfig,students,myanmarDateTime}from'./firebase-data.js';
import{historicalAttendance,historicalHomework}from'./attendance-homework-policy.js';
const db=getFirestore(initializeApp(firebaseConfig)),status=document.getElementById('status'),card=document.getElementById('card'),body=document.getElementById('body');
const sid=String(new URLSearchParams(location.search).get('id')||'').trim().toUpperCase();
const sets={attendance:[],participation:[],homework:[],official:[]};let settings={},loaded=new Set();
const today=()=>myanmarDateTime().date,id=v=>String(v??'').trim().toUpperCase(),same=(a,b)=>id(a)===id(b),vt=v=>v&&typeof v.toMillis==='function'?v.toMillis():v instanceof Date?v.getTime():typeof v==='number'?v:new Date(v).getTime()||0,tm=x=>vt(x?.timestamp)||vt(x?.updatedAt)||vt(x?.date&&x?.time?x.date+'T'+x.time:x?.date?x.date+'T00:00:00':0),cut=k=>Math.max(...[settings.allResetAt,settings.gradingResetAt,settings[k+'ResetAt'],k==='official'?settings.officialResetAt:0].filter(Boolean).map(vt).filter(Boolean),0),fresh=(k,x)=>{const c=cut(k);return!c||tm(x)>=c},hw=x=>x?.completed===true||['completed','complete','done','submitted'].includes(String(x?.status??'').trim().toLowerCase()),pct=(v,t)=>t?Math.max(0,Math.min(100,v/t*100)):0,grade=v=>v>=90?'A*':v>=80?'A':v>=70?'B*':v>=60?'B':v>=50?'C*':v>=40?'C':'D';
function merged(base,live,s,k){const c=cut(k),m={};base.filter(x=>x.date<=today()&&(!c||tm(x)>=c)).forEach(x=>m[x.date]=x);live.filter(x=>same(x.id,s)&&x.date<=today()&&fresh(k,x)).forEach(x=>m[x.date]={...m[x.date],...x});return Object.values(m)}
function calc(s){const ar=merged(historicalAttendance(s),sets.attendance,s,'attendance'),hr=merged(historicalHomework(s),sets.homework,s,'homework'),ad=ar.length,hd=hr.length,present=ar.filter(x=>String(x.status??'').trim().toLowerCase()==='present').length,completed=new Set(hr.filter(hw).map(x=>x.date)).size,a=pct(present,ad)*.4,h=pct(completed,hd)*.3,ps=sets.participation.filter(x=>same(x.id,s)&&fresh('participation',x)).sort((a,b)=>tm(b)-tm(a)),os=sets.official.filter(x=>same(x.id,s)&&fresh('official',x)).sort((a,b)=>tm(b)-tm(a)),p=Math.max(0,Math.min(30,Number(ps[0]?.mark)||0)),o=Math.max(0,Math.min(100,Number(os[0]?.score)||0)),total=a+p+h+o,overall=total/2;return{id:s,name:students[s],a,p,h,o,total,overall,grade:grade(overall),attendancePct:pct(present,ad),homeworkPct:pct(completed,hd),attendanceDays:ad,homeworkDays:hd}}
function gradeClass(g){return /^A/.test(g)?'grade-a':/^B/.test(g)?'grade-b':/^C/.test(g)?'grade-c':'grade-d'}
function render(){if(!sid){status.innerHTML='<div class="error">Student ID မတွေ့ပါ။ QR code ကိုမှန်ကန်စွာ scan လုပ်ပါ။</div>';return}if(!students[sid]){status.innerHTML='<div class="error">Student result မတွေ့ပါ။</div>';return}if(loaded.size<4){status.textContent='Loading result…';return}const r=calc(sid);body.innerHTML='<div class="info"><div><b>Student ID</b><br>'+r.id+'</div><div><b>Student Name</b><br>'+r.name+'</div></div><table class="table"><tr><th>Assessment</th><th>Mark</th><th>Maximum</th><th>Percentage</th></tr><tr><td>Attendance</td><td>'+r.a.toFixed(2)+'</td><td>40</td><td>'+r.attendancePct.toFixed(2)+'% · '+r.attendanceDays+' days</td></tr><tr><td>Participation</td><td>'+r.p.toFixed(2)+'</td><td>30</td><td>'+pct(r.p,30).toFixed(2)+'%</td></tr><tr><td>Homework</td><td>'+r.h.toFixed(2)+'</td><td>30</td><td>'+r.homeworkPct.toFixed(2)+'% · '+r.homeworkDays+' days</td></tr><tr><td>Official Test</td><td>'+r.o.toFixed(2)+'</td><td>100</td><td>'+r.o.toFixed(2)+'%</td></tr><tr><th>Total</th><th>'+r.total.toFixed(2)+'</th><th>200</th><th>'+r.overall.toFixed(2)+'%</th></tr><tr><th>Final Grade</th><th colspan="2" class="grade '+gradeClass(r.grade)+'">'+r.grade+'</th><th>'+r.overall.toFixed(2)+'%</th></tr></table><div class="note">Generated from the current Firebase grading data. Admin Reset cutoff is applied. Generated: '+today()+'</div>';status.style.display='none';card.style.display='block'}
[['attendance','attendance_records'],['participation','participation_records'],['homework','homework_records'],['official','physics_official_results']].forEach(([k,n])=>onSnapshot(collection(db,n),s=>{sets[k]=s.docs.map(d=>d.data());loaded.add(k);render()},e=>{console.error(e);status.innerHTML='<div class="error">Result data ကို load လုပ်၍မရပါ။</div>'}));
onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};render()},e=>console.error(e));render();
</script></body></html>
