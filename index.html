n:center}.quote-head .cap{font-size:.76rem;letter-spacing:.16em;color:#718090;font-weight:800;text-transform:uppercase}.quote-head h2{margin:8px 0 4px;color:#142b43;font-size:1.45rem}.quote-text{text-align:center;color:#233f58;font-size:1.08rem;line-height:1.75;font-weight:700;margin:22px 8px 10px}.quote-author{text-align:center;color:#718090;font-size:.82rem}.quote-actions{display:flex;gap:10px;margin-top:22px}.quote-actions button{flex:1;border:0;border-radius:13px;padding:12px 14px;font-weight:800;cursor:pointer}.quote-close{background:#e8eef3;color:#173b59}.quote-continue{background:#142b43;color:#fff}.quote-note{text-align:center;color:#8996a2;font-size:.7rem;margin:11px 0 0}@keyframes quoteIn{to{transform:translateY(0) scale(1);opacity:1}}@media(max-width:650px){.hero-home{padding:23px 18px}.hero-home .logo{width:66px;height:66px;border-radius:17px}.home-card{min-height:115px}.home-card .arrow{right:16px;bottom:13px}.quote-pop{padding:12px}.quote-pop-card{padding:23px 19px;border-radius:22px}.quote-text{font-size:1rem;line-height:1.65;margin:20px 4px 9px}.quote-actions button{padding:11px 10px}}</style></head><body><main class="wrap"><div class="top home-top"><div class="creator">Creator By Sr Lynn</div><div class="grade-pill">🎓 Grade 11</div></div><section class="hero hero-home"><img class="logo" src="https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ" alt="School Logo"><h1>VICTORY LAND FEDERAL SCHOOL</h1><div class="sub"><p>Grade 11 Physics</p></div></section><section class="grid"><a class="card home-card" href="attendance.html"><div class="icon">📅</div><h2>Attendance</h2><span class="arrow">→</span></a><a class="card home-card" href="homework.html"><div class="icon">📚</div><h2>Homework</h2><span class="arrow">→</span></a><a class="card home-card" href="participation.html"><div class="icon">⭐</div><h2>Participation</h2><span class="arrow">→</span></a><a class="card home-card" href="test.html"><div class="icon">📝</div><h2>Test</h2><span class="arrow">→</span></a><a class="card report-card home-card" href="report-card-menu.html"><div class="icon">🧾</div><h2>Report Card Generator</h2><span class="arrow">→</span></a></section><div class="footer">Grade 11 Physics · <strong>Sr Lynn</strong></div></main><div class="quote-pop" id="quotePop" aria-hidden="true"><div class="quote-pop-card"><div class="quote-head"><div class="cap">လေ့လာ • အာရုံစိုက် • တိုးတက်</div><h2>📖 ပညာရေး အားပေးစကား</h2></div><div class="quote-text" id="quoteText"></div><div class="quote-author" id="quoteAuthor"></div><div class="quote-actions"><button class="quote-close" id="quoteClose">ပိတ်မည်</button><button class="quote-continue" id="quoteContinue">ဆက်သွားမည် →</button></div><div class="quote-note">သင်ယူမှုခရီးအတွက် အားပေးစကားလေးတစ်ခွန်း</div></div></div><script>const quotes=[['“နေ့တိုင်း နည်းနည်းစီ ကြိုးစားသွားရင် အချိန်ကြာလာတဲ့အခါ ကြီးမားတဲ့အောင်မြင်မှုကို ရနိုင်ပါတယ်။”','— ပညာရေး အားပေးစကား'],['“တစ်ခါသင်ယူထားတဲ့ ပညာဟာ ဘယ်သူမှ သင့်ဆီကနေ မယူနိုင်တဲ့ အရာပါ။”','— ပညာရေး အားပေးစကား'],['“ပညာရေးဟာ အနာဂတ်အတွက် တံခါးဖွင့်ပေးတဲ့ သော့ချက်တစ်ခုပါ။”','— Malcolm X'],['“နာရီကို မကြည့်ဘဲ ဆက်ကြိုးစားပါ။ အချိန်က ရွေ့နေသလို သင်လည်း ရှေ့ဆက်နေပါ။”','— Sam Levenson'],['“ကျွမ်းကျင်သူတိုင်းဟာ တစ်ချိန်က စတင်လေ့လာသူတစ်ယောက်ပါပဲ။”','— Helen Hayes'],['“ဒီနေ့ စာလေ့လာပါ။ မနက်ဖြန် အောင်မြင်မှုကို ရယူပါ။”','— ပညာရေး အားပေးစကား'],['“တိုးတက်မှု သေးသေးလေးဖြစ်နေရင်တောင် တိုးတက်မှုပါပဲ။ ဆက်လေ့လာပါ။”','— စာလေ့လာရန် အားပေးစကား'],['“သင့်အနာဂတ်ကို ဒီနေ့ သင်လုပ်နေတဲ့အရာတွေက ဖန်တီးပေးနေပါတယ်။”','— Robert Kiyosaki'],['“ခက်ခဲတဲ့လမ်းတွေက တစ်ခါတလေ လှပတဲ့ပန်းတိုင်တွေဆီ ခေါ်ဆောင်သွားတတ်ပါတယ်။”','— လေ့လာမှု အားပေးစကား'],['“ရည်ရွယ်ချက်ရှိရှိ လေ့လာပါ။ စိတ်ရှည်ရှည် လေ့ကျင့်ပါ။ ယုံကြည်မှုနဲ့ တိုးတက်ပါ။”','— ပညာရေး အားပေးစကား'],['“သင်ဖြေရှင်းနိုင်တဲ့ ပြဿနာတိုင်းက သင့်ကို ပိုမိုတော်လာစေပါတယ်။”','— Physics လေ့လာရန် အားပေးစကား'],['“ရေရှည်သင်ယူမှုမှာ တစ်ခါတည်း အများကြီးလုပ်တာထက် ပုံမှန်လုပ်နိုင်ခြင်းက ပိုအရေးကြီးပါတယ်။”','— ပညာရေး အားပေးစကား'],['“ရှေ့ဆက်ချင်ရင် အရင်ဆုံး စတင်လိုက်ပါ။”','— Mark Twain'],['“သင်ယူမှုက စိတ်ကို ဘယ်တော့မှ မပင်ပန်းစေပါဘူး။”','— Leonardo da Vinci'],['“ပညာရဲ့အစမှာ ခက်ခဲနိုင်ပေမယ့် ရလာဒ်က ချိုမြိန်ပါတယ်။”','— Aristotle'],['“ပညာအပေါ် ရင်းနှီးမြှုပ်နှံခြင်းဟာ အကောင်းဆုံး ရင်းနှီးမြှုပ်နှံမှုတစ်ခုပါ။”','— Benjamin Franklin'],['“စာကို အလွတ်ကျက်ဖို့ထက် နားလည်အောင် သင်ယူဖို့က ပိုအရေးကြီးပါတယ်။”','— ပညာရေး အားပေးစကား'],['“နေ့တိုင်း အသစ်တစ်ခုခုကို သင်ယူပါ။ အနာဂတ်အတွက် ပိုမိုပြည့်စုံလာပါလိမ့်မယ်။”','— Mahatma Gandhi'],['“နေ့တိုင်း တိုးတက်မှုနည်းနည်းစီ စုလာရင် ရလဒ်က ကြီးမားလာပါတယ်။”','— လေ့လာမှု အားပေးစကား'],['“သင့်ရဲ့ စိန်ခေါ်မှုတွေကို မကန့်သတ်ပါနဲ့။ ကိုယ့်ရဲ့ ကန့်သတ်ချက်တွေကို စိန်ခေါ်ပါ။”','— ပညာရေး အားပေးစကား'],['“ကြီးမားတဲ့အောင်မြင်မှုတွေဟာ သေးငယ်တဲ့ ကြိုးစားမှုများစွာ စုပေါင်းပြီး ဖြစ်လာတာပါ။”','— Vincent van Gogh'],['“တော်ဖို့စောင့်မနေပါနဲ့။ စတင်ပြီး တဖြည်းဖြည်း တော်လာအောင်လုပ်ပါ။”','— Zig Ziglar'],['“အနာဂတ်ကို ပြင်ဆင်ထားသူတွေအတွက် အခွင့်အရေးတွေ ပိုများပါတယ်။”','— Malcolm X'],['“အောင်မြင်မှုဆိုတာ တစ်ခါတလေ ကြိုးစားတာနဲ့ မရပါဘူး။ ပုံမှန်ကြိုးစားမှုကနေ ရလာတာပါ။”','— ပညာရေး အားပေးစကား'],['“အိပ်မက်ကြီးကြီးမက်ပါ။ ကြိုးစားပါ။ ရည်မှန်းချက်ကို အာရုံစိုက်ထားပါ။”','— လေ့လာမှု အားပေးစကား'],['“သင်ခန်းစာတစ်ခု ပြီးတိုင်း သင်ဟာ ရှေ့ကို တစ်လှမ်းတိုးသွားပါပြီ။”','— ပညာရေး အားပေးစကား'],['“အမှားလုပ်မိတာဟာ သင်ကြိုးစားနေတယ်ဆိုတဲ့ သက်သေတစ်ခုပါ။”','— စာလေ့လာရန် အားပေးစကား'],['“ကျရှုံးမှာကြောက်ပြီး အိပ်မက်တွေကို မရပ်လိုက်ပါနဲ့။”','— Suzy Kassem'],['“သင်လုပ်နိုင်တယ်လို့ ယုံကြည်ထားရင် ပန်းတိုင်ကို ရောက်ဖို့ ပထမခြေလှမ်းကို စပြီးသားပါ။”','— ပညာရေး အားပေးစကား'],['“တစ်ခုခုကို ပိုကြိုးစားလေလေ အောင်မြင်တဲ့အခါ ပိုတန်ဖိုးရှိလေလေပါပဲ။”','— ပညာရေး အားပေးစကား'],['“စည်းကမ်းရှိခြင်းက ရည်မှန်းချက်နဲ့ အောင်မြင်မှုကြားက တံတားပါ။”','— Jim Rohn'],['“သင့်ရဲ့ အကြီးမားဆုံး ကန့်သတ်ချက်က တစ်ခါတလေ သင့်စိတ်ထဲမှာပဲ ရှိပါတယ်။”','— လေ့လာမှု အားပေးစကား'],['“ပြီးပြည့်စုံဖို့ထက် တိုးတက်ဖို့ကို အာရုံစိုက်ပါ။”','— ပညာရေး အားပေးစကား'],['“သင်သိထားတဲ့ ပညာကို မျှဝေလေလေ ပညာဟာ ပိုမိုတိုးပွားလာလေလေပါပဲ။”','— စာလေ့လာရန် အားပေးစကား'],['“အနာဂတ်ကို ခန့်မှန်းမနေပါနဲ့။ ကိုယ်တိုင် ဖန်တီးပါ။”','— Abraham Li
