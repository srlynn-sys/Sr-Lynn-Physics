<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homework ဖြည့်ရန်</title><link rel="stylesheet" href="academic.css"><style>input{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccd6e3;border-radius:10px}button{padding:12px 18px;border:0;border-radius:10px;background:#0f2747;color:#fff;font-weight:700}.clock{padding:14px;background:#f6f8fb;border-radius:12px;margin:15px 0}.msg{margin-top:14px;padding:12px;border-radius:10px}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="homework.html">← Homework</a></div><section class="hero"><h1>📚 Homework ဖြည့်ရန်</h1><p>Student Code ထည့်ပြီး Homework ပြီးစီးကြောင်း မှတ်တမ်းတင်ရန်</p></section><section class="panel"><div id="clock" class="clock"></div><label>Student ID</label><input id="id" placeholder="ဥပမာ 11MM 003" autocomplete="off"><button onclick="save()">Homework ဖြည့်မည်</button><p id="msg" class="msg"></p></section></main><script>const TZ='Asia/Yangon';function parts(d){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d).reduce((o,x)=>(o[x.type]=x.value,o),{})}function renderClock(){const p=parts(new Date());document.getElementById('clock').textContent='Myanmar Time — '+p.year+'-'+p.month+'-'+p.day+' '+p.hour+':'+p.minute+':'+p.second+' (UTC+06:30)'}setInterval(renderClock,1000);renderClock();function save(){const input=document.getElementById('id'),msg=document.getElementById('msg'),id=input.value.trim().toUpperCase();if(!id){msg.textContent='Student ID ထည့်ပါ။';return}const d=new Date(),p=parts(d),item={id,completed:true,date:p.year+'-'+p.month+'-'+p.day,time:p.hour+':'+p.minute+':'+p.second,timestamp:d.toISOString()};const key='homework_records',rows=JSON.parse(localStorage.getItem(key)||'[]');rows.push(item);localStorage.setItem(key,JSON.stringify(rows));msg.textContent=id+' — Homework ဖြည့်ပြီးပါပြီ။ '+item.date+' '+item.time+' Myanmar Time ဖြင့် သိမ်းပြီးပါပြီ။';input.value='';input.focus()}</script></body></html>
