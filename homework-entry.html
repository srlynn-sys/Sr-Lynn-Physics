<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homework ဖြည့်ရန်</title><link rel="stylesheet" href="academic.css"><style>input{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccd6e3;border-radius:10px}button{padding:12px 18px;border:0;border-radius:10px;background:#0f2747;color:#fff;font-weight:700}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="homework.html">← Homework</a></div><section class="hero"><h1>📚 Homework ဖြည့်ရန်</h1><p>Maximum contribution: 30 marks</p></section><section class="panel"><label>Student ID</label><input id="id" placeholder="11MM 003"><label>Homework Mark / 30</label><input id="mark" type="number" min="0" max="30"><button onclick="save()">Save Homework</button><p id="msg"></p></section></main><script>function save(){const id=document.getElementById('id').value.trim(),m=Number(document.getElementById('mark').value);if(!id||m<0||m>30){msg.textContent='Student ID နှင့် 0–30 mark ထည့်ပါ။';return}const d=new Date(),p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Yangon',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d).reduce((o,x)=>(o[x.type]=x.value,o),{});const rows=JSON.parse(localStorage.getItem('homework_records')||'[]');rows.push({id,mark:m,date:p.year+'-'+p.month+'-'+p.day,time:p.hour+':'+p.minute+':'+p.second,timestamp:d.toISOString()});localStorage.setItem('homework_records',JSON.stringify(rows));msg.textContent=id+' — '+m+'/30 သိမ်းပြီးပါပြီ။';}</script></body></html>
