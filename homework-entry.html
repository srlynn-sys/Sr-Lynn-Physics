<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homework</title><link rel="stylesheet" href="academic.css"></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="homework.html">← Homework</a></div><section class="hero"><h1>Homework ဖြည့်ရန်</h1><p>Student ID ဖြင့် မှတ်တမ်းတင်ရန် • တစ်ရက်လျှင် တစ်ကြိမ်သာ</p></section><section class="panel"><p id="clock"></p><p id="workday"></p><label>Student ID</label><input id="id" placeholder="11MM 003"><button id="save">Homework ဖြည့်မည်</button><p id="msg"></p></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,doc,setDoc,getDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,myanmarParts}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig));function updateClock(){const p=myanmarParts(),dow=new Date(Date.UTC(p.year,Number(p.month)-1,Number(p.day))).getUTCDay(),ok=dow>=1&&dow<=5;document.getElementById('clock').textContent=p.year+'-'+p.month+'-'+p.day+' '+p.hour+':'+p.minute+':'+p.second;const box=document.getElementById('workday'),btn=document.getElementById('save');box.textContent=ok?'🟢 Monday–Friday — ယနေ့ Homework ဖြည့်နိုင်ပါသည်။':'🔴 Weekend — စနေ၊ တနင်္ဂနွေတွင် Homework ဖြည့်၍ မရပါ။';btn.disabled=!ok}setInterval(updateClock,1000);updateClock();document.getElementById('save').onclick=async()=>{const p=myanmarParts(),dow=new Date(Date.UTC(p.year,Number(p.month)-1,Number(p.day))).getUTCDay(),msg=document.getElementById('msg');if(dow<1||dow>5){msg.textContent='Weekend တွင် Homework ဖြည့်၍ မရပါ။ Monday–Friday အလုပ်ရက်များတွင်သာ ဖြည့်နိုင်ပါသည်။';return}const id=document.getElementById('id').value.trim().toUpperCase();if(!students[id]){msg.textContent='Student ID မမှန်ပါ။';return}const date=p.year+'-'+p.month+'-'+p.day;try{const recordRef=doc(db,'homework_records',id+'_'+date),existing=await getDoc(recordRef);if(existing.exists()){msg.textContent=id+' — '+students[id]+' အတွက် ယနေ့ Homework ဖြည့်ပြီးသားဖြစ်ပါတယ်။ တစ်ရက်လျှင် တစ်ကြိမ်သာ ဖြည့်နိုင်ပါတယ်။';return}await setDoc(recordRef,{id:id,name:students[id],completed:true,date:date,time:p.hour+':'+p.minute+':'+p.second,timestamp:new Date().toISOString(),updatedAt:serverTimestamp()});msg.textContent='ယနေ့အတွက် Homework မှတ်တမ်း သိမ်းပြီးပါပြီ။';document.getElementById('id').value=''}catch(e){msg.textContent='Firebase error: '+e.message}};</script></body></html>
