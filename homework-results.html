<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homework Results</title><link rel="stylesheet" href="academic.css"><style>.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.searchbar input,.searchbar button{padding:12px;border:1px solid #ccd6e3;border-radius:10px}.searchbar input{flex:1;min-width:180px}.searchbar button{background:#0f2747;color:#fff;font-weight:700;cursor:pointer}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.calendar-head button{padding:9px 12px;border:0;border-radius:10px;background:#eaf3ff;color:#174a83;font-weight:700;cursor:pointer}.calendar-title{font-weight:800;font-size:1.1rem}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;font-weight:800;padding:8px 2px;color:#516174}.day{min-height:88px;border:1px solid #dbe3ee;border-radius:12px;padding:7px;background:#fff}.day.muted{opacity:.35}.daynum{font-weight:800}.done{margin-top:8px;padding:5px;border-radius:8px;text-align:center;font-size:.78rem;font-weight:800;background:#e8f7ee;color:#16803c}.emptyday{color:#9aa7b5;font-size:.75rem;margin-top:7px}.live{padding:10px;background:#e8f7ee;color:#18784a;border-radius:10px;font-weight:700;margin-bottom:12px}.summary{margin:12px 0;padding:12px;border-radius:12px;background:#f6f8fb}.hint{color:#617086;font-size:.9rem;margin-bottom:14px}@media(max-width:600px){.day{min-height:72px;padding:5px}.done{font-size:.66rem;padding:4px}.week div{font-size:.78rem}}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="homework.html">← Homework</a></div><section class="hero"><h1>📚 Homework Results</h1><p>2026-08-10 မှ စတင်၍ School Workdays အလိုက်</p></section><section class="panel"><div class="searchbar"><input id="studentId" placeholder="Student ID — ဥပမာ 11MM 003" autocomplete="off"><button id="searchBtn">🔎 ရှာမည်</button><button id="allBtn">👥 All Students</button></div><div class="hint">002 / 003 / 006 / 008 / 009 ကို သတ်မှတ်ထားသော school workdays အားလုံး Homework ပြီးစီးထားသည်။ 005 / 010 ကို မပြီးစီးထားသူအဖြစ်တွက်ထားသည်။</div><div id="out">Loading...</div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds}from'./firebase-data.js';import{schoolDates,historicalHomework}from'./attendance-homework-policy.js';const db=getFirestore(initializeApp(firebaseConfig)),out=document.getElementById('out');let records=[],resetAt=0,selectedId='',viewDate=new Date('2026-09-01T00:00:00');const months=['January','February','March','April','May','June','July','August','September','October','November','December'],days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function realRows(id){const base=historicalHomework(id);const map={};base.forEach(x=>map[x.date]=x);records.filter(x=>x.id===id&&new Date(x.date+'T00:00:00')>=new Date('2026-08-10T00:00:00')).forEach(x=>{map[x.date]={...map[x.date],...x,historical:false}});return Object.values(map)}function render(){const ids=selectedId?[selectedId]:studentIds;const y=viewDate.getFullYear(),m=viewDate.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate(),prevLast=new Date(y,m,0).getDate(),rr=selectedId?realRows(selectedId):[];let cells='';for(let i=0;i<42;i++){const n=i-first+1;if(n<1){cells+='<div class="day muted"><span class="daynum">'+(prevLast+n)+'</span></div>';continue}if(n>last){cells+='<div class="day muted"><span class="daynum">'+(n-last)+'</span></div>';continue}const date=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0'),r=selectedId?rr.find(x=>x.date===date):null;cells+='<div class="day"><span class="daynum">'+n+'</span>'+(r?'<div class="done">✓ Completed</div><div class="emptyday">'+(r.historical?'Auto record':'Firebase record')+'</div>':(schoolDates().includes(date)?'<div class="emptyday">Select a student</div>':'<div class="emptyday">—</div>'))+'</div>'}let table='<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="padding:9px">Student ID</th><th style="padding:9px">Name</th><th style="padding:9px">Completed</th><th style="padding:9px">Homework %</th></tr></thead><tbody>';studentIds.forEach(id=>{const x=realRows(id).length,pct=x/schoolDates().length*100;table+=`<tr><td style="padding:9px;text-align:center">${id}</td><td style="padding:9px">${esc(students[id])}</td><td style="padding:9px;text-align:center">${x}/${schoolDates().length}</td><td style="padding:9px;text-align:center;font-weight:800">${pct.toFixed(2)}%</td></tr>`});table+='</tbody></table></div>';const selectedCount=rr.length,label=selectedId?esc(selectedId)+' — '+esc(students[selectedId]):'All Students';out.innerHTML='<div class="live">● Firebase Live + Historical Homework Policy</div><div class="summary"><b>'+label+'</b><br>School workdays: '+schoolDates().length+(selectedId?' • Completed '+selectedCount+' • <b>'+(selectedCount/schoolDates().length*100).toFixed(2)+'%</b>':'')+'</div>'+(!selectedId?table:'')+'<div class="calendar-head"><button id="prev">‹</button><div class="calendar-title">'+months[m]+' '+y+'</div><button id="next">›</button></div><div class="week">'+days.map(d=>'<div>'+d+'</div>').join('')+'</div><div class="calendar">'+cells+'</div>';document.getElementById('prev').onclick=()=>{viewDate.setMonth(viewDate.getMonth()-1);render()};document.getElementById('next').onclick=()=>{viewDate.setMonth(viewDate.getMonth()+1);render()}}document.getElementById('searchBtn').onclick=()=>{selectedId=document.getElementById('studentId').value.trim().toUpperCase();if(selectedId&&!students[selectedId]){out.innerHTML='<div class="empty">Student ID မတွေ့ပါ။</div>';return}render()};document.getElementById('allBtn').onclick=()=>{selectedId='';document.getElementById('studentId').value='';render()};document.getElementById('studentId').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('searchBtn').click()});onSnapshot(collection(db,'homework_records'),s=>{records=s.docs.map(d=>d.data());render()},e=>out.innerHTML='<div class="empty">Firestore error: '+esc(e.message)+'</div>');onSnapshot(doc(db,'admin_settings','tests'),s=>{resetAt=Math.max((s.exists()&&s.data().allResetAt?new Date(s.data().allResetAt).getTime():0),(s.exists()&&s.data().homeworkResetAt?new Date(s.data().homeworkResetAt).getTime():0));render()});</script></body></html>
