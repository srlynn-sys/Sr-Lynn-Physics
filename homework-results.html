<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homework Results</title><link rel="stylesheet" href="academic.css"><style>.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.searchbar input,.searchbar button{padding:12px;border:1px solid #ccd6e3;border-radius:10px}.searchbar input{flex:1;min-width:180px}.searchbar button{background:#0f2747;color:#fff;font-weight:700;cursor:pointer}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.calendar-head button{padding:9px 12px;border:0;border-radius:10px;background:#eaf3ff;color:#174a83;font-weight:700;cursor:pointer}.calendar-title{font-weight:800;font-size:1.1rem}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;font-weight:800;padding:8px 2px;color:#516174}.day{min-height:88px;border:1px solid #dbe3ee;border-radius:12px;padding:7px;background:#fff}.day.muted{opacity:.35}.daynum{font-weight:800}.done{margin-top:8px;padding:5px;border-radius:8px;text-align:center;font-size:.78rem;font-weight:800;background:#e8f7ee;color:#16803c}.emptyday{color:#9aa7b5;font-size:.78rem;margin-top:8px}.live{padding:10px;background:#e8f7ee;color:#18784a;border-radius:10px;font-weight:700;margin-bottom:12px}.reset{padding:10px;background:#fff4d6;color:#765b00;border-radius:10px;font-weight:700;margin-bottom:12px}.summary{margin:12px 0;padding:12px;border-radius:12px;background:#f6f8fb}.hint{color:#617086;font-size:.9rem;margin-bottom:14px}@media(max-width:600px){.day{min-height:72px;padding:5px}.done{font-size:.66rem;padding:4px}.week div{font-size:.78rem}}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="homework.html">← Homework</a></div><section class="hero"><h1>📚 Homework Results</h1><p>Student ID ဖြင့်ရှာပြီး Calendar အလိုက်ကြည့်နိုင်ပါသည်</p></section><section class="panel"><div class="searchbar"><input id="studentId" placeholder="Student ID — ဥပမာ 11MM 003" autocomplete="off"><button id="searchBtn">🔎 ရှာမည်</button><button id="allBtn">👥 All Students</button></div><div class="hint">Student Code ထည့်ပြီး Search လုပ်ပါ။ Calendar ထဲမှာ Homework ဖြည့်ထားသောနေ့ကို ပြပါမည်။</div><div id="out">Loading...</div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig)),out=document.getElementById('out');let rows=[],resetAt=0,selectedId='',viewDate=new Date();viewDate.setDate(1);const months=['January','February','March','April','May','June','July','August','September','October','November','December'],days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];function tm(x){const v=x?.timestamp;if(v&&typeof v.toMillis==='function')return v.toMillis();return new Date(v||((x.date||'')+'T'+(x.time||''))).getTime()||0}function escapeHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){let filtered=rows.filter(r=>tm(r)>=resetAt);if(selectedId)filtered=filtered.filter(r=>String(r.id||'').toUpperCase()===selectedId);const map={};filtered.forEach(r=>map[r.date]=r);const y=viewDate.getFullYear(),m=viewDate.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate(),prevLast=new Date(y,m,0).getDate();let cells='';for(let i=0;i<42;i++){const n=i-first+1;if(n<1){cells+='<div class="day muted"><span class="daynum">'+(prevLast+n)+'</span></div>';continue}if(n>last){cells+='<div class="day muted"><span class="daynum">'+(n-last)+'</span></div>';continue}const date=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0'),r=map[date];cells+='<div class="day"><span class="daynum">'+n+'</span>'+(r?'<div class="done">✓ Completed</div><div class="emptyday">'+escapeHtml(r.time||'')+'</div>':'<div class="emptyday">Not completed</div>')+'</div>'}const label=selectedId?(escapeHtml(selectedId)+(students[selectedId]?' — '+escapeHtml(students[selectedId]):'')):'All Students';out.innerHTML='<div class="live">● Firebase Live Sync</div>'+(resetAt?'<div class="reset">♻️ Homework Reset အပြီး data အသစ်များကိုသာ ပြထားပါသည်။</div>':'')+'<div class="summary"><b>'+label+'</b><br>Completed records: '+filtered.length+'</div><div class="calendar-head"><button id="prev">‹</button><div class="calendar-title">'+months[m]+' '+y+'</div><button id="next">›</button></div><div class="week">'+days.map(d=>'<div>'+d+'</div>').join('')+'</div><div class="calendar">'+cells+'</div>';document.getElementById('prev').onclick=()=>{viewDate.setMonth(viewDate.getMonth()-1);render()};document.getElementById('next').onclick=()=>{viewDate.setMonth(viewDate.getMonth()+1);render()}}document.getElementById('searchBtn').onclick=()=>{selectedId=document.getElementById('studentId').value.trim().toUpperCase();if(selectedId&&!students[selectedId]){out.innerHTML='<div class="empty">Student ID မတွေ့ပါ။</div>';return}render()};document.getElementById('allBtn').onclick=()=>{selectedId='';document.getElementById('studentId').value='';render()};document.getElementById('studentId').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('searchBtn').click()});onSnapshot(collection(db,'homework_records'),s=>{rows=s.docs.map(d=>d.data());render()},e=>out.innerHTML='<div class="empty">Firestore error: '+escapeHtml(e.message)+'</div>');onSnapshot(doc(db,'admin_settings','tests'),s=>{const d=s.exists()?s.data():{};resetAt=Math.max(d.allResetAt?new Date(d.allResetAt).getTime():0,d.homeworkResetAt?new Date(d.homeworkResetAt).getTime():0);render()});</script></body></html>
