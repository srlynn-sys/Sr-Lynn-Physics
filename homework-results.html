<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homework Results</title><link rel="stylesheet" href="academic.css"><style>.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.searchbar input,.searchbar button{padding:12px;border:1px solid #ccd6e3;border-radius:10px}.searchbar input{flex:1;min-width:180px}.searchbar button{background:#0f2747;color:#fff;font-weight:700;cursor:pointer}.summary,.live{margin:12px 0;padding:12px;border-radius:12px;background:#f6f8fb}.live{background:#e8f7ee;color:#18784a;font-weight:700}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.calendar-head button{padding:9px 12px;border:0;border-radius:10px;background:#eaf3ff;color:#174a83;font-weight:700}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;font-weight:800;padding:8px 2px}.day{min-height:82px;border:1px solid #dbe3ee;border-radius:12px;padding:7px;background:#fff}.day.muted{opacity:.35}.done{margin-top:8px;padding:5px;border-radius:8px;text-align:center;font-size:.78rem;font-weight:800;background:#e8f7ee;color:#16803c}.emptyday{color:#9aa7b5;font-size:.75rem;margin-top:7px}@media(max-width:600px){.day{min-height:70px}.done{font-size:.66rem}}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="homework.html">← Homework</a></div><section class="hero"><h1>📚 Homework Results</h1><p>Historic + submitted live homework</p></section><section class="panel"><div class="searchbar"><input id="studentId" placeholder="Student ID — ဥပမာ 11MM 003"><button id="searchBtn">🔎 ရှာမည်</button><button id="allBtn">👥 All Students</button></div><div id="out">Loading...</div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds,myanmarDateTime}from'./firebase-data.js';import{historicalHomework}from'./attendance-homework-policy.js';const db=getFirestore(initializeApp(firebaseConfig)),out=document.getElementById('out');let records=[],settings={},selectedId='',viewDate=new Date('2026-09-01T00:00:00');const today=()=>myanmarDateTime().date,same=(a,b)=>String(a??'').trim().toUpperCase()===String(b??'').trim().toUpperCase(),vt=v=>v&&typeof v.toMillis==='function'?v.toMillis():v instanceof Date?v.getTime():typeof v==='number'?v:new Date(v).getTime()||0,tm=x=>vt(x?.timestamp)||vt(x?.updatedAt)||vt(x?.date&&x?.time?x.date+'T'+x.time:x?.date?x.date+'T00:00:00':0),cut=()=>Math.max(...[settings.allResetAt,settings.gradingResetAt,settings.homeworkResetAt].filter(Boolean).map(vt).filter(Boolean),0),done=x=>x?.completed===true||['completed','complete','done','submitted'].includes(String(x?.status??'').trim().toLowerCase()),realRows=id=>{const c=cut(),m={};historicalHomework(id).filter(x=>x.date<=today()&&(!c||tm(x)>=c)).forEach(x=>m[x.date]=x);records.filter(x=>same(x.id,id)&&x.date<=today()&&(!c||tm(x)>=c)).forEach(x=>m[x.date]={...m[x.date],...x,historical:false});return Object.values(m)};function render(){const rr=selectedId?realRows(selectedId):[],y=viewDate.getFullYear(),mo=viewDate.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,last=new Date(y,mo+1,0).getDate();let cells='';for(let i=0;i<42;i++){const n=i-first+1;if(n<1||n>last){cells+='<div class="day muted"></div>';continue}const d=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(n).padStart(2,'0'),r=rr.find(x=>x.date===d);cells+='<div class="day"><b>'+n+'</b>'+(r?'<div class="done">✓ '+(done(r)?'Completed':'Not Completed')+'</div><div class="emptyday">'+(r.adminManaged?'Admin':'Record')+'</div>':'<div class="emptyday">Not submitted</div>')+'</div>'}let table='<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th>ID</th><th>Name</th><th>Recorded Days</th><th>Completed</th><th>Homework %</th></tr>';studentIds.forEach(id=>{const r=realRows(id),c=r.filter(done).length;table+='<tr><td>'+id+'</td><td>'+students[id]+'</td><td>'+r.length+'</td><td>'+c+'</td><td><b>'+(r.length?c/r.length*100:0).toFixed(2)+'%</b></td></tr>'});table+='</table></div>';const c=rr.filter(done).length;out.innerHTML='<div class="live">● Firebase Live · Admin Reset cutoff applied · Historic + submitted records only</div><div class="summary"><b>'+(selectedId?selectedId+' — '+students[selectedId]:'All Students')+'</b>'+(selectedId?'<br>Recorded Days: '+rr.length+' · Completed: '+c+' · <b>Homework: '+(rr.length?c/rr.length*100:0).toFixed(2)+'%</b>':'')+'</div>'+(selectedId?'':'<div style="margin-bottom:16px">'+table+'</div>')+'<div class="calendar-head"><button id="prev">‹</button><b>'+viewDate.toLocaleString('en-US',{month:'long',year:'numeric'})+'</b><button id="next">›</button></div><div class="week"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div><div class="calendar">'+cells+'</div>';document.getElementById('prev').onclick=()=>{viewDate.setMonth(viewDate.getMonth()-1);render()};document.getElementById('next').onclick=()=>{viewDate.setMonth(viewDate.getMonth()+1);render()}}searchBtn.onclick=()=>{selectedId=studentId.value.trim().toUpperCase();if(selectedId&&!students[selectedId])return out.innerHTML='<p>Student ID မတွေ့ပါ။</p>';render()};allBtn.onclick=()=>{selectedId='';studentId.value='';render()};onSnapshot(collection(db,'homework_records'),s=>{records=s.docs.map(d=>d.data());render()},e=>out.innerHTML='Firebase error: '+e.message);onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};render()});render();</script></body></html>
