<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 11 Physics — Tests</title><link rel="stylesheet" href="academic.css"><style>body{padding:14px}.test-wrap{max-width:980px;margin:30px auto}.test-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.test-card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #dbe5ec;border-radius:22px;padding:28px;box-shadow:0 12px 32px #142b4314}.test-card.closed{opacity:.55;filter:grayscale(.5);cursor:not-allowed}.test-icon{font-size:3.2rem}.test-card h2{margin:10px 0 6px}.status{display:inline-block;margin-top:8px;padding:5px 10px;border-radius:20px;font-size:.78rem;font-weight:800}.open{background:#e8f7ee;color:#18784a}.closed-status{background:#fdecec;color:#a12c2c}.wait{background:#fff4d6;color:#876400}.count{margin-top:8px;font-size:.9rem;font-weight:800;color:#263f58}.general{margin-top:22px;text-align:center}.general a{display:inline-block;background:#c9a227;color:#17263a;padding:13px 20px;border-radius:12px;text-decoration:none;font-weight:800}@media(max-width:650px){.test-grid{grid-template-columns:1fr}.test-card{padding:22px}}</style></head><body><main class="wrap test-wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="index.html">← Home</a></div><section class="hero"><h1>📝 Physics Tests</h1></section><section class="test-grid"><a id="officialCard" class="test-card" href="official-test-v2.html"><div class="test-icon">🏆</div><h2>Official Test</h2><span id="officialStatus" class="status open">● OPEN</span><div id="officialCount" class="count"></div></a><a id="conceptualCard" class="test-card" href="conceptual-90.html"><div class="test-icon">🧠</div><h2>Conceptual Test</h2><span id="conceptualStatus" class="status open">● OPEN</span><div id="conceptualCount" class="count"></div></a></section><section class="general"><a href="student-results-live.html">📈 Grading System</a></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,doc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig)),ref=doc(db,'admin_settings','tests');let latest={};function cd(iso){if(!iso)return'';let ms=new Date(iso).getTime()-Date.now();if(ms<=0)return'';let s=Math.floor(ms/1000),d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return(d?' '+d+'d ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function apply(t){const card=document.getElementById(t+'Card'),status=document.getElementById(t+'Status'),count=document.getElementById(t+'Count'),s=latest,enabled=s[t+'Enabled']!==false,open=s[t+'OpenAt']?new Date(s[t+'OpenAt']).getTime():0,close=s[t+'CloseAt']?new Date(s[t+'CloseAt']).getTime():0,now=Date.now(),waiting=enabled&&open&&now<open,active=enabled&&!waiting&&(!close||now<close);card.classList.toggle('closed',!active);status.textContent=active?'● OPEN':waiting?'● WAITING':'● CLOSED';status.className='status '+(active?'open':waiting?'wait':'closed-status');count.textContent=waiting?'Opens in '+cd(s[t+'OpenAt']):(active&&close?'Closes in '+cd(s[t+'CloseAt']):'');if(!active){card.removeAttribute('href');card.onclick=e=>{e.preventDefault()}}else{card.href=t==='official'?'official-test-v2.html':'conceptual-90.html';card.onclick=null}}onSnapshot(ref,s=>{latest=s.exists()?s.data():{};apply('official');apply('conceptual')},()=>{latest={};apply('official');apply('conceptual')});setInterval(()=>{apply('official');apply('conceptual')},1000);</script></body></html>
