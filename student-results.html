<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grading System</title><link rel="stylesheet" href="academic.css"><style>table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:9px;border:1px solid #dbe5ec;text-align:center;white-space:nowrap}th{background:#102a43;color:#fff;position:sticky;top:0}.wrapx{overflow:auto}.btn{border:0;border-radius:14px;padding:14px 24px;background:#102a43;color:#fff;font-weight:800;cursor:pointer;transition:.2s transform,.2s box-shadow}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #102a4320}#area{animation:rise .45s ease}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="index.html">← Home</a></div><section class="hero"><h1>📊 Grading System</h1></section><section class="panel"><div style="text-align:center"><button class="btn" id="showBtn">📊 Show General Result</button></div><div id="status" style="text-align:center;margin:14px"></div><div id="area" style="display:none"><div class="wrapx"><table><thead><tr><th>Rank</th><th>Student ID</th><th>အမည်</th><th>Attendance /40</th><th>Attendance %</th><th>Participation /30</th><th>Participation %</th><th>Homework /30</th><th>Homework %</th><th>Official /100</th><th>Total /200</th><th>Overall %</th><th>Grade</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds,myanmarDateTime}from'./firebase-data.js';import{schoolDates,historicalAttendance,historicalHomework}from'./attendance-homework-policy.js';import{forcedAbsent}from'./attendance-authority.js';const db=getFirestore(initializeApp(firebaseConfig));const rowsEl=document.getElementById('rows'),statusEl=document.getElementById('status'),area=document.getElementById('area');const sets={attendance:[],participation:[],homework:[],official:[]};let settings={};const loaded=new Set();function today(){return myanmarDateTime().date}function normId(v){return String(v??'').trim().toUpperCase()}function sameId(a,b){return normId(a)===normId(b)}function valueTime(v){if(v&&typeof v.toMillis==='function')return v.toMillis();if(v instanceof Date)return v.getTime();if(typeof v==='number')return v;const n=new Date(v).getTime();return Number.isFinite(n)?n:0}function tm(x){const t=valueTime(x?.timestamp);if(t)return t;const u=valueTime(x?.updatedAt);if(u)return u;if(x?.date&&x?.time){const d=new Date(x.date+'T'+x.time).getTime();if(Number.isFinite(d))return d}if(x?.date){const d=new Date(x.date+'T00:00:00').getTime();if(Number.isFinite(d))return d}return 0}function cutoff(k){return Math.max(...[settings.allResetAt,settings.gradingResetAt,settings[k+'ResetAt'],k==='official'?settings.officialResetAt:0].filter(Boolean).map(valueTime).filter(Boolean),0)}function fresh(k,x){const c=cutoff(k);return !c||tm(x)>=c}function mergeByDate(base,live,id,k){const map={};base.filter(x=>x.date<=today()).forEach(x=>map[x.date]=x);live.filter(x=>sameId(x.id,id)&&x.date<=today()&&fresh(k,x)&&!(k==='attendance'&&forcedAbsent(id,x.date))).forEach(x=>map[x.date]={...map[x.date],...x});return Object.values(map)}function mergedAttendance(id){return mergeByDate(historicalAttendance(id),sets.attendance,id,'attendance')}function mergedHomework(id){return mergeByDate(historicalHomework(id),sets.homework,id,'homework')}function homeworkCompleted(x){if(!x)return false;if(x.completed===true)return true;const s=String(x.status??'').trim().toLowerCase();return['completed','complete','done','submitted'].includes(s)}function pct(v,total){return total?Math.max(0,Math.min(100,v/total*100)):0}function grade(p){return p>=90?'A*':p>=80?'A':p>=70?'B*':p>=60?'B':p>=50?'C*':p>=40?'C':'D'}function one(id){const days=schoolDates().length;const attendance=mergedAttendance(id);const present=attendance.filter(x=>String(x.status??'').trim().toLowerCase()==='present').length;const attendancePct=pct(present,days);const a=attendancePct*40/100;const homework=mergedHomework(id);const completed=new Set(homework.filter(homeworkCompleted).map(x=>x.date)).size;const homeworkPct=pct(completed,days);const h=homeworkPct*30/100;const ps=sets.participation.filter(x=>sameId(x.id,id)&&fresh('participation',x)).sort((x,y)=>tm(y)-tm(x));const p=Math.max(0,Math.min(30,Number(ps[0]?.mark)||0));const os=sets.official.filter(x=>sameId(x.id,id)&&fresh('official',x)).sort((x,y)=>tm(y)-tm(x));const o=Math.max(0,Math.min(100,Number(os[0]?.score)||0));const total=a+p+h+o,overall=total/2;return{id,name:students[id],a,p,h,o,total,overall,grade:grade(overall),attendancePct,homeworkPct,present,completed,days}}function calc(){if(loaded.size<4){statusEl.textContent=`Loading… ${loaded.size}/4`;return}const out=studentIds.map(id=>one(id)).sort((x,y)=>y.overall-x.overall||x.id.localeCompare(y.id));rowsEl.innerHTML=out.map((x,i)=>`<tr><td>${i+1}</td><td>${x.id}</td><td>${x.name}</td><td>${x.a.toFixed(2)}/40</td><td>${x.attendancePct.toFixed(2)}%</td><td>${x.p.toFixed(2)}/30</td><td>${(x.p/30*100).toFixed(2)}%</td><td>${x.h.toFixed(2)}/30</td><td>${x.homeworkPct.toFixed(2)}%</td><td>${x.o.toFixed(2)}/100</td><td><b>${x.total.toFixed(2)}/200</b></td><td><b>${x.overall.toFixed(2)}%</b></td><td><b>${x.grade}</b></td></tr>`).join('');statusEl.textContent='';} [['attendance','attendance_records'],['participation','participation_records'],['homework','homework_records'],['official','physics_official_results']].forEach(([k,n])=>onSnapshot(collection(db,n),s=>{sets[k]=s.docs.map(d=>d.data());loaded.add(k);if(area.style.display!=='none')calc()},e=>{statusEl.textContent='Unable to load data';console.error(n,e)}));onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};if(area.style.display!=='none')calc()},e=>console.error(e));showBtn.onclick=()=>{area.style.display='block';calc()};</script></body></html>
