<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Students Detailed Report</title><link rel="stylesheet" href="academic.css"><style>body{margin:0;background:linear-gradient(135deg,#eef3f8,#fffaf0);font-family:Arial,'Noto Sans Myanmar',sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.hero{margin-bottom:18px}.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 12px 35px #142b4318}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.btn{border:0;border-radius:12px;padding:12px 17px;background:linear-gradient(135deg,#142b43,#24577a);color:#fff;font-weight:800;cursor:pointer}.report{position:fixed;left:-20000px;top:0;width:1700px;background:#fff;color:#142b43;font-family:Arial,'Noto Sans Myanmar',sans-serif}.frame{box-sizing:border-box;width:1700px;padding:45px;border:5px double #d4af37;background:#fff}.head{text-align:center;border-bottom:2px solid #d4af37;padding-bottom:20px;margin-bottom:20px}.logo{width:82px;height:82px;object-fit:contain}.school{font-size:28px;font-weight:800;margin-top:8px}.sub{font-size:17px;color:#607487;margin-top:5px}.subject{font-size:19px;font-weight:800;color:#24577a;margin-top:7px}.head h2{font-size:29px;color:#24577a;margin:14px 0 5px}.date{font-size:13px;color:#718090}.report table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:17px}.report th{background:#102a43;color:#fff;padding:13px 7px;border:2px solid #fff;text-align:center}.report td{padding:13px 7px;border:1px solid #c9d5df;text-align:center;white-space:nowrap}.report tbody tr:nth-child(even){background:#f5f8fb}.rank{width:6%;font-weight:800}.id{width:12%}.name{width:22%;text-align:left!important;font-weight:700}.score{width:9.5%}.total{font-weight:800;background:#eaf2f7}.grade{font-weight:900;background:#fff3cf}.summary{margin-top:18px;padding:14px;border:1px solid #d4af37;background:#fffaf0;font-size:14px;text-align:center}.footer{margin-top:25px;padding-top:15px;border-top:1px solid #dbe5ec;display:flex;justify-content:flex-end}.sign{width:230px;text-align:center;padding-top:34px;border-top:1px solid #718090;font-size:15px;font-weight:700}@media(max-width:700px){.actions{display:grid}.btn{width:100%}}</style></head><body><main class="wrap"><section class="hero"><h1>📋 All Students Detailed Report</h1><p>Subject: Physics · Firebase Live</p></section><section class="panel"><div id="status">Loading Firebase…</div><div class="actions"><button class="btn" id="png">🖼️ Generate Landscape Report PNG</button><button class="btn" id="print">🖨️ Print Report</button></div><p>ကလေးအားလုံးရဲ့ grading detail ကို school logo ပါတဲ့ landscape-style report တစ်ပုံတည်းအဖြစ် ထုတ်နိုင်ပါတယ်။ Attendance နှင့် Homework သည် ယနေ့အထိ School Days ကို denominator အဖြစ်အသုံးပြုပါသည်။</p></section></main><div id="report" class="report"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds}from'./firebase-data.js';import{schoolDates,historicalAttendance,historicalHomework,today}from'./attendance-homework-policy.js';import{forcedAbsent}from'./attendance-authority.js';const db=getFirestore(initializeApp(firebaseConfig));const sets={attendance:[],participation:[],homework:[],official:[]};let settings={},loaded=0;function tm(x){const v=x?.timestamp;if(!v)return new Date(x?.date&&x?.time?x.date+'T'+x.time:0).getTime();if(typeof v==='object'&&typeof v.toMillis==='function')return v.toMillis();return new Date(v).getTime()||0}function cutoff(k){return Math.max(settings.allResetAt?new Date(settings.allResetAt).getTime():0,settings.gradingResetAt?new Date(settings.gradingResetAt).getTime():0,settings[k+'ResetAt']?new Date(settings[k+'ResetAt']).getTime():0,k==='official'&&settings.officialResetAt?new Date(settings.officialResetAt).getTime():0)}function fresh(k,x){return tm(x)>=cutoff(k)}function same(a,b){return String(a??'').trim().toUpperCase()===String(b??'').trim().toUpperCase()}function merge(base,live,id,k){const map={};base.filter(x=>x.date<=today()).forEach(x=>map[x.date]=x);live.filter(x=>same(x.id,id)&&x.date<=today()&&fresh(k,x)&&!(k==='attendance'&&forcedAbsent(id,x.date))).forEach(x=>map[x.date]={...map[x.date],...x});return Object.values(map)}function pct(v,t){return t?Math.max(0,Math.min(100,v/t*100)):0}function grade(p){return p>=90?'A*':p>=80?'A':p>=70?'B*':p>=60?'B':p>=50?'C*':p>=40?'C':'D'}function one(id){const days=schoolDates().length||1;const aRows=merge(historicalAttendance(id),sets.attendance,id,'attendance'),present=aRows.filter(x=>String(x.status??'').trim().toLowerCase()==='present').length;const a=pct(present,days)*.4;const hRows=merge(historicalHomework(id),sets.homework,id,'homework'),completed=new Set(hRows.filter(x=>x.completed===true||['completed','complete','done','submitted'].includes(String(x.status??'').trim().toLowerCase())).map(x=>x.date)).size;const h=pct(completed,days)*.3;const ps=sets.participation.filter(x=>same(x.id,id)&&fresh('participation',x)).sort((x,y)=>tm(y)-tm(x));const p=Math.max(0,Math.min(30,Number(ps[0]?.mark)||0));const os=sets.official.filter(x=>same(x.id,id)&&fresh('official',x)).sort((x,y)=>tm(y)-tm(x));const o=Math.max(0,Math.min(100,Number(os[0]?.score)||0));const total=a+p+h+o;return[a,p,h,o,total,total/2,grade(total/2),pct(present,days),pct(completed,days),days]}function rows(){return studentIds.map(id=>[id,students[id],...one(id)]).sort((a,b)=>b[6]-a[6]||a[0].localeCompare(b[0]))}function render(){status.textContent=loaded>=4?'● Firebase Live — device အားလုံး sync ဖြစ်နေပါသည်။':'Firebase collections '+loaded+'/4 ကိုဖတ်နေသည်…';makeReport(rows())}function makeReport(rs){report.innerHTML='<div class="frame"><div class="head"><img class="logo" src="https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ" crossorigin="anonymous" alt="School Logo"><div class="school">VICTORY LAND FEDERAL SCHOOL</div><div class="sub">Grade 11 · Student Academic Management System</div><div class="subject">Subject - Physics</div><h2>ALL STUDENTS — DETAILED GRADING REPORT</h2><div class="date">School Days: '+(rs[0]?.[11]||schoolDates().length)+' · Generated: '+today()+'</div></div><table><thead><tr><th class="rank">Rank</th><th class="id">Student ID</th><th class="name">Student Name</th><th class="score">Attendance<br>/40</th><th class="score">Participation<br>/30</th><th class="score">Homework<br>/30</th><th class="score">Official Test<br>/100</th><th class="score">Total<br>/200</th><th class="score">Overall<br>%</th><th class="score">Final<br>Grade</th></tr></thead><tbody>'+rs.map((r,i)=>'<tr><td class="rank">'+(i+1)+'</td><td>'+r[0]+'</td><td class="name">'+r[1]+'</td><td>'+Number(r[2]).toFixed(2)+'<br><small>'+Number(r[8]).toFixed(2)+'%</small></td><td>'+Number(r[3]).toFixed(2)+'</td><td>'+Number(r[4]).toFixed(2)+'<br><small>'+Number(r[9]).toFixed(2)+'%</small></td><td>'+Number(r[5]).toFixed(2)+'</td><td class="total">'+Number(r[6]).toFixed(2)+'</td><td class="total">'+Number(r[7]).toFixed(2)+'%</td><td class="grade">'+r[8]+'</td></tr>').join('')+'</tbody></table><div class="summary"><b>Grading Scale:</b> A* ≥ 90% · A ≥ 80% · B* ≥ 70% · B ≥ 60% · C* ≥ 50% · C ≥ 40% · D &lt; 40% &nbsp; | &nbsp; <b>Attendance:</b> Present ÷ School Days × 40 &nbsp; | &nbsp; <b>Homework:</b> Completed ÷ School Days × 30 &nbsp; | &nbsp; <b>Total Students: '+rs.length+'</b></div><div class="footer"><div class="sign">Sir Lynn</div></div></div>'}function waitImage(img){return new Promise(resolve=>{if(img.complete)return resolve();img.onload=img.onerror=()=>resolve()})}async function exportPNG(){try{report.style.display='block';const img=report.querySelector('.logo');if(img)await waitImage(img);await new Promise(r=>setTimeout(r,300));const c=await html2canvas(report,{scale:2,backgroundColor:'#fff',useCORS:true,allowTaint:false,logging:false});report.style.display='none';const a=document.createElement('a');a.download='Grade11_Physics_All_Students_Detailed_Report_Landscape.png';a.href=c.toDataURL('image/png');a.click()}catch(e){report.style.display='none';alert('PNG generate မအောင်မြင်ပါ: '+e.message)}}function printReport(){const w=window.open('','_blank');if(!w)return alert('Popup ကို Allow လုပ်ပေးပါ');w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Grade 11 Physics Report</title><style>@page{size:A4 landscape;margin:7mm}body{margin:0;font-family:Arial,"Noto Sans Myanmar",sans-serif}.frame{border:5px double #d4af37;padding:25px;background:#fff}.head{text-align:center;border-bottom:2px solid #d4af37;padding-bottom:15px;margin-bottom:15px}.logo{width:70px;height:70px}.school{font-size:24px;font-weight:800}.sub{font-size:15px;color:#607487}.subject{font-size:17px;font-weight:800;color:#24577a}.head h2{font-size:24px;color:#24577a;margin:10px 0 4px}.date{font-size:11px;color:#718090}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#102a43;color:#fff;padding:8px}td{padding:8px;border:1px solid #c9d5df;text-align:center;white-space:nowrap}.name{text-align:left}.total{font-weight:800;background:#eaf2f7}.grade{font-weight:900;background:#fff3cf}.summary{margin-top:12px;padding:8px;border:1px solid #d4af37;text-align:center;font-size:11px}.footer{text-align:right;margin-top:22px}.sign{display:inline-block;width:150px;padding-top:30px;border-top:1px solid #718090;font-weight:700}</style></head><body>'+report.innerHTML+'</body></html>');w.document.close();setTimeout(()=>w.print(),700)}[['attendance','attendance_records'],['participation','participation_records'],['homework','homework_records'],['official','physics_official_results']].forEach(([k,n])=>onSnapshot(collection(db,n),s=>{sets[k]=s.docs.map(d=>d.data());loaded++;render()},e=>status.textContent='Firebase error: '+e.message));onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};render()});png.onclick=exportPNG;print.onclick=printReport;</script></body></html>
