<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Students Detailed Report</title><link rel="stylesheet" href="academic.css"><style>body{margin:0;background:linear-gradient(135deg,#eef3f8,#fffaf0);font-family:Arial,'Noto Sans Myanmar',sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 12px 35px #142b4318}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 17px;background:#142b43;color:#fff;font-weight:800;cursor:pointer}.report{position:fixed;left:-20000px;top:0;width:1700px;background:#fff;color:#142b43;padding:45px;box-sizing:border-box}.head{text-align:center;border-bottom:2px solid #d4af37;padding-bottom:20px;margin-bottom:20px}.logo{width:82px;height:82px}.school{font-size:28px;font-weight:800}.title{font-size:24px;color:#24577a;font-weight:800;margin-top:8px}.meta{font-size:12px;color:#718090}.report table{width:100%;border-collapse:collapse;font-size:16px}.report th{background:#102a43;color:#fff;padding:12px;border:2px solid #fff}.report td{padding:12px;border:1px solid #c9d5df;text-align:center;white-space:nowrap}.note{margin-top:18px;padding:12px;border:1px solid #d4af37;background:#fffaf0;text-align:center;font-size:12px}</style></head><body><main class="wrap"><section class="hero"><h1>📋 All Students Detailed Report</h1><p>Subject: Physics · Firebase Live</p></section><section class="panel"><div id="status">Loading Firebase…</div><div class="actions"><button class="btn" id="png">🖼️ Generate Landscape Report PNG</button><button class="btn" id="print">🖨️ Print Report</button></div><p>Attendance/Homework use the Student Grading Results calculation with the same Admin Reset cutoff. Historic data is preserved in Firebase.</p></section></main><div id="report" class="report"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds,myanmarDateTime}from'./firebase-data.js';import{historicalAttendance,historicalHomework}from'./attendance-homework-policy.js';const db=getFirestore(initializeApp(firebaseConfig)),sets={attendance:[],participation:[],homework:[],official:[]};let settings={},loaded=new Set();const today=()=>myanmarDateTime().date,id=v=>String(v??'').trim().toUpperCase(),same=(a,b)=>id(a)===id(b),vt=v=>v&&typeof v.toMillis==='function'?v.toMillis():v instanceof Date?v.getTime():typeof v==='number'?v:new Date(v).getTime()||0,tm=x=>vt(x?.timestamp)||vt(x?.updatedAt)||vt(x?.date&&x?.time?x.date+'T'+x.time:x?.date?x.date+'T00:00:00':0),cut=k=>Math.max(...[settings.allResetAt,settings.gradingResetAt,settings[k+'ResetAt'],k==='official'?settings.officialResetAt:0].filter(Boolean).map(vt).filter(Boolean),0),fresh=(k,x)=>{const c=cut(k);return!c||tm(x)>=c},hw=x=>x?.completed===true||['completed','complete','done','submitted'].includes(String(x?.status??'').trim().toLowerCase()),pct=(v,t)=>t?Math.max(0,Math.min(100,v/t*100)):0,grade=v=>v>=90?'A*':v>=80?'A':v>=70?'B*':v>=60?'B':v>=50?'C*':v>=40?'C':'D';function merge(base,live,s,k){const c=cut(k),m={};base.filter(x=>x.date<=today()&&(!c||tm(x)>=c)).forEach(x=>m[x.date]=x);live.filter(x=>same(x.id,s)&&x.date<=today()&&fresh(k,x)).forEach(x=>m[x.date]={...m[x.date],...x});return Object.values(m)}function one(s){const ar=merge(historicalAttendance(s),sets.attendance,s,'attendance'),hr=merge(historicalHomework(s),sets.homework,s,'homework'),ad=ar.length,hd=hr.length,present=ar.filter(x=>String(x.status??'').trim().toLowerCase()==='present').length,completed=new Set(hr.filter(hw).map(x=>x.date)).size,a=pct(present,ad)*.4,h=pct(completed,hd)*.3,ps=sets.participation.filter(x=>same(x.id,s)&&fresh('participation',x)).sort((a,b)=>tm(b)-tm(a)),os=sets.official.filter(x=>same(x.id,s)&&fresh('official',x)).sort((a,b)=>tm(b)-tm(a)),p=Math.max(0,Math.min(30,Number(ps[0]?.mark)||0)),o=Math.max(0,Math.min(100,Number(os[0]?.score)||0)),total=a+p+h+o,overall=total/2;return{id:s,name:students[s],a,p,h,o,total,overall,grade:grade(overall),ap:pct(present,ad),hp:pct(completed,hd),ad,hd}}function rows(){return studentIds.map(one).sort((a,b)=>b.overall-a.overall||a.id.localeCompare(b.id))}function build(){const rs=rows();status.textContent=loaded.size>=4?'● Firebase Live — Admin Reset cutoff applied':'Firebase '+loaded.size+'/4';report.innerHTML='<div class="head"><img class="logo" src="https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ"><div class="school">VICTORY LAND FEDERAL SCHOOL</div><div>Grade 11 · Physics</div><div class="title">ALL STUDENTS — DETAILED GRADING REPORT</div><div class="meta">Generated: '+today()+' · Reset-aware</div></div><table><tr><th>Rank</th><th>Student ID</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official /100</th><th>Total /200</th><th>Overall %</th><th>Grade</th></tr>'+rs.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+r.id+'</td><td>'+r.a.toFixed(2)+'<br><small>'+r.ap.toFixed(2)+'% · '+r.ad+' days</small></td><td>'+r.p.toFixed(2)+'</td><td>'+r.h.toFixed(2)+'<br><small>'+r.hp.toFixed(2)+'% · '+r.hd+' days</small></td><td>'+r.o.toFixed(2)+'</td><td>'+r.total.toFixed(2)+'</td><td>'+r.overall.toFixed(2)+'%</td><td><b>'+r.grade+'</b></td></tr>').join('')+'</table><div class="note">Subject - Physics · Admin Reset cutoff applied without deleting Firebase data. Attendance/Homework use post-reset historic + submitted live records only. Unfilled current/future days are excluded. Individual student report cards remain portrait format.</div>'}async function png(){report.style.display='block';await new Promise(r=>setTimeout(r,200));const c=await html2canvas(report,{scale:2,backgroundColor:'#fff',useCORS:true});report.style.display='none';const a=document.createElement('a');a.download='Grade11_Physics_All_Students_Detailed_Report_Landscape.png';a.href=c.toDataURL('image/png');a.click()}function printReport(){const w=window.open('','_blank');if(!w)return alert('Popup ကို Allow လုပ်ပေးပါ');w.document.write('<html><head><title>Grade 11 Physics Report</title><style>@page{size:A4 landscape;margin:7mm}body{font-family:Arial,"Noto Sans Myanmar",sans-serif}.report{position:static!important;width:auto!important;padding:20px}.head{text-align:center}.logo{width:70px}.school{font-size:24px;font-weight:800}.title{font-size:22px}table{width:100%;border-collapse:collapse}th{background:#102a43;color:#fff;padding:8px}td{padding:8px;border:1px solid #ccc;text-align:center}</style></head><body>'+report.innerHTML+'</body></html>');w.document.close();setTimeout(()=>w.print(),500)}png.onclick=png;print.onclick=printReport;[['attendance','attendance_records'],['participation','participation_records'],['homework','homework_records'],['official','physics_official_results']].forEach(([k,n])=>onSnapshot(collection(db,n),s=>{sets[k]=s.docs.map(d=>d.data());loaded.add(k);build()},e=>console.error(e)));onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};build()});build();</script></body></html>
