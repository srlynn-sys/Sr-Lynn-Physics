<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Students Detailed Report</title><link rel="stylesheet" href="academic.css"><style>body{background:linear-gradient(135deg,#eef3f8,#fffaf0)}.wrap{max-width:1500px;margin:auto;padding:24px}.hero{margin-bottom:18px}.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 12px 35px #142b4318}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.btn{border:0;border-radius:12px;padding:12px 17px;background:linear-gradient(135deg,#142b43,#24577a);color:#fff;font-weight:800;cursor:pointer}.report{position:fixed;left:-10000px;top:0;width:1800px;padding:55px;background:#fff;color:#142b43;font-family:Arial,'Noto Sans Myanmar',sans-serif}.frame{border:5px double #d4af37;padding:38px;background:#fff}.head{text-align:center;border-bottom:2px solid #d4af37;padding-bottom:22px;margin-bottom:22px}.logo{width:88px;height:88px;object-fit:contain}.school{font-size:29px;font-weight:800;margin-top:8px}.sub{font-size:18px;color:#607487;margin-top:5px}.subject{font-size:19px;font-weight:800;color:#24577a;margin-top:8px}.head h2{font-size:30px;color:#24577a;margin:16px 0 5px}.date{font-size:14px;color:#718090}.report table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:18px}.report th{background:#102a43;color:#fff;padding:14px 9px;border:2px solid #fff;text-align:center}.report td{padding:14px 8px;border:1px solid #c9d5df;text-align:center;white-space:nowrap}.report tbody tr:nth-child(even){background:#f5f8fb}.rank{font-weight:800;width:7%}.id{width:12%}.name{text-align:left!important;font-weight:700;width:22%}.score{width:9%}.total{font-weight:800;background:#eaf2f7}.grade{font-weight:900;background:#fff3cf}.summary{margin-top:22px;padding:16px;border:1px solid #d4af37;background:#fffaf0;font-size:15px;text-align:center}.footer{margin-top:30px;padding-top:18px;border-top:1px solid #dbe5ec;display:flex;justify-content:flex-end;font-size:14px;color:#718090}.sign{width:250px;text-align:center;border-top:1px solid #718090;padding-top:8px}@media(max-width:700px){.actions{display:grid}.btn{width:100%}}</style></head><body><main class="wrap"><section class="hero"><h1>📋 All Students Detailed Report</h1><p>Subject: Physics · Firebase Live</p></section><section class="panel"><div id="status">Loading Firebase…</div><div class="actions"><button class="btn" id="png">🖼️ Generate Landscape Report PNG</button><button class="btn" id="print">🖨️ Print Report</button></div><p>ကလေးအားလုံးရဲ့ grading detail ကို school logo ပါတဲ့ landscape-style report တစ်ပုံတည်းအဖြစ် ထုတ်နိုင်ပါတယ်။</p></section></main><div id="report" class="report"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig));const sets={attendance:[],participation:[],homework:[],official:[]};let settings={};let loaded=0;function tm(x){const v=x?.timestamp;if(!v)return new Date(x?.date&&x?.time?x.date+'T'+x.time:0).getTime();if(typeof v==='object'&&typeof v.toMillis==='function')return v.toMillis();return new Date(v).getTime()||0}function cutoff(kind){return Math.max(settings.allResetAt?new Date(settings.allResetAt).getTime():0,settings.gradingResetAt?new Date(settings.gradingResetAt).getTime():0,settings[kind+'ResetAt']?new Date(settings[kind+'ResetAt']).getTime():0,kind==='official'&&settings.officialResetAt?new Date(settings.officialResetAt).getTime():0)}function fresh(k,x){return tm(x)>=cutoff(k)}function grade(p){return p>=90?'A*':p>=80?'A':p>=70?'B*':p>=60?'B':p>=50?'C*':p>=40?'C':'D'}function one(id){const a=Math.min(40,sets.attendance.filter(x=>x.id===id&&x.status==='Present'&&fresh('attendance',x)).length);const ps=sets.participation.filter(x=>x.id===id&&fresh('participation',x)).sort((x,y)=>tm(y)-tm(x));const p=Math.min(30,Number(ps[0]?.mark)||0);const h=Math.min(30,new Set(sets.homework.filter(x=>x.id===id&&x.completed&&fresh('homework',x)).map(x=>x.date)).size);const os=sets.official.filter(x=>x.id===id&&fresh('official',x)).sort((x,y)=>tm(y)-tm(x));const o=Math.min(100,Number(os[0]?.score)||0);const total=a+p+h+o;return[a,p,h,o,total,total/2,grade(total/2)]}function rows(){return studentIds.map(id=>[id,students[id],...one(id)]).sort((a,b)=>b[6]-a[6])}function render(){const rs=rows();status.textContent=loaded>=4?'● Firebase Live — device အားလုံး sync ဖြစ်နေပါသည်။':'Firebase collections '+loaded+'/4 ကိုဖတ်နေသည်…';makeReport(rs)}[['attendance','attendance_records'],['participation','participation_records'],['homework','homework_records'],['official','physics_official_results']].forEach(([k,n])=>onSnapshot(collection(db,n),s=>{sets[k]=s.docs.map(d=>d.data());loaded++;render()}));onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};render()});function makeReport(rs){report.innerHTML='<div class="frame"><div class="head"><img class="logo" src="https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ" crossorigin="anonymous"><div class="school">VICTORY LAND FEDERAL SCHOOL</div><div class="sub">Grade 11 · Student Academic Management System</div><div class="subject">Subject - Physic</div><h2>ALL STUDENTS — DETAILED GRADING REPORT</h2><div class="date">Generated: '+new Date().toLocaleString()+'</div></div><table><thead><tr><th class="rank">Rank</th><th class="id">Student ID</th><th class="name">Student Name</th><th class="score">Attendance<br>/40</th><th class="score">Participation<br>/30</th><th class="score">Homework<br>/30</th><th class="score">Official Test<br>/100</th><th class="score">Total<br>/200</th><th class="score">Overall<br>%</th><th class="score">Final<br>Grade</th></tr></thead><tbody>'+rs.map((r,i)=>'<tr><td class="rank">'+(i+1)+'</td><td>'+r[0]+'</td><td class="name">'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+r[5]+'</td><td class="total">'+r[6]+'</td><td class="total">'+Number(r[7]).toFixed(2)+'%</td><td class="grade">'+r[8]+'</td></tr>').join('')+'</tbody></table><div class="summary"><b>Grading Scale:</b> A* ≥ 90% · A ≥ 80% · B* ≥ 70% · B ≥ 60% · C* ≥ 50% · C ≥ 40% · D &lt; 40% &nbsp; | &nbsp; <b>Total Students: '+rs.length+'</b></div><div class="footer"><span class="sign">Sir Lynn</span></div></div>'}async function exportPNG(){try{report.style.display='block';await new Promise(r=>setTimeout(r,300));const c=await html2canvas(report,{scale:2,backgroundColor:'#fff',useCORS:true,allowTaint:false,windowWidth:1900});report.style.display='none';const a=document.createElement('a');a.download='Grade11_Physics_All_Students_Detailed_Report_Landscape.png';a.href=c.toDataURL('image/png');a.click()}catch(e){report.style.display='none';alert('PNG generate မအောင်မြင်ပါ: '+e.message)}}function printReport(){report.style.position='static';report.style.left='auto';report.style.width='auto';report.style.padding='0';report.style.display='block';const w=window.open('','_blank');w.document.write('<html><head><title>Grade 11 Physics Report</title><style>@page{size:A4 landscape;margin:8mm}body{margin:0}'+document.querySelector('style').innerHTML+'</style></head><body>'+report.innerHTML+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),500);report.style.position='fixed';report.style.left='-10000px';report.style.width='1800px';report.style.padding='55px';report.style.display='none'}png.onclick=exportPNG;print.onclick=printReport;</script></body></html>
