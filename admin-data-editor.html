<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Data Editor — Grade 11 Physics</title><style>:root{--navy:#102a43;--gold:#c9a227;--ink:#17324d;--muted:#708090;--line:#dce6ee;--danger:#b63b3b;--ok:#18784a}*{box-sizing:border-box}body{margin:0;padding:12px;background:linear-gradient(135deg,#eef3f8,#fffdf7);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1400px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 12px 35px #263f5812}.head{background:linear-gradient(135deg,#102a43,#1e4665);color:#fff}.head h1{margin:6px 0}.head p{margin:0;opacity:.85}.toolbar{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}.input,.select{width:100%;padding:11px;border:1px solid #cbd6df;border-radius:10px;background:#fff}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.tab{border:1px solid var(--line);background:#f7fafc;border-radius:12px;padding:12px;font-weight:850;cursor:pointer}.tab.active{background:var(--navy);color:#fff}.statusbox{padding:10px 12px;border-radius:10px;background:#f5f8fb;margin-top:10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{border:1px solid var(--line);padding:9px;text-align:center;vertical-align:middle}.table th{background:var(--navy);color:#fff;position:sticky;top:0}.table input,.table select{width:100%;padding:8px;border:1px solid #cbd6df;border-radius:8px}.btn{border:0;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer;margin:2px}.edit{background:var(--gold);color:#17263a}.save{background:var(--ok);color:#fff}.delete{background:var(--danger);color:#fff}.cancel{background:#e8eef3;color:var(--ink)}.muted{color:var(--muted);font-size:.88rem}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:14px;border:1px solid var(--line);border-radius:14px;background:#f8fbfd}.metric b{display:block;font-size:1.25rem;margin-top:4px}@media(max-width:800px){.toolbar,.summary{grid-template-columns:1fr}.tabs{grid-template-columns:1fr 1fr}.tab:last-child{grid-column:1/-1}.card{padding:13px}}</style></head><body><main class="wrap"><section class="card head"><button class="btn cancel" onclick="location.href='admin-panel.html'">← Admin Panel</button><h1>🛠️ Individual Data Editor</h1><p>Student တစ်ယောက်ချင်း · Date တစ်ရက်ချင်း · Record တစ်ခုချင်း Edit / Delete / Cancel</p></section><section class="card"><div class="toolbar"><input id="studentFilter" class="input" placeholder="Student ID / Name ဖြင့်ရှာရန်"><input id="dateFilter" class="input" type="date"><select id="typeFilter" class="select"><option value="all">အားလုံး</option><option value="attendance">Present / Absent / Leave</option><option value="homework">Homework</option><option value="participation">Participation</option><option value="test">Test</option></select></div><p class="muted">Edit → Save / Cancel။ Delete သည် ရွေးထားသော Firebase record တစ်ခုတည်းကိုသာ ဖျက်ပါမည်။</p><div id="statusBox" class="statusbox">Firebase data ဖတ်နေသည်…</div></section><section class="card"><div class="tabs"><button class="tab active" data-tab="attendance">📅 Attendance</button><button class="tab" data-tab="homework">📚 Homework</button><button class="tab" data-tab="participation">⭐ Participation</button><button class="tab" data-tab="test">🏆 Test</button><button class="tab" data-tab="report">🧾 Report Card</button></div></section><section class="card"><div id="tableWrap" class="tablewrap"></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc,updateDoc,deleteDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig));const cfg={attendance:'attendance_records',homework:'homework_records',participation:'participation_records',test:'physics_official_results'};let active='attendance',data={attendance:[],homework:[],participation:[],test:[]};const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=x=>String(x??'').trim().toUpperCase();const setStatus=(msg,ok=true)=>{$('statusBox').textContent=msg;$('statusBox').style.background=ok?'#f0faf4':'#fff1f1'};const timeOf=x=>{const v=x?.updatedAt||x?.timestamp||x?.date;return v?.toDate?v.toDate().getTime():Date.parse(v)||0};function filtered(k){const sf=norm($('studentFilter').value),df=$('dateFilter').value;return data[k].filter(x=>(!sf||norm(x.id).includes(sf)||norm(x.name).includes(sf))&&(!df||String(x.date||'').startsWith(df))).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||timeOf(b)-timeOf(a))}const field=(n,v,t='text')=>`<input data-field="${n}" value="${esc(v)}" type="${t}">`;function render(){if(active==='report')return renderReport();const rows=filtered(active);let h='';if(active==='attendance')h=`<table class="table"><thead><tr><th>Date</th><th>Student</th><th>Status</th><th>Time</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr data-id="${esc(r._docId)}"><td class="dateCell">${esc(r.date)}</td><td><b>${esc(r.id)}</b><br>${esc(r.name)}</td><td class="statusField">${esc(r.status||'Present')}</td><td>${esc(r.time)}</td><td class="actions"><button class="btn edit" onclick="editRow(this)">✏️ Edit</button><button class="btn delete" onclick="removeRow(this)">🗑 Delete</button></td></tr>`).join('')}</tbody></table>`;else if(active==='homework')h=`<table class="table"><thead><tr><th>Date</th><th>Student</th><th>Completed</th><th>Time</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr data-id="${esc(r._docId)}"><td class="dateCell">${esc(r.date)}</td><td><b>${esc(r.id)}</b><br>${esc(r.name)}</td><td class="completedField">${r.completed===true?'Completed':'Not completed'}</td><td>${esc(r.time)}</td><td class="actions"><button class="btn edit" onclick="editRow(this)">✏️ Edit</button><button class="btn delete" onclick="removeRow(this)">🗑 Delete</button></td></tr>`).join('')}</tbody></table>`;else if(active==='participation')h=`<table class="table"><thead><tr><th>Date</th><th>Student</th><th>Mark /30</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr data-id="${esc(r._docId)}"><td class="dateCell">${esc(r.date)}</td><td><b>${esc(r.id)}</b><br>${esc(r.name)}</td><td class="markField">${esc(r.mark??0)}</td><td class="actions"><button class="btn edit" onclick="editRow(this)">✏️ Edit</button><button class="btn delete" onclick="removeRow(this)">🗑 Delete</button></td></tr>`).join('')}</tbody></table>`;else h=`<table class="table"><thead><tr><th>Test</th><th>Student</th><th>Score /100</th><th>Updated</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr data-id="${esc(r._docId)}"><td>${esc(r.testType||'official')}</td><td><b>${esc(r.id)}</b><br>${esc(r.name)}</td><td class="scoreField">${esc(r.score??0)}</td><td>${esc(r.date||'')} ${esc(r.time||'')}</td><td class="actions"><button class="btn edit" onclick="editRow(this)">✏️ Edit</button><button class="btn delete" onclick="removeRow(this)">🗑 Delete</button></td></tr>`).join('')}</tbody></table>`;$('tableWrap').innerHTML=rows.length?h:'<div class="statusbox">ဒီ filter အတွက် record မရှိသေးပါ။</div>'}function renderReport(){const sf=norm($('studentFilter').value);const ids=studentIds.filter(id=>!sf||norm(id).includes(sf)||norm(students[id]).includes(sf));const rows=ids.map(id=>{const aa=data.attendance.filter(x=>norm(x.id)===id),hh=data.homework.filter(x=>norm(x.id)===id),p=data.participation.filter(x=>norm(x.id)===id).sort((a,b)=>timeOf(b)-timeOf(a))[0],t=data.test.filter(x=>norm(x.id)===id).sort((a,b)=>timeOf(b)-timeOf(a))[0];const present=aa.filter(x=>norm(x.status)==='PRESENT').length,ap=aa.length?present/aa.length*100:0,done=hh.filter(x=>x.completed===true).length,hp=hh.length?done/hh.length*100:0,as=ap*.4,hs=hp*.3,ps=Math.max(0,Math.min(30,Number(p?.mark)||0)),ts=Math.max(0,Math.min(100,Number(t?.score)||0)),total=as+hs+ps+ts,overall=total/2;return{id,name:students[id],as,hs,ps,ts,total,overall,grade:overall>=90?'A*':overall>=80?'A':overall>=70?'B*':overall>=60?'B':overall>=50?'C*':overall>=40?'C':'D'}});$('tableWrap').innerHTML=`<div class="summary"><div class="metric">Students<b>${ids.length}</b></div><div class="metric">Attendance records<b>${data.attendance.length}</b></div><div class="metric">Homework records<b>${data.homework.length}</b></div><div class="metric">Test records<b>${data.test.length}</b></div></div><br><table class="table"><thead><tr><th>Student</th><th>Attendance /40</th><th>Homework /30</th><th>Participation /30</th><th>Official /100</th><th>Total /200</th><th>Overall</th><th>Grade</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.id)}</b><br>${esc(r.name)}</td><td>${r.as.toFixed(2)}</td><td>${r.hs.toFixed(2)}</td><td>${r.ps.toFixed(2)}</td><td>${r.ts.toFixed(2)}</td><td>${r.total.toFixed(2)}</td><td>${r.overall.toFixed(2)}%</td><td><b>${r.grade}</b></td></tr>`).join('')}</tbody></table>`}window.editRow=btn=>{const tr=btn.closest('tr');if(active==='attendance'){const cell=tr.querySelector('.statusField'),old=cell.textContent.trim();tr.querySelector('.dateCell').innerHTML=field('date',tr.querySelector('.dateCell').textContent.trim(),'date');cell.innerHTML='<select data-field="status"><option value="Present">Present</option><option value="Absent">Absent</option><option value="Leave">Leave</option></select>';cell.querySelector('select').value=['Present','Absent','Leave'].includes(old)?old:'Present'}else if(active==='homework'){tr.querySelector('.dateCell').innerHTML=field('date',tr.querySelector('.dateCell').textContent.trim(),'date');const old=tr.querySelector('.completedField').textContent.trim()==='Completed';tr.querySelector('.completedField').innerHTML='<select data-field="completed"><option value="true">Completed</option><option value="false">Not completed</option></select>';tr.querySelector('select').value=String(old)}else if(active==='participation')tr.querySelector('.markField').innerHTML=field('mark',tr.querySelector('.markField').textContent.trim(),'number');else tr.querySelector('.scoreField').innerHTML=field('score',tr.querySelector('.scoreField').textContent.trim(),'number');btn.textContent='💾 Save';btn.className='btn save';btn.onclick=()=>saveRow(btn);const c=tr.querySelector('.actions');if(!c.querySelector('.cancel')){const x=document.createElement('button');x.className='btn cancel';x.textContent='↩ Cancel';x.onclick=()=>render();c.appendChild(x)}};window.saveRow=async btn=>{const tr=btn.closest('tr'),id=tr.dataset.id,fields={};tr.querySelectorAll('[data-field]').forEach(el=>fields[el.dataset.field]=el.value);if(active==='homework')fields.completed=fields.completed==='true';if(active==='participation')fields.mark=Math.max(0,Math.min(30,Number(fields.mark)||0));if(active==='test')fields.score=Math.max(0,Math.min(100,Number(fields.score)||0));try{await updateDoc(doc(db,cfg[active],id),{...fields,updatedAt:serverTimestamp()});setStatus('✓ Record updated — Firebase realtime sync');render()}catch(e){console.error(e);setStatus('Save error: '+e.message,false);alert('Save error: '+e.message)}};window.removeRow=async btn=>{const tr=btn.closest('tr'),id=tr.dataset.id;if(!id)return alert('Record ID မတွေ့ပါ။');if(!confirm('ဒီ record တစ်ခုတည်းကို Firebase မှ ဖျက်မည်။ ဆက်လုပ်မလား?'))return;try{await deleteDoc(doc(db,cfg[active],id));setStatus('✓ Record deleted — Firebase realtime sync');render()}catch(e){console.error(e);setStatus('Delete error: '+e.message,false);alert('Delete error: '+e.message)}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.tab;render()});$('studentFilter').oninput=render;$('dateFilter').onchange=render;$('typeFilter').onchange=()=>{const v=$('typeFilter').value;if(v==='all')return;active=v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===active));render()};Object.entries(cfg).forEach(([k,n])=>onSnapshot(collection(db,n),s=>{data[k]=s.docs.map(d=>({_docId:d.id,...d.data()}));setStatus('● Firebase Live — '+k+' records: '+data[k].length);render()},e=>{console.error(e);setStatus('Firebase error: '+e.message,false)}));render();</script></body></html>
