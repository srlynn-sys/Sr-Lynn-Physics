<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 11 Physics — Student Grading Results</title><link rel="stylesheet" href="academic.css"><style>table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:9px;border:1px solid #dbe5ec;text-align:center;white-space:nowrap}th{background:#102a43;color:#fff;position:sticky;top:0}.export-bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.export-btn{border:0;border-radius:12px;padding:10px 14px;background:#142b43;color:#fff;font-weight:700;cursor:pointer}.sheet{position:fixed;left:-20000px;top:0;width:1120px;padding:30px;background:#fff;color:#142b43;font-family:Arial,'Noto Sans Myanmar',sans-serif}.sheet table{min-width:0}.sheet th{position:static}</style></head><body><main class="wrap"><section class="hero"><h1>📊 Student Grading Results</h1><p>Grade 11 · Physics</p></section><section class="panel"><div id="status">Results loading…</div><div class="export-bar"><button class="export-btn" id="pngAll">🖼️ All Students — Landscape PNG</button><button class="export-btn" id="pdfAll">📄 All Students — Landscape PDF</button></div><div style="overflow:auto"><table id="table"><thead><tr><th>Rank</th><th>Student ID</th><th>Name</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official /100</th><th>Total /200</th><th>Overall %</th><th>Grade</th><th>Report Card</th></tr></thead><tbody></tbody></table></div></section></main><div id="sheet" class="sheet"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds,myanmarDateTime}from'./firebase-data.js';import{schoolDates,historicalAttendance,historicalHomework}from'./attendance-homework-policy.js';import{forcedAbsent}from'./attendance-authority.js';const db=getFirestore(initializeApp(firebaseConfig)),tbody=document.querySelector('#table tbody'),status=document.getElementById('status'),sheet=document.getElementById('sheet'),LOGO='https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ');const sets={attendance:[],participation:[],homework:[],official:[]};let settings={},loaded=0;function today(){return myanmarDateTime().date}function id(v){return String(v??'').trim().toUpperCase()}function same(a,b){return id(a)===id(b)}function time(v){if(v&&typeof v.toMillis==='function')return v.toMillis();const n=new Date(v).getTime();return Number.isFinite(n)?n:0}function tm(x){return time(x?.timestamp)||time(x?.updatedAt)||time((x?.date||'')+'T'+(x?.time||'00:00:00'))}function cutoff(k){return Math.max(...[settings.allResetAt,settings.gradingResetAt,settings[k+'ResetAt'],k==='official'?settings.officialResetAt:0].filter(Boolean).map(time),0)}function fresh(k,x){const c=cutoff(k);return !c||tm(x)>=c}function merge(base,live,student,k){const map={};base.filter(x=>x.date<=today()).forEach(x=>map[x.date]=x);live.filter(x=>same(x.id,student)&&x.date<=today()&&fresh(k,x)&&!(k==='attendance'&&forcedAbsent(student,x.date))).forEach(x=>map[x.date]={...map[x.date],...x});return Object.values(map)}function hw(x){return x?.completed===true||['completed','complete','done','submitted'].includes(String(x?.status??'').trim().toLowerCase())}function pct(v,t){return t?Math.max(0,Math.min(100,v/t*100)):0}function grade(v){return v>=90?'A*':v>=80?'A':v>=70?'B*':v>=60?'B':v>=50?'C*':v>=40?'C':'D'}function calc(student){const days=schoolDates().length,aRows=merge(historicalAttendance(student),sets.attendance,student,'attendance'),present=aRows.filter(x=>String(x.status).toLowerCase()==='present').length,a=pct(present,days)*.4,hRows=merge(historicalHomework(student),sets.homework,student,'homework'),completed=new Set(hRows.filter(hw).map(x=>x.date)).size,h=pct(completed,days)*.3,ps=sets.participation.filter(x=>same(x.id,student)&&fresh('participation',x)).sort((a,b)=>tm(b)-tm(a)),os=sets.official.filter(x=>same(x.id,student)&&fresh('official',x)).sort((a,b)=>tm(b)-tm(a)),p=Math.max(0,Math.min(30,Number(ps[0]?.mark)||0)),o=Math.max(0,Math.min(100,Number(os[0]?.score)||0)),total=a+p+h+o,overall=total/2;return{id:student,name:students[student],a,p,h,o,total,overall,grade:grade(overall),attendancePct:pct(present,days),homeworkPct:pct(completed,days),present,completed,days}}function rows(){return studentIds.map(calc).sort((a,b)=>b.overall-a.overall||a.id.localeCompare(b.id))}function render(){if(loaded<4){status.textContent=`Results loading… ${loaded}/4`;return}tbody.innerHTML=rows().map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td>${r.name}</td><td>${r.a.toFixed(2)}/40<br><small>${r.attendancePct.toFixed(2)}%</small></td><td>${r.p.toFixed(2)}/30</td><td>${r.h.toFixed(2)}/30<br><small>${r.homeworkPct.toFixed(2)}%</small></td><td>${r.o.toFixed(2)}/100</td><td><b>${r.total.toFixed(2)}/200</b></td><td>${r.overall.toFixed(2)}%</td><td><b>${r.grade}</b></td><td><button class="export-btn" data-id="${r.id}">🖼️ PNG</button></td></tr>`).join('');status.textContent='● Live — 4/4 grading data sources loaded'}function allSheet(){const rs=rows();sheet.innerHTML=`<h2 style="text-align:center">VICTORY LAND FEDERAL SCHOOL</h2><h3 style="text-align:center">GRADE 11 PHYSICS — ALL STUDENTS</h3><table><thead><tr><th>Rank</th><th>Student ID</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official /100</th><th>Total /200</th><th>Overall %</th><th>Grade</th></tr></thead><tbody>${rs.map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td>${r.a.toFixed(2)}</td><td>${r.p.toFixed(2)}</td><td>${r.h.toFixed(2)}</td><td>${r.o.toFixed(2)}</td><td>${r.total.toFixed(2)}</td><td>${r.overall.toFixed(2)}%</td><td>${r.grade}</td></tr>`).join('')}</tbody></table>`;sheet.style.display='block'}async function canvas(){allSheet();await new Promise(r=>setTimeout(r,150));const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff'});sheet.style.display='none';return c}pngAll.onclick=async()=>{const c=await canvas(),a=document.createElement('a');a.download='Grade11_Physics_All_Students_Grading.png';a.href=c.toDataURL('image/png');a.click()};pdfAll.onclick=async()=>{const c=await canvas(),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),m=8,w=297-m*2,h=210-m*2,r=Math.min(w/c.width,h/c.height);pdf.addImage(c.toDataURL('image/png'),'PNG',m+(w-c.width*r)/2,m+(h-c.height*r)/2,c.width*r,c.height*r);pdf.save('Grade11_Physics_All_Students_Grading.pdf')};tbody.addEventListener('click',async e=>{const b=e.target.closest('[data-id]');if(!b)return;const r=rows().find(x=>x.id===b.dataset.id);if(!r)return;sheet.innerHTML=`<h2 style="text-align:center">VICTORY LAND FEDERAL SCHOOL</h2><h3 style="text-align:center">STUDENT REPORT CARD</h3><p><b>Student ID:</b> ${r.id}</p><p><b>Name:</b> ${r.name}</p><table><tr><th>Assessment</th><th>Mark</th><th>Maximum</th></tr><tr><td>Attendance</td><td>${r.a.toFixed(2)}</td><td>40</td></tr><tr><td>Participation</td><td>${r.p.toFixed(2)}</td><td>30</td></tr><tr><td>Homework</td><td>${r.h.toFixed(2)}</td><td>30</td></tr><tr><td>Official Test</td><td>${r.o.toFixed(2)}</td><td>100</td></tr><tr><th>Total</th><th>${r.total.toFixed(2)}</th><th>200</th></tr><tr><th>Overall</th><th>${r.overall.toFixed(2)}%</th><th>${r.grade}</th></tr></table>`;sheet.style.display='block';const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff'});sheet.style.display='none';const a=document.createElement('a');a.download=`${r.id}_Report_Card.png`;a.href=c.toDataURL('image/png');a.click()});[['attendance','attendance_records'],['participation','participation_records'],['homework','homework_records'],['official','physics_official_results']].forEach(([k,n])=>onSnapshot(collection(db,n),s=>{sets[k]=s.docs.map(d=>d.data());loaded=Math.min(4,loaded+1);render()}));onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};render()});render();</script></body></html>
