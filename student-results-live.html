<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Card Generator — Grade 11 Physics</title><link rel="stylesheet" href="academic.css"><style>body{background:linear-gradient(135deg,#eef3f8,#fffaf0)}.hero,.panel{animation:rise .5s ease both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}table{width:100%;border-collapse:collapse;min-width:1120px}th,td{padding:10px;border:1px solid #dbe5ec;text-align:center;white-space:nowrap}th{background:#102a43;color:#fff;position:sticky;top:0}.export-bar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.export-btn{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,#142b43,#24577a);color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 7px 18px #142b4322}.export-btn:hover{transform:translateY(-2px)}.mini{padding:7px 9px;font-size:.82rem}.reset{margin:12px 0;padding:10px 13px;border-radius:12px;background:#fff4d6;color:#765b00;font-weight:750}.sheet{position:fixed;left:-20000px;top:0;width:1120px;min-height:790px;padding:30px;background:#fff;color:#142b43;font-family:Arial,'Noto Sans Myanmar',sans-serif;box-sizing:border-box}.sheet .border{min-height:730px;border:4px double #d4af37;padding:24px 28px;box-sizing:border-box}.sheet .logo{display:block;width:68px;height:68px;object-fit:contain;margin:0 auto 7px}.sheet .school{text-align:center;font-size:20px;font-weight:800}.sheet .sub{text-align:center;font-size:13px;color:#718090;margin-top:4px}.sheet h2{text-align:center;font-size:25px;letter-spacing:.04em;margin:14px 0 18px;color:#24577a}.sheet table{width:100%;min-width:0;border-collapse:collapse}.sheet th,.sheet td{padding:10px 8px;border:1px solid #ccd8e1;text-align:center;white-space:nowrap}.sheet th{background:#142b43;color:#fff;position:static}.sheet tbody tr:nth-child(even){background:#f7fafc}.sheet .sign{margin-top:24px;display:flex;justify-content:flex-end}.sheet .signbox{width:190px;text-align:center;border-top:1px solid #7d8992;padding-top:7px}.sheet .sign-name{display:block;font-size:18px;font-weight:800;font-family:cursive;margin-bottom:2px}.sheet .sign-role{display:block;font-size:12px;color:#5d6972}.sheet .foot{margin-top:12px;text-align:center;font-size:10px;color:#7b8790}.portrait-sheet{width:794px;min-height:1123px;padding:24px}.portrait-sheet .border{min-height:1075px;padding:32px 28px}.portrait-sheet .logo{width:82px;height:82px}.portrait-sheet .school{font-size:22px}.portrait-sheet h2{font-size:28px;margin:22px 0}.portrait-sheet table{font-size:12px}.portrait-sheet th,.portrait-sheet td{padding:13px 6px;white-space:normal}.portrait-sheet .sign{margin-top:70px}.portrait-sheet .foot{margin-top:28px}@media(max-width:650px){.export-bar{display:grid;grid-template-columns:1fr}.export-btn{width:100%}}</style></head><body><main class="wrap"><section class="hero"><h1>🧾 Report Card Generator</h1><p>Grade 11 · Subject - Physics · Firebase Live</p><div class="landscape-note">Individual Report Card နှင့် ကျောင်းသားအားလုံး၏ Landscape Summary Report ကို ထုတ်နိုင်ပါသည်။</div></section><section class="panel"><div id="status" class="status">Firebase ချိတ်ဆက်နေသည်…</div><div id="resetState" class="reset" style="display:none"></div><div class="export-bar"><button class="export-btn" id="pngAll">🖼️ All Students — Landscape PNG</button><button class="export-btn" id="pdfAll">📄 All Students — Landscape PDF</button></div><div style="overflow:auto"><table id="table"><thead><tr><th>Rank</th><th>Student ID</th><th>Name</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official /100</th><th>Total /200</th><th>Overall %</th><th>Grade</th><th>Report Card</th></tr></thead><tbody></tbody></table></div></section></main><div id="sheet" class="sheet"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds}from'./firebase-data.js';const app=initializeApp(firebaseConfig),db=getFirestore(app),statusEl=document.getElementById('status'),resetEl=document.getElementById('resetState'),tableEl=document.getElementById('table'),sheetEl=document.getElementById('sheet');const sets={attendance:[],participation:[],homework:[],official:[]};const loaded=new Set;let settings={};function tm(x){const v=x?.timestamp;if(v&&typeof v.toMillis==='function')return v.toMillis();if(v)return new Date(v).getTime()||0;return new Date(x?.date&&x?.time?x.date+'T'+x.time:0).getTime()}function cutoff(k){return Math.max(...[settings.allResetAt,settings.gradingResetAt,settings[k+'ResetAt'],k==='official'?settings.officialResetAt:0].filter(Boolean).map(x=>new Date(x).getTime()),0)}function fresh(k,x){return tm(x)>=cutoff(k)}[['attendance','attendance_records'],['participation','participation_records'],['homework','homework_records'],['official','physics_official_results']].forEach(([k,n])=>onSnapshot(collection(db,n),s=>{sets[k]=s.docs.map(d=>d.data());loaded.add(k);render()},e=>statusEl.textContent='⚠️ Firebase error: '+e.message));onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};render()},e=>statusEl.textContent='⚠️ Firebase error: '+e.message);function grade(p){return p>=90?'A*':p>=80?'A':p>=70?'B*':p>=60?'B':p>=50?'C*':p>=40?'C':'D'}function one(id){const a=Math.min(40,sets.attendance.filter(x=>x.id===id&&x.status==='Present'&&fresh('attendance',x)).length);const ps=sets.participation.filter(x=>x.id===id&&fresh('participation',x)).sort((a,b)=>tm(b)-tm(a));const p=Math.min(30,Number(ps[0]?.mark)||0);const h=Math.min(30,new Set(sets.homework.filter(x=>x.id===id&&x.completed&&fresh('homework',x)).map(x=>x.date)).size);const os=sets.official.filter(x=>x.id===id&&fresh('official',x)).sort((a,b)=>tm(b)-tm(a));const o=Math.min(100,Number(os[0]?.score)||0),total=a+p+h+o,percent=total/2;return[a,p,h,o,total,percent,grade(percent)]}function rowsData(){return studentIds.map(id=>[id,students[id],...one(id)]).sort((a,b)=>b[6]-a[6])}function render(){const rows=rowsData();tableEl.querySelector('tbody').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}/40</td><td>${r[3]}/30</td><td>${r[4]}/30</td><td>${r[5]}/100</td><td>${r[6]}/200</td><td>${r[7].toFixed(2)}%</td><td>${r[8]}</td><td><button class="export-btn mini" data-id="${r[0]}">🖼️ PNG</button></td></tr>`).join('');statusEl.textContent=loaded.size===4?'● Firebase Live — result data sync ဖြစ်နေပါသည်။':`Firebase collections ${loaded.size}/4 ကိုဖတ်နေသည်…`;const c=['attendance','participation','homework','official','grading','all'].filter(k=>settings[k+'ResetAt']);resetEl.style.display=c.length?'block':'none';resetEl.textContent=c.length?'♻️ Active reset points: '+c.join(' · '):''}function buildSheet(rows){sheetEl.className='sheet';sheetEl.innerHTML=`<div class="border"><img class="logo" src="https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ" alt="School Logo"><div class="school">VICTORY LAND FEDERAL SCHOOL</div><div class="sub">Grade 11 · Subject - Physics · Student Academic Management System</div><h2>ALL STUDENTS — ACADEMIC REPORT</h2><table><thead><tr><th>Rank</th><th>Student ID</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official Test /100</th><th>Total /200</th><th>Overall %</th><th>Final Grade</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[2]}/40</td><td>${r[3]}/30</td><td>${r[4]}/30</td><td>${r[5]}/100</td><td><b>${r[6]}/200</b></td><td>${r[7].toFixed(2)}%</td><td><b>${r[8]}</b></td></tr>`).join('')}</tbody></table><div class="sign"><div class="signbox"><span class="sign-name">Sir Lynn</span><span class="sign-role">Class Teacher Sign</span></div></div><div class="foot">Generated from Firebase Live Grading System · ${new Date().toLocaleString()}</div></div>`;sheetEl.style.display='block'}async function landscapeCanvas(){const rows=rowsData();buildSheet(rows);await new Promise(r=>setTimeout(r,200));if(typeof window.html2canvas!=='function')throw new Error('html2canvas မရသေးပါ');const c=await window.html2canvas(sheetEl,{scale:2,backgroundColor:'#fff',useCORS:true,allowTaint:false});sheetEl.style.display='none';return c}async function exportAllPNG(){try{const c=await landscapeCanvas(),a=document.createElement('a');a.download='Grade11_Physics_All_Students_Landscape_Report.png';a.href=c.toDataURL('image/png');a.click()}catch(e){sheetEl.style.display='none';alert('Landscape PNG generate မအောင်မြင်ပါ: '+e.message)}}async function exportAllPDF(){try{const c=await landscapeCanvas(),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,297,210);pdf.save('Grade11_Physics_All_Students_Landscape_Report.pdf')}catch(e){sheetEl.style.display='none';alert('Landscape PDF generate မအောင်မြင်ပါ: '+e.message)}}async function exportOne(r,rank){try{sheetEl.className='sheet portrait-sheet';sheetEl.innerHTML=`<div class="border"><img class="logo" src="https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ" alt="School Logo"><div class="school">VICTORY LAND FEDERAL SCHOOL</div><div class="sub">Grade 11 · Subject - Physics</div><h2>STUDENT REPORT CARD</h2><table><tr><th>Rank</th><th>Student ID</th><th>Student Name</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official /100</th><th>Total /200</th><th>Overall %</th><th>Final Grade</th></tr><tr><td>${rank}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}/40</td><td>${r[3]}/30</td><td>${r[4]}/30</td><td>${r[5]}/100</td><td>${r[6]}/200</td><td>${r[7].toFixed(2)}%</td><td>${r[8]}</td></tr></table><div class="sign"><div class="signbox"><span class="sign-name">Sir Lynn</span><span class="sign-role">Class Teacher Sign</span></div></div><div class="foot">Generated from Firebase Live Grading System · ${new Date().toLocaleString()}</div></div>`;sheetEl.style.display='block';await new Promise(x=>setTimeout(x,180));const c=await window.html2canvas(sheetEl,{scale:2,backgroundColor:'#fff',useCORS:true});sheetEl.style.display='none';const a=document.createElement('a');a.download=`${r[0].replaceAll(' ','_')}_report_card.png`;a.href=c.toDataURL('image/png');a.click()}catch(e){sheetEl.style.display='none';alert('Report Card generate မအောင်မြင်ပါ: '+e.message)}}document.getElementById('pngAll').onclick=exportAllPNG;document.getElementById('pdfAll').onclick=exportAllPDF;tableEl.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const rows=rowsData(),i=rows.findIndex(r=>r[0]===b.dataset.id);if(i>=0)exportOne(rows[i],i+1)});</script></body></html>
