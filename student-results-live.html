<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 11 Physics — Student Grading Results</title><link rel="stylesheet" href="academic.css"><style>table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:9px;border:1px solid #dbe5ec;text-align:center;white-space:nowrap}th{background:#102a43;color:#fff;position:sticky;top:0}.export-bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.export-btn{border:0;border-radius:12px;padding:10px 14px;background:#142b43;color:#fff;font-weight:700;cursor:pointer}.sheet{position:fixed;left:-20000px;top:0;width:1120px;padding:0;background:#fff;color:#142b43;font-family:Arial,'Noto Sans Myanmar',sans-serif}.sheet.export-landscape{width:1120px}.sheet.export-portrait{width:794px}.report-page{position:relative;box-sizing:border-box;background:#fff;overflow:hidden;border:5px solid #173b59;border-radius:24px;padding:30px}.export-landscape .report-page{min-height:790px;padding:34px}.export-portrait .report-page{min-height:1123px;padding:34px}.report-page:before{content:"";position:absolute;inset:12px;border:2px solid #d4af37;border-radius:16px;pointer-events:none}.report-page:after{content:"";position:absolute;inset:28%;background:url('https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ') center/contain no-repeat;opacity:.055;filter:grayscale(1);pointer-events:none}.report-content{position:relative;z-index:2}.report-header{text-align:center;padding-bottom:16px;margin-bottom:18px;border-bottom:3px solid #d4af37}.report-logo{width:78px;height:78px;object-fit:contain;display:block;margin:0 auto 8px}.report-school{font-size:26px;font-weight:900;letter-spacing:.3px}.report-sub{font-size:14px;color:#607487;margin-top:4px}.report-title{font-size:22px;color:#24577a;font-weight:900;margin-top:9px}.report-meta{font-size:11px;color:#718090;margin-top:5px}.report-page table{width:100%;min-width:0;border-collapse:separate;border-spacing:0;font-size:13px;border:2px solid #173b59;border-radius:12px;overflow:hidden}.report-page th{position:static;background:#173b59;color:#fff;padding:10px 6px;border:0;border-right:1px solid #fff}.report-page th:last-child{border-right:0}.report-page td{padding:10px 6px;border:0;border-right:1px solid #c9d5df;border-bottom:1px solid #c9d5df;white-space:nowrap}.report-page td:last-child{border-right:0}.report-page tbody tr:last-child td{border-bottom:0}.report-page tbody tr:nth-child(even){background:#f5f8fb}.report-page .total-cell{font-weight:900;background:#eaf2f7}.report-page .grade-cell{font-weight:900;background:#fff3cf}.report-summary{margin-top:16px;padding:11px 13px;border:2px solid #d4af37;border-radius:12px;background:#fffaf0;text-align:center;font-size:11px}.report-footer{position:relative;z-index:2;margin-top:28px;display:flex;justify-content:flex-end}.teacher-sign{text-align:center;width:190px;padding-top:42px;border-top:1.5px solid #173b59;font-family:'Brush Script MT','Segoe Script',cursive;font-size:25px;color:#173b59}.teacher-label{display:block;margin-top:5px;font-family:Arial,'Noto Sans Myanmar',sans-serif;font-size:11px;font-weight:800;color:#455d70;letter-spacing:.4px}.student-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}.student-info div{padding:9px 11px;border:1.5px solid #c9d5df;border-radius:10px;background:#f7fafc}.student-info b{color:#173b59}.export-portrait .report-title{font-size:24px}.export-portrait .report-page table{font-size:14px}.export-portrait .report-page th,.export-portrait .report-page td{padding:12px 8px}.export-portrait .report-footer{margin-top:42px}.export-portrait .teacher-sign{width:210px}.export-portrait .report-page:after{inset:24% 16% 28%}.export-portrait .report-summary{font-size:12px;margin-top:20px}@media(max-width:700px){.export-bar{display:grid}.export-btn{width:100%}}</style></head><body><main class="wrap"><section class="hero"><h1>📊 Student Grading Results</h1><p>Grade 11 · Physics</p></section><section class="panel"><div id="status">Results loading…</div><div class="export-bar"><button class="export-btn" id="pngAll">🖼️ All Students — Landscape PNG</button><button class="export-btn" id="pdfAll">📄 All Students — Landscape PDF</button></div><div style="overflow:auto"><table id="table"><thead><tr><th>Rank</th><th>Student ID</th><th>Name</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official /100</th><th>Total /200</th><th>Overall %</th><th>Grade</th><th>Report Card</th></tr></thead><tbody></tbody></table></div></section></main><div id="sheet" class="sheet"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds,myanmarDateTime}from'./firebase-data.js';import{schoolDates,historicalAttendance,historicalHomework}from'./attendance-homework-policy.js';import{forcedAbsent}from'./attendance-authority.js';const db=getFirestore(initializeApp(firebaseConfig)),tbody=document.querySelector('#table tbody'),status=document.getElementById('status'),sheet=document.getElementById('sheet');const sets={attendance:[],participation:[],homework:[],official:[]};let settings={},loaded=new Set;function today(){return myanmarDateTime().date}function id(v){return String(v??'').trim().toUpperCase()}function same(a,b){return id(a)===id(b)}function time(v){if(v&&typeof v.toMillis==='function')return v.toMillis();if(v instanceof Date)return v.getTime();if(typeof v==='number')return v;const n=new Date(v).getTime();return Number.isFinite(n)?n:0}function tm(x){return time(x?.timestamp)||time(x?.updatedAt)||time((x?.date||'')+'T'+(x?.time||'00:00:00'))}function cutoff(k){return Math.max(...[settings.allResetAt,settings.gradingResetAt,settings[k+'ResetAt'],k==='official'?settings.officialResetAt:0].filter(Boolean).map(time),0)}function fresh(k,x){const c=cutoff(k);return !c||tm(x)>=c}function merge(base,live,student,k){const map={};base.filter(x=>x.date<=today()).forEach(x=>map[x.date]=x);live.filter(x=>same(x.id,student)&&x.date<=today()&&fresh(k,x)&&!(k==='attendance'&&forcedAbsent(student,x.date))).forEach(x=>map[x.date]={...map[x.date],...x});return Object.values(map)}function hw(x){return x?.completed===true||['completed','complete','done','submitted'].includes(String(x?.status??'').trim().toLowerCase())}function pct(v,t){return t?Math.max(0,Math.min(100,v/t*100)):0}function grade(v){return v>=90?'A*':v>=80?'A':v>=70?'B*':v>=60?'B':v>=50?'C*':v>=40?'C':'D'}function calc(student){const days=schoolDates().length,aRows=merge(historicalAttendance(student),sets.attendance,student,'attendance'),present=aRows.filter(x=>String(x.status??'').trim().toLowerCase()==='present').length,a=pct(present,days)*.4,hRows=merge(historicalHomework(student),sets.homework,student,'homework'),completed=new Set(hRows.filter(hw).map(x=>x.date)).size,h=pct(completed,days)*.3,ps=sets.participation.filter(x=>same(x.id,student)&&fresh('participation',x)).sort((a,b)=>tm(b)-tm(a)),os=sets.official.filter(x=>same(x.id,student)&&fresh('official',x)).sort((a,b)=>tm(b)-tm(a)),p=Math.max(0,Math.min(30,Number(ps[0]?.mark)||0)),o=Math.max(0,Math.min(100,Number(os[0]?.score)||0)),total=a+p+h+o,overall=total/2;return{id:student,name:students[student],a,p,h,o,total,overall,grade:grade(overall),attendancePct:pct(present,days),homeworkPct:pct(completed,days),present,completed,days}}function rows(){return studentIds.map(calc).sort((a,b)=>b.overall-a.overall||a.id.localeCompare(b.id))}function render(){if(loaded.size<4){status.textContent='Results loading…';return}tbody.innerHTML=rows().map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td>${r.name}</td><td>${r.a.toFixed(2)}/40<br><small>${r.attendancePct.toFixed(2)}%</small></td><td>${r.p.toFixed(2)}/30</td><td>${r.h.toFixed(2)}/30<br><small>${r.homeworkPct.toFixed(2)}%</small></td><td>${r.o.toFixed(2)}/100</td><td><b>${r.total.toFixed(2)}/200</b></td><td>${r.overall.toFixed(2)}%</td><td><b>${r.grade}</b></td><td><button class="export-btn" data-id="${r.id}">🖼️ PNG</button></td></tr>`).join('');status.textContent='Live'}function logo(){return `<img class="report-logo" src="https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ" crossorigin="anonymous" alt="School Logo">`}function sign(){return `<div class="report-footer"><div class="teacher-sign">Sir Lynn<span class="teacher-label">School Teacher Sign</span></div></div>`}function allSheet(){const rs=rows();sheet.className='sheet export-landscape';sheet.innerHTML=`<div class="report-page"><div class="report-content"><div class="report-header">${logo()}<div class="report-school">VICTORY LAND FEDERAL SCHOOL</div><div class="report-sub">Grade 11 · Student Academic Management System</div><div class="report-title">PHYSICS — ALL STUDENTS GRADING REPORT</div><div class="report-meta">Generated: ${new Date().toLocaleString()}</div></div><table><thead><tr><th>Rank</th><th>Student ID</th><th>Student Name</th><th>Attendance<br>/40</th><th>Participation<br>/30</th><th>Homework<br>/30</th><th>Official Test<br>/100</th><th>Total<br>/200</th><th>Overall<br>%</th><th>Final<br>Grade</th></tr></thead><tbody>${rs.map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td style="text-align:left;font-weight:700">${r.name}</td><td>${r.a.toFixed(2)}</td><td>${r.p.toFixed(2)}</td><td>${r.h.toFixed(2)}</td><td>${r.o.toFixed(2)}</td><td class="total-cell">${r.total.toFixed(2)}</td><td class="total-cell">${r.overall.toFixed(2)}%</td><td class="grade-cell">${r.grade}</td></tr>`).join('')}</tbody></table><div class="report-summary"><b>Grading Scale:</b> A* ≥ 90% · A ≥ 80% · B* ≥ 70% · B ≥ 60% · C* ≥ 50% · C ≥ 40% · D &lt; 40% &nbsp; | &nbsp; <b>Total Students: ${rs.length}</b></div>${sign()}</div></div>`;sheet.style.display='block'}async function canvas(){allSheet();await new Promise(r=>setTimeout(r,250));const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff',useCORS:true,allowTaint:false});sheet.style.display='none';return c}pngAll.onclick=async()=>{const c=await canvas(),a=document.createElement('a');a.download='Grade11_Physics_All_Students_Grading.png';a.href=c.toDataURL('image/png');a.click()};pdfAll.onclick=async()=>{const c=await canvas(),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),m=7,w=297-m*2,h=210-m*2,r=Math.min(w/c.width,h/c.height);pdf.addImage(c.toDataURL('image/png'),'PNG',m+(w-c.width*r)/2,m+(h-c.height*r)/2,c.width*r,c.height*r);pdf.save('Grade11_Physics_All_Students_Grading.pdf')};tbody.addEventListener('click',async e=>{const b=e.target.closest('[data-id]');if(!b)return;const r=rows().find(x=>x.id===b.dataset.id);if(!r)return;sheet.className='sheet export-portrait';sheet.innerHTML=`<div class="report-page"><div class="report-content"><div class="report-header">${logo()}<div class="report-school">VICTORY LAND FEDERAL SCHOOL</div><div class="report-sub">Grade 11 · Student Academic Management System</div><div class="report-title">STUDENT REPORT CARD</div><div class="report-meta">Physics · Generated: ${new Date().toLocaleString()}</div></div><div class="student-info"><div><b>Student ID</b><br>${r.id}</div><div><b>Student Name</b><br>${r.name}</div></div><table><thead><tr><th>Assessment</th><th>Mark</th><th>Maximum</th><th>Percentage</th></tr></thead><tbody><tr><td>Attendance</td><td>${r.a.toFixed(2)}</td><td>40</td><td>${r.attendancePct.toFixed(2)}%</td></tr><tr><td>Participation</td><td>${r.p.toFixed(2)}</td><td>30</td><td>${pct(r.p,30).toFixed(2)}%</td></tr><tr><td>Homework</td><td>${r.h.toFixed(2)}</td><td>30</td><td>${r.homeworkPct.toFixed(2)}%</td></tr><tr><td>Official Test</td><td>${r.o.toFixed(2)}</td><td>100</td><td>${r.o.toFixed(2)}%</td></tr><tr><th>Total</th><th>${r.total.toFixed(2)}</th><th>200</th><th>${r.overall.toFixed(2)}%</th></tr><tr><th>Final Grade</th><th colspan="2" class="grade-cell">${r.grade}</th><th class="total-cell">${r.overall.toFixed(2)}%</th></tr></tbody></table><div class="report-summary"><b>Grading Scale:</b> A* ≥ 90% · A ≥ 80% · B* ≥ 70% · B ≥ 60% · C* ≥ 50% · C ≥ 40% · D &lt; 40%</div>${sign()}</div></div>`;sheet.style.display='block';await new Promise(resolve=>setTimeout(resolve,250));const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff',useCORS:true,allowTaint:false});sheet.style.display='none';const a=document.createElement('a');a.download=`${r.id}_Report_Card.png`;a.href=c.toDataURL('image/png');a.click()});[['attendance','attendance_records'],['participation','participation_records'],['homework','homework_records'],['official','physics_official_results']].forEach(([k,n])=>onSnapshot(collection(db,n),s=>{sets[k]=s.docs.map(d=>d.data());loaded.add(k);render()},e=>{console.error(n,e);render()}));onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};render()},e=>console.error(e));</script></body></html>
