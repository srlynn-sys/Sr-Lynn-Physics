<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grading System Live</title><link rel="stylesheet" href="academic.css"><style>body{background:linear-gradient(135deg,#eef3f8,#fffaf0)}.hero,.panel{animation:rise .5s ease both}.panel{overflow:hidden}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:10px;border:1px solid #dbe5ec;text-align:center;white-space:nowrap}th{background:#102a43;color:#fff;position:sticky;top:0}tbody tr{transition:.2s;background:#fff}tbody tr:hover{transform:scale(1.002);background:#f7fbff}.reset{margin:12px 0;padding:10px 13px;border-radius:12px;background:#fff4d6;color:#765b00;font-weight:750}</style></head><body><main class="wrap"><section class="hero"><h1>📊 Grading System</h1><p>Firebase Live Result · Realtime Reset Aware</p></section><section class="panel"><div id="status">Loading Firebase…</div><div id="resetState" class="reset" style="display:none"></div><div style="overflow:auto"><table id="table"><thead><tr><th>Rank</th><th>Student ID</th><th>Name</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official /100</th><th>Total /200</th><th>Overall %</th><th>Grade</th></tr></thead><tbody></tbody></table></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig)),sets={attendance:[],participation:[],homework:[],official:[]};let ready=0,settings={};function tm(x){const v=x?.timestamp;if(!v)return new Date(x?.date&&x?.time?x.date+'T'+x.time:0).getTime();if(typeof v==='object'&&typeof v.toMillis==='function')return v.toMillis();return new Date(v).getTime()||0}function cutoff(kind){const all=settings.allResetAt?new Date(settings.allResetAt).getTime():0;const grade=settings.gradingResetAt?new Date(settings.gradingResetAt).getTime():0;const specific=settings[kind+'ResetAt']?new Date(settings[kind+'ResetAt']).getTime():0;const off=settings.officialResetAt?new Date(settings.officialResetAt).getTime():0;return Math.max(all,grade,specific,kind==='official'?off:0)}function fresh(kind,x){return tm(x)>=cutoff(kind)}[['attendance','attendance_records'],['participation','participation_records'],['homework','homework_records'],['official','physics_official_results']].forEach(([k,n])=>onSnapshot(collection(db,n),s=>{sets[k]=s.docs.map(d=>d.data());ready++;render()},e=>status.textContent='Firebase error: '+e.message));onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};render()});function grade(p){return p>=90?'A*':p>=80?'A':p>=70?'B*':p>=60?'B':p>=50?'C*':p>=40?'C':'D'}function one(id){let a=Math.min(40,sets.attendance.filter(x=>x.id===id&&x.status==='Present'&&fresh('attendance',x)).length);let p=sets.participation.filter(x=>x.id===id&&fresh('participation',x)).sort((x,y)=>tm(y)-tm(x));p=Math.min(30,Number(p[0]?.mark)||0);let h=Math.min(30,new Set(sets.homework.filter(x=>x.id===id&&x.completed&&fresh('homework',x)).map(x=>x.date)).size);let o=sets.official.filter(x=>x.id===id&&fresh('official',x)).sort((x,y)=>tm(y)-tm(x));o=Math.min(100,Number(o[0]?.score)||0);let total=a+p+h+o;return[a,p,h,o,total,total/2,grade(total/2)]}function render(){const rows=studentIds.map(id=>[id,students[id],...one(id)]).sort((a,b)=>b[6]-a[6]);table.querySelector('tbody').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}/40</td><td>${r[3]}/30</td><td>${r[4]}/30</td><td>${r[5]}/100</td><td>${r[6]}/200</td><td>${Number(r[7]).toFixed(2)}%</td><td>${r[8]}</td></tr>`).join('');status.textContent=ready>=4?'● Firebase Live — device အားလုံး sync ဖြစ်နေပါသည်။':'Firebase collections '+ready+'/4 ကိုဖတ်နေသည်…';const cuts=[];for(const k of['attendance','homework','participation','official','grading','all'])if(settings[k+'ResetAt'])cuts.push(k);resetState.style.display=cuts.length?'block':'none';resetState.textContent=cuts.length?'♻️ Active reset points: '+cuts.join(' · '):''}</script></body></html>
