<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grading System Live</title><link rel="stylesheet" href="academic.css"><style>body{background:linear-gradient(135deg,#eef3f8,#fffaf0)}.hero,.panel{animation:rise .5s ease both}.panel{overflow:hidden}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}table{width:100%;border-collapse:collapse;min-width:1120px}th,td{padding:10px;border:1px solid #dbe5ec;text-align:center;white-space:nowrap}th{background:#102a43;color:#fff;position:sticky;top:0}tbody tr{transition:.2s;background:#fff}tbody tr:hover{transform:scale(1.002);background:#f7fbff}.reset{margin:12px 0;padding:10px 13px;border-radius:12px;background:#fff4d6;color:#765b00;font-weight:750}.export-bar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.export-btn{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,#142b43,#24577a);color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 7px 18px #142b4322}.export-btn:hover{transform:translateY(-2px)}.mini{padding:7px 9px;border-radius:9px;font-size:.82rem;background:#24577a}.result-sheet{position:fixed;left:-10000px;top:0;width:900px;padding:42px;background:#fff;color:#142b43;font-family:Arial,'Noto Sans Myanmar',sans-serif}.result-sheet .school{font-size:14px;color:#718090;margin-bottom:6px}.result-sheet h2{font-size:28px;margin:0 0 22px}.result-sheet .student{border:2px solid #d4af37;border-radius:16px;padding:18px;margin-bottom:18px}.result-sheet .student b{font-size:22px}.result-sheet table{min-width:0;width:100%;border-collapse:collapse}.result-sheet td{padding:10px;border:1px solid #dbe5ec;text-align:left}.result-sheet .total{font-size:20px;font-weight:800;margin-top:18px}.result-sheet .foot{margin-top:22px;font-size:12px;color:#718090}@media(max-width:650px){.export-bar{display:grid;grid-template-columns:1fr}.export-btn{width:100%}}</style></head><body><main class="wrap"><section class="hero"><h1>📊 Grading System</h1><p>Firebase Live Result · Realtime Reset Aware</p></section><section class="panel"><div id="status">Loading Firebase…</div><div id="resetState" class="reset" style="display:none"></div><div class="export-bar"><button class="export-btn" id="pngAll">🖼️ Result Table PNG</button><button class="export-btn" id="pdfAll">📄 Result Table PDF</button></div><div style="overflow:auto"><table id="table"><thead><tr><th>Rank</th><th>Student ID</th><th>Name</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official /100</th><th>Total /200</th><th>Overall %</th><th>Grade</th><th>Export</th></tr></thead><tbody></tbody></table></div></section></main><div id="sheet" class="result-sheet"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig)),sets={attendance:[],participation:[],homework:[],official:[]};let ready=0,settings={};function tm(x){const v=x?.timestamp;if(!v)return new Date(x?.date&&x?.time?x.date+'T'+x.time:0).getTime();if(typeof v==='object'&&typeof v.toMillis==='function')return v.toMillis();return new Date(v).getTime()||0}function cutoff(kind){const all=settings.allResetAt?new Date(settings.allResetAt).getTime():0;const grade=settings.gradingResetAt?new Date(settings.gradingResetAt).getTime():0;const specific=settings[kind+'ResetAt']?new Date(settings[kind+'ResetAt']).getTime():0;const off=settings.officialResetAt?new Date(settings.officialResetAt).getTime():0;return Math.max(all,grade,specific,kind==='official'?off:0)}function fresh(kind,x){return tm(x)>=cutoff(kind)}[['attendance','attendance_records'],['participation','participation_records'],['homework','homework_records'],['official','physics_official_results']].forEach(([k,n])=>onSnapshot(collection(db,n),s=>{sets[k]=s.docs.map(d=>d.data());ready++;render()},e=>status.textContent='Firebase error: '+e.message));onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};render()});function grade(p){return p>=90?'A*':p>=80?'A':p>=70?'B*':p>=60?'B':p>=50?'C*':p>=40?'C':'D'}function one(id){let a=Math.min(40,sets.attendance.filter(x=>x.id===id&&x.status==='Present'&&fresh('attendance',x)).length);let p=sets.participation.filter(x=>x.id===id&&fresh('participation',x)).sort((x,y)=>tm(y)-tm(x));p=Math.min(30,Number(p[0]?.mark)||0);let h=Math.min(30,new Set(sets.homework.filter(x=>x.id===id&&x.completed&&fresh('homework',x)).map(x=>x.date)).size);let o=sets.official.filter(x=>x.id===id&&fresh('official',x)).sort((x,y)=>tm(y)-tm(x));o=Math.min(100,Number(o[0]?.score)||0);let total=a+p+h+o;return[a,p,h,o,total,total/2,grade(total/2)]}function rowsData(){return studentIds.map(id=>[id,students[id],...one(id)]).sort((a,b)=>b[6]-a[6])}function render(){const rows=rowsData();table.querySelector('tbody').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}/40</td><td>${r[3]}/30</td><td>${r[4]}/30</td><td>${r[5]}/100</td><td>${r[6]}/200</td><td>${Number(r[7]).toFixed(2)}%</td><td>${r[8]}</td><td><button class="export-btn mini" data-png="${r[0]}">🖼️</button> <button class="export-btn mini" data-pdf="${r[0]}">📄</button></td></tr>`).join('');status.textContent=ready>=4?'● Firebase Live — device အားလုံး sync ဖြစ်နေပါသည်။':'Firebase collections '+ready+'/4 ကိုဖတ်နေသည်…';const cuts=[];for(const k of['attendance','homework','participation','official','grading','all'])if(settings[k+'ResetAt'])cuts.push(k);resetState.style.display=cuts.length?'block':'none';resetState.textContent=cuts.length?'♻️ Active reset points: '+cuts.join(' · '):''}function makeSheet(r,rank){sheet.innerHTML=`<div class="school">VICTORY LAND FEDERAL SCHOOL · Grade 11 Physics</div><h2>Student Grading Result</h2><div class="student"><div><b>${r[1]}</b></div><div>${r[0]} · Rank #${rank}</div></div><table><tr><td>Attendance</td><td>${r[2]} / 40</td></tr><tr><td>Participation</td><td>${r[3]} / 30</td></tr><tr><td>Homework</td><td>${r[4]} / 30</td></tr><tr><td>Official Test</td><td>${r[5]} / 100</td></tr><tr><td><b>Total</b></td><td><b>${r[6]} / 200</b></td></tr><tr><td><b>Overall</b></td><td><b>${Number(r[7]).toFixed(2)}%</b></td></tr><tr><td><b>Grade</b></td><td><b>${r[8]}</b></td></tr></table><div class="foot">Generated from Firebase Live Grading System · ${new Date().toLocaleString()}</div>`;sheet.style.display='block'}async function capture(r,rank){makeSheet(r,rank);await new Promise(x=>setTimeout(x,120));const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff',useCORS:true});sheet.style.display='none';return c}async function savePNG(r,rank){try{const c=await capture(r,rank);const a=document.createElement('a');a.download=`${r[0].replaceAll(' ','_')}_grading_result.png`;a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG generate မအောင်မြင်ပါ: '+e.message)}}async function savePDF(r,rank){try{const c=await capture(r,rank),{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'}),w=190,h=c.height*w/c.width;pdf.addImage(c.toDataURL('image/png'),'PNG',10,10,w,Math.min(h,277));pdf.save(`${r[0].replaceAll(' ','_')}_grading_result.pdf`)}catch(e){alert('PDF generate မအောင်မြင်ပါ: '+e.message)}}async function exportTablePDF(){try{const area=table.parentElement;const c=await html2canvas(area,{scale:2,backgroundColor:'#fff',useCORS:true});const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),w=277,h=c.height*w/c.width;pdf.addImage(c.toDataURL('image/png'),'PNG',10,10,w,Math.min(h,190));pdf.save('Grade11_Physics_Grading_Results.pdf')}catch(e){alert('Table PDF generate မအောင်မြင်ပါ: '+e.message)}}async function exportTablePNG(){try{const c=await html2canvas(table.parentElement,{scale:2,backgroundColor:'#fff',useCORS:true});const a=document.createElement('a');a.download='Grade11_Physics_Grading_Results.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('Table PNG generate မအောင်မြင်ပါ: '+e.message)}}document.getElementById('pdfAll').onclick=exportTablePDF;document.getElementById('pngAll').onclick=exportTablePNG;table.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.png||b.dataset.pdf;if(!id)return;const rows=rowsData(),idx=rows.findIndex(r=>r[0]===id);if(idx<0)return;b.dataset.png?savePNG(rows[idx],idx+1):savePDF(rows[idx],idx+1)});</script></body></html>
