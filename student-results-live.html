r('#status'),sheet=document.querySelector('#sheet');const sets={attendance:[],participation:[],homework:[],official:[]};let settings={},loaded=new Set();const today=()=>myanmarDateTime().date,id=v=>String(v??'').trim().toUpperCase(),same=(a,b)=>id(a)===id(b),vt=v=>v&&typeof v.toMillis==='function'?v.toMillis():v instanceof Date?v.getTime():typeof v==='number'?v:new Date(v).getTime()||0,tm=x=>vt(x?.timestamp)||vt(x?.updatedAt)||vt(x?.date&&x?.time?x.date+'T'+x.time:x?.date?x.date+'T00:00:00':0),cut=k=>Math.max(...[settings.allResetAt,settings.gradingResetAt,settings[k+'ResetAt'],k==='official'?settings.officialResetAt:0].filter(Boolean).map(vt).filter(Boolean),0),fresh=(k,x)=>{const c=cut(k);return!c||tm(x)>=c},hw=x=>x?.completed===true||['completed','complete','done','submitted'].includes(String(x?.status??'').trim().toLowerCase()),pct=(v,t)=>t?Math.max(0,Math.min(100,v/t*100)):0,grade=v=>v>=90?'A*':v>=80?'A':v>=70?'B*':v>=60?'B':v>=50?'C*':v>=40?'C':'D';function merged(base,live,s,k){const c=cut(k),m={};base.filter(x=>x.date<=today()&&(!c||tm(x)>=c)).forEach(x=>m[x.date]=x);live.filter(x=>same(x.id,s)&&x.date<=today()&&fresh(k,x)).forEach(x=>m[x.date]={...m[x.date],...x});return Object.values(m)}function calc(s){const ar=merged(historicalAttendance(s),sets.attendance,s,'attendance'),hr=merged(historicalHomework(s),sets.homework,s,'homework');const now=myanmarDateTime(),hour=Number(now.hour)||0,minute=Number(now.minute)||0,cutoffPassed=hour>15||(hour===15&&minute>=0),todayDate=now.date,day=new Date(Date.UTC(Number(todayDate.slice(0,4)),Number(todayDate.slice(5,7))-1,Number(todayDate.slice(8,10)))).getUTCDay();if(cutoffPassed&&day>=1&&day<=5&&!ar.some(x=>x.date===todayDate))ar.push({id:s,date:todayDate,status:'Absent',autoAbsent:true});const ad=ar.length,hd=hr.length,present=ar.filter(x=>String(x.status??'').trim().toLowerCase()==='present').length,completed=new Set(hr.filter(hw).map(x=>x.date)).size,a=pct(present,ad)*.4,h=pct(completed,hd)*.3,ps=sets.participation.f
