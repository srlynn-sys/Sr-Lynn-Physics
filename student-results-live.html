<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 11 Physics — Student Grading Results</title>
<link rel="stylesheet" href="academic.css">
<style>
body{background:linear-gradient(135deg,#eef3f8,#fffaf0)}
.hero,.panel{animation:rise .5s ease both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
table{width:100%;border-collapse:collapse;min-width:1120px}th,td{padding:10px;border:1px solid #dbe5ec;text-align:center;white-space:nowrap}th{background:#102a43;color:#fff;position:sticky;top:0}.export-bar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.export-btn{border:0;border-radius:12px;padding:10px 14px;background:linear-gradient(135deg,#142b43,#24577a);color:#fff;font:inherit;font-weight:700;cursor:pointer}.mini{padding:7px 9px;font-size:.82rem}.live{font-weight:800}.sheet{position:fixed;left:-20000px;top:0;width:1120px;padding:30px;background:#fff;color:#142b43;font-family:Arial,'Noto Sans Myanmar',sans-serif}.sheet .border{border:4px double #d4af37;padding:25px}.sheet .logo{display:block;width:70px;height:70px;object-fit:contain;margin:0 auto 8px}.sheet .school{text-align:center;font-size:22px;font-weight:800}.sheet .sub{text-align:center;color:#718090;margin:4px 0}.sheet h2{text-align:center;color:#24577a}.sheet table{min-width:0}.sheet th{position:static}.sheet .sign{margin-top:28px;text-align:right}.sheet .foot{margin-top:14px;text-align:center;font-size:10px;color:#718090}.portrait{width:794px;min-height:1123px}.portrait .border{min-height:1060px}.portrait .info{display:grid;grid-template-columns:1fr 1fr;border:1px solid #ccd8e1}.portrait .info div{padding:12px;border-bottom:1px solid #ccd8e1}.portrait .label{font-weight:800;background:#eef4f8}.portrait .marks td{text-align:left}.portrait .marks td:nth-child(2),.portrait .marks td:nth-child(3){text-align:center;font-weight:800}.portrait .total{font-weight:900;background:#eef4f8}.portrait .grade{font-size:17px;font-weight:900;background:#fff7df}@media(max-width:650px){.export-bar{display:grid;grid-template-columns:1fr}.export-btn{width:100%}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><h1>📊 Student Grading Results</h1><p>Grade 11 · Physics</p></section>
<section class="panel">
<div id="status" class="live">Results loading…</div>
<div class="export-bar"><button class="export-btn" id="pngAll">🖼️ All Students — Landscape PNG</button><button class="export-btn" id="pdfAll">📄 All Students — Landscape PDF</button></div>
<div style="overflow:auto"><table id="table"><thead><tr><th>Rank</th><th>Student ID</th><th>Name</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official /100</th><th>Total /200</th><th>Overall %</th><th>Grade</th><th>Report Card</th></tr></thead><tbody></tbody></table></div>
</section></main>
<div id="sheet" class="sheet"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';
import{firebaseConfig,students,studentIds,myanmarDateTime}from'./firebase-data.js';
import{schoolDates,historicalAttendance,historicalHomework}from'./attendance-homework-policy.js';
const db=getFirestore(initializeApp(firebaseConfig));
const statusEl=document.getElementById('status'),tbody=document.querySelector('#table tbody'),sheet=document.getElementById('sheet');
const sets={attendance:[],participation:[],homework:[],official:[]};let settings={};const loaded=new Set();
const LOGO='https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ';
function today(){return myanmarDateTime().date}
function normId(v){return String(v??'').trim().toUpperCase()}
function sameId(a,b){return normId(a)===normId(b)}
function tm(x){const v=x?.timestamp;if(v&&typeof v.toMillis==='function')return v.toMillis();if(v)return new Date(v).getTime()||0;return new Date(x?.date&&x?.time?x.date+'T'+x.time:0).getTime()}
function cutoff(k){return Math.max(...[settings.allResetAt,settings.gradingResetAt,settings[k+'ResetAt'],k==='official'?settings.officialResetAt:0].filter(Boolean).map(x=>new Date(x).getTime()),0)}
function fresh(k,x){return tm(x)>=cutoff(k)}
function mergeByDate(base,live,id,k){const map={};base.filter(x=>x.date<=today()).forEach(x=>map[x.date]=x);live.filter(x=>sameId(x.id,id)&&x.date<=today()&&fresh(k,x)).forEach(x=>map[x.date]={...map[x.date],...x});return Object.values(map)}
function mergedAttendance(id){return mergeByDate(historicalAttendance(id),sets.attendance,id,'attendance')}
function mergedHomework(id){return mergeByDate(historicalHomework(id),sets.homework,id,'homework')}
function homeworkCompleted(x){if(!x)return false;if(x.completed===true)return true;const s=String(x.status??'').trim().toLowerCase();return ['completed','complete','done','submitted'].includes(s)}
function pct(value,total){return total?Math.max(0,Math.min(100,value/total*100)):0}
function grade(p){return p>=90?'A*':p>=80?'A':p>=70?'B*':p>=60?'B':p>=50?'C*':p>=40?'C':'D'}
function one(id){
 const days=schoolDates().length;
 const attendance=mergedAttendance(id);const present=attendance.filter(x=>String(x.status??'').trim().toLowerCase()==='present').length;const attendancePct=pct(present,days);const a=attendancePct*40/100;
 const homework=mergedHomework(id);const completed=new Set(homework.filter(homeworkCompleted).map(x=>x.date)).size;const homeworkPct=pct(completed,days);const h=homeworkPct*30/100;
 const ps=sets.participation.filter(x=>sameId(x.id,id)&&fresh('participation',x)).sort((x,y)=>tm(y)-tm(x));const p=Math.max(0,Math.min(30,Number(ps[0]?.mark)||0));
 const os=sets.official.filter(x=>sameId(x.id,id)&&fresh('official',x)).sort((x,y)=>tm(y)-tm(x));const o=Math.max(0,Math.min(100,Number(os[0]?.score)||0));
 const total=a+p+h+o,overall=total/2;return{a,p,h,o,total,overall,grade:grade(overall),attendancePct,homeworkPct,present,completed,days};
}
function rows(){return studentIds.map(id=>({id,name:students[id],...one(id)})).sort((x,y)=>y.overall-x.overall||x.id.localeCompare(y.id))}
function render(){const rs=rows();tbody.innerHTML=rs.map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td>${r.name}</td><td>${r.a.toFixed(2)}/40<br><small>${r.attendancePct.toFixed(2)}%</small></td><td>${r.p.toFixed(2)}/30</td><td>${r.h.toFixed(2)}/30<br><small>${r.homeworkPct.toFixed(2)}%</small></td><td>${r.o.toFixed(2)}/100</td><td><b>${r.total.toFixed(2)}/200</b></td><td>${r.overall.toFixed(2)}%</td><td><b>${r.grade}</b></td><td><button class="export-btn mini" data-id="${r.id}">🖼️ PNG</button></td></tr>`).join('');statusEl.textContent=loaded.size===4?'● Live':'Results loading…'}
function buildAll(){const rs=rows();sheet.className='sheet';sheet.innerHTML=`<div class="border"><img class="logo" src="${LOGO}" crossorigin="anonymous"><div class="school">VICTORY LAND FEDERAL SCHOOL</div><div class="sub">Grade 11 · Subject - Physics</div><h2>ALL STUDENTS — ACADEMIC REPORT</h2><table><thead><tr><th>Rank</th><th>Student ID</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official Test /100</th><th>Total /200</th><th>Overall %</th><th>Grade</th></tr></thead><tbody>${rs.map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td>${r.a.toFixed(2)}/40</td><td>${r.p.toFixed(2)}/30</td><td>${r.h.toFixed(2)}/30</td><td>${r.o.toFixed(2)}/100</td><td><b>${r.total.toFixed(2)}/200</b></td><td>${r.overall.toFixed(2)}%</td><td><b>${r.grade}</b></td></tr>`).join('')}</tbody></table><div class="sign">Sir Lynn</div><div class="foot">Generated: ${new Date().toLocaleString()}</div></div>`;sheet.style.display='block'}
async function canvas(){buildAll();await new Promise(r=>setTimeout(r,250));const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff',useCORS:true,allowTaint:false});sheet.style.display='none';return c}
pngAll.onclick=async()=>{try{const c=await canvas(),a=document.createElement('a');a.download='Grade11_Physics_All_Students_Grading.png';a.href=c.toDataURL('image/png');a.click()}catch(e){sheet.style.display='none';alert(e.message)}};
pdfAll.onclick=async()=>{try{const c=await canvas(),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),m=8,w=297-m*2,h=210-m*2,ratio=Math.min(w/c.width,h/c.height),iw=c.width*ratio,ih=c.height*ratio;pdf.addImage(c.toDataURL('image/png'),'PNG',m+(w-iw)/2,m+(h-ih)/2,iw,ih);pdf.save('Grade11_Physics_All_Students_Grading.pdf')}catch(e){sheet.style.display='none';alert(e.message)}};
tbody.addEventListener('click',async e=>{const b=e.target.closest('[data-id]');if(!b)return;const r=rows().find(x=>x.id===b.dataset.id);if(!r)return;sheet.className='sheet portrait';sheet.innerHTML=`<div class="border"><img class="logo" src="${LOGO}" crossorigin="anonymous"><div class="school">VICTORY LAND FEDERAL SCHOOL</div><div class="sub">Grade 11 · Subject - Physics</div><h2>STUDENT REPORT CARD</h2><div class="info"><div class="label">Student ID</div><div>${r.id}</div><div class="label">Student Name</div><div>${r.name}</div><div class="label">Attendance %</div><div>${r.attendancePct.toFixed(2)}%</div><div class="label">Homework %</div><div>${r.homeworkPct.toFixed(2)}%</div></div><table class="marks"><thead><tr><th>Assessment</th><th>Mark</th><th>Maximum</th></tr></thead><tbody><tr><td>Attendance</td><td>${r.a.toFixed(2)}</td><td>40</td></tr><tr><td>Participation</td><td>${r.p.toFixed(2)}</td><td>30</td></tr><tr><td>Homework</td><td>${r.h.toFixed(2)}</td><td>30</td></tr><tr><td>Official Test</td><td>${r.o.toFixed(2)}</td><td>100</td></tr><tr class="total"><td>Total</td><td>${r.total.toFixed(2)}</td><td>200</td></tr><tr class="grade"><td>Overall / Final Grade</td><td>${r.overall.toFixed(2)}%</td><td>${r.grade}</td></tr></tbody></table><div class="sign">Sir Lynn</div><div class="foot">Attendance: ${r.present}/${r.days} days · Homework: ${r.completed}/${r.days} days · Generated: ${new Date().toLocaleString()}</div></div>`;sheet.style.display='block';try{const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff',useCORS:true,allowTaint:false});sheet.style.display='none';const a=document.createElement('a');a.download=`${r.id}_Report_Card.png`;a.href=c.toDataURL('image/png');a.click()}catch(err){sheet.style.display='none';alert(err.message)}});
[['attendance','attendance_records'],['participation','participation_records'],['homework','homework_records'],['official','physics_official_results']].forEach(([k,n])=>onSnapshot(collection(db,n),s=>{sets[k]=s.docs.map(d=>d.data());loaded.add(k);render()},e=>{statusEl.textContent='⚠️ Results unavailable';console.error(n,e)}));
onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};render()},e=>{statusEl.textContent='⚠️ Results unavailable';console.error(e)});
render();
</script>
</body></html>
