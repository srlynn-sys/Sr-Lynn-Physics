<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 11 Physics — Student Grading Results</title><link rel="stylesheet" href="academic.css"><style>table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:9px;border:1px solid #dbe5ec;text-align:center;white-space:nowrap}th{background:#102a43;color:#fff;position:sticky;top:0}.export-bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.export-btn{border:0;border-radius:12px;padding:10px 14px;background:#142b43;color:#fff;font-weight:700;cursor:pointer}.sheet{position:fixed;left:-20000px;top:0;width:1120px;background:#fff;color:#142b43;font-family:Arial,'Noto Sans Myanmar',sans-serif}.page{box-sizing:border-box;background:#fff;border:5px solid #173b59;padding:34px;min-height:790px}.head{text-align:center;border-bottom:3px solid #d4af37;padding-bottom:16px;margin-bottom:18px}.logo{width:78px;height:78px;object-fit:contain}.school{font-size:26px;font-weight:900}.title{font-size:22px;color:#24577a;font-weight:900;margin-top:8px}.meta{font-size:11px;color:#718090;margin-top:5px}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.info div{padding:9px;border:1px solid #c9d5df}.report table{width:100%;border-collapse:collapse}.report th{position:static;background:#173b59;color:#fff;padding:10px}.report td{padding:10px;border:1px solid #c9d5df}.report .grade{font-weight:900;background:#fff3cf}.note{margin-top:16px;padding:11px;border:2px solid #d4af37;background:#fffaf0;text-align:center;font-size:11px}.sign{margin-top:45px;margin-left:auto;width:190px;text-align:center;border-top:1px solid #173b59;padding-top:6px;font-size:11px}@media(max-width:700px){.export-bar{display:grid}.export-btn{width:100%}}</style></head><body><main class="wrap"><section class="hero"><h1>📊 Student Grading Results</h1><p>Grade 11 · Physics</p></section><section class="panel"><div id="status">Results loading…</div><div class="export-bar"><button class="export-btn" id="pngAll">🖼️ All Students — Landscape PNG</button><button class="export-btn" id="pdfAll">📄 All Students — Landscape PDF</button></div><div style="overflow:auto"><table id="table"><thead><tr><th>Rank</th><th>Student ID</th><th>Name</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official /100</th><th>Total /200</th><th>Overall %</th><th>Grade</th><th>Report Card</th></tr></thead><tbody></tbody></table></div></section></main><div id="sheet" class="sheet"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds,myanmarDateTime}from'./firebase-data.js';import{historicalAttendance,historicalHomework}from'./attendance-homework-policy.js';import{forcedAbsent}from'./attendance-authority.js';const db=getFirestore(initializeApp(firebaseConfig)),tbody=document.querySelector('#table tbody'),status=document.querySelector('#status'),sheet=document.querySelector('#sheet');const sets={attendance:[],participation:[],homework:[],official:[]};let settings={},loaded=0;const today=()=>myanmarDateTime().date,id=v=>String(v??'').trim().toUpperCase(),same=(a,b)=>id(a)===id(b),stamp=x=>{if(x?.timestamp?.toMillis)return x.timestamp.toMillis();if(x?.timestamp)return new Date(x.timestamp).getTime()||0;return new Date((x?.date||'')+'T'+(x?.time||'00:00:00')).getTime()||0},fresh=(k,x)=>{const vals=[settings.allResetAt,settings.gradingResetAt,settings[k+'ResetAt'],k==='official'?settings.officialResetAt:0].filter(Boolean).map(v=>new Date(v).getTime());return!vals.length||stamp(x)>=Math.max(...vals)},hw=x=>x?.completed===true||['completed','complete','done','submitted'].includes(String(x?.status??'').trim().toLowerCase()),pct=(v,t)=>t?Math.max(0,Math.min(100,v/t*100)):0,grade=v=>v>=90?'A*':v>=80?'A':v>=70?'B*':v>=60?'B':v>=50?'C*':v>=40?'C':'D';function merged(base,live,s,k){const m={};base.forEach(x=>m[x.date]=x);live.filter(x=>same(x.id,s)&&x.date<=today()&&fresh(k,x)&&!(k==='attendance'&&forcedAbsent(s,x.date))).forEach(x=>m[x.date]={...m[x.date],...x});return Object.values(m)}function calc(s){const ar=merged(historicalAttendance(s),sets.attendance,s,'attendance'),hr=merged(historicalHomework(s),sets.homework,s,'homework'),ad=Math.max(ar.length,1),hd=Math.max(hr.length,1),present=ar.filter(x=>String(x.status??'').trim().toLowerCase()==='present').length,completed=new Set(hr.filter(hw).map(x=>x.date)).size,a=pct(present,ad)*.4,h=pct(completed,hd)*.3,ps=sets.participation.filter(x=>same(x.id,s)&&fresh('participation',x)).sort((a,b)=>stamp(b)-stamp(a)),os=sets.official.filter(x=>same(x.id,s)&&fresh('official',x)).sort((a,b)=>stamp(b)-stamp(a)),p=Math.max(0,Math.min(30,Number(ps[0]?.mark)||0)),o=Math.max(0,Math.min(100,Number(os[0]?.score)||0)),total=a+p+h+o,overall=total/2;return{id:s,name:students[s],a,p,h,o,total,overall,grade:grade(overall),attendancePct:pct(present,ad),homeworkPct:pct(completed,hd),attendanceDays:ad,homeworkDays:hd}}function rows(){return studentIds.map(calc).sort((a,b)=>b.overall-a.overall||a.id.localeCompare(b.id))}function render(){if(loaded<4)return;tbody.innerHTML=rows().map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td>${r.name}</td><td>${r.a.toFixed(2)}/40<br><small>${r.attendancePct.toFixed(2)}% · ${r.attendanceDays} days</small></td><td>${r.p.toFixed(2)}/30</td><td>${r.h.toFixed(2)}/30<br><small>${r.homeworkPct.toFixed(2)}% · ${r.homeworkDays} days</small></td><td>${r.o.toFixed(2)}/100</td><td><b>${r.total.toFixed(2)}/200</b></td><td>${r.overall.toFixed(2)}%</td><td><b>${r.grade}</b></td><td><button class="export-btn" data-id="${r.id}">🖼️ PNG</button></td></tr>`).join('');status.textContent='● Firebase Live — Historic + submitted live days only'}function logo(){return'<img class="logo" src="https://lh3.googleusercontent.com/d/14aXibOqVCRpTfzKBn3ahkZL4WpVnQYgQ">'}function report(r){return`<div class="page"><div class="head">${logo()}<div class="school">VICTORY LAND FEDERAL SCHOOL</div><div>Grade 11 · Physics</div><div class="title">STUDENT REPORT CARD</div><div class="meta">Generated: ${today()}</div></div><div class="info"><div><b>Student ID</b><br>${r.id}</div><div><b>Student Name</b><br>${r.name}</div></div><div class="report"><table><tr><th>Assessment</th><th>Mark</th><th>Maximum</th><th>Percentage</th></tr><tr><td>Attendance</td><td>${r.a.toFixed(2)}</td><td>40</td><td>${r.attendancePct.toFixed(2)}% · ${r.attendanceDays} days</td></tr><tr><td>Participation</td><td>${r.p.toFixed(2)}</td><td>30</td><td>${pct(r.p,30).toFixed(2)}%</td></tr><tr><td>Homework</td><td>${r.h.toFixed(2)}</td><td>30</td><td>${r.homeworkPct.toFixed(2)}% · ${r.homeworkDays} days</td></tr><tr><td>Official Test</td><td>${r.o.toFixed(2)}</td><td>100</td><td>${r.o.toFixed(2)}%</td></tr><tr><th>Total</th><th>${r.total.toFixed(2)}</th><th>200</th><th>${r.overall.toFixed(2)}%</th></tr><tr><th>Final Grade</th><th colspan="2" class="grade">${r.grade}</th><th>${r.overall.toFixed(2)}%</th></tr></table></div><div class="note">Historic records + submitted live records are used. A current day that has not been submitted is not counted and does not appear as Absent.</div><div class="sign">Sir Lynn<br>School Teacher Sign</div></div>`}async function exportCanvas(html,name,pdf=false){sheet.innerHTML=html;sheet.style.display='block';await new Promise(r=>setTimeout(r,200));const c=await html2canvas(sheet,{scale:2,backgroundColor:'#fff',useCORS:true});sheet.style.display='none';if(pdf){const{jsPDF}=window.jspdf,p=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),m=7,w=297-2*m,h=210-2*m,q=Math.min(w/c.width,h/c.height);p.addImage(c.toDataURL('image/png'),'PNG',m+(w-c.width*q)/2,m+(h-c.height*q)/2,c.width*q,c.height*q);p.save(name+'.pdf')}else{const a=document.createElement('a');a.download=name+'.png';a.href=c.toDataURL('image/png');a.click()}}pngAll.onclick=()=>exportCanvas(`<div class="page"><div class="head">${logo()}<div class="school">VICTORY LAND FEDERAL SCHOOL</div><div class="title">PHYSICS — ALL STUDENTS GRADING REPORT</div><div class="meta">Generated: ${today()}</div></div><div class="report"><table><tr><th>Rank</th><th>ID</th><th>Name</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official /100</th><th>Total /200</th><th>Overall</th><th>Grade</th></tr>${rows().map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td>${r.name}</td><td>${r.a.toFixed(2)}<br><small>${r.attendanceDays} days</small></td><td>${r.p.toFixed(2)}</td><td>${r.h.toFixed(2)}<br><small>${r.homeworkDays} days</small></td><td>${r.o.toFixed(2)}</td><td>${r.total.toFixed(2)}</td><td>${r.overall.toFixed(2)}%</td><td>${r.grade}</td></tr>`).join('')}</table></div><div class="note">Attendance/Homework use historic data plus submitted live days only. Unfilled current days are excluded until submission.</div></div>`,'Grade11_Physics_All_Students_Grading',false);pdfAll.onclick=()=>exportCanvas(`<div class="page"><div class="head">${logo()}<div class="school">VICTORY LAND FEDERAL SCHOOL</div><div class="title">PHYSICS — ALL STUDENTS GRADING REPORT</div><div class="meta">Generated: ${today()}</div></div><div class="report"><table><tr><th>Rank</th><th>ID</th><th>Name</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official /100</th><th>Total /200</th><th>Overall</th><th>Grade</th></tr>${rows().map((r,i)=>`<tr><td>${i+1}</td><td>${r.id}</td><td>${r.name}</td><td>${r.a.toFixed(2)}<br><small>${r.attendanceDays} days</small></td><td>${r.p.toFixed(2)}</td><td>${r.h.toFixed(2)}<br><small>${r.homeworkDays} days</small></td><td>${r.o.toFixed(2)}</td><td>${r.total.toFixed(2)}</td><td>${r.overall.toFixed(2)}%</td><td>${r.grade}</td></tr>`).join('')}</table></div><div class="note">Attendance/Homework use historic data plus submitted live days only. Unfilled current days are excluded until submission.</div></div>`,'Grade11_Physics_All_Students_Grading',true);tbody.onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const r=rows().find(x=>x.id===b.dataset.id);if(r)exportCanvas(report(r),r.id+'_Report_Card',false)};[['attendance','attendance_records'],['participation','participation_records'],['homework','homework_records'],['official','physics_official_results']].forEach(([k,n])=>onSnapshot(collection(db,n),s=>{sets[k]=s.docs.map(d=>d.data());loaded++;render()},e=>console.error(e)));onSnapshot(doc(db,'admin_settings','tests'),s=>{settings=s.exists()?s.data():{};render()});</script></body></html>
