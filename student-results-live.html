<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grading System Live</title><link rel="stylesheet" href="academic.css"></head><body><main class="wrap"><section class="hero"><h1>📊 Grading System</h1><p>Firebase Live Result</p></section><section class="panel"><div id="status">Loading Firebase…</div><div style="overflow:auto"><table id="table"><thead><tr><th>Rank</th><th>Student ID</th><th>Name</th><th>Attendance /40</th><th>Participation /30</th><th>Homework /30</th><th>Official /100</th><th>Total /200</th><th>Overall %</th><th>Grade</th></tr></thead><tbody></tbody></table></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig)),sets={attendance:[],participation:[],homework:[],official:[]};let ready=0;[['attendance','attendance_records'],['participation','participation_records'],['homework','homework_records'],['official','physics_official_results']].forEach(([k,n])=>onSnapshot(collection(db,n),s=>{sets[k]=s.docs.map(d=>d.data());ready++;render()},e=>status.textContent='Firebase error: '+e.message));function grade(p){return p>=90?'A*':p>=80?'A':p>=70?'B*':p>=60?'B':p>=50?'C*':p>=40?'C':'D'}function one(id){let a=Math.min(40,sets.attendance.filter(x=>x.id===id&&x.status==='Present').length);let p=sets.participation.filter(x=>x.id===id).sort((x,y)=>new Date(y.timestamp)-new Date(x.timestamp));p=Math.min(30,Number(p[0]?.mark)||0);let h=Math.min(30,new Set(sets.homework.filter(x=>x.id===id&&x.completed).map(x=>x.date)).size);let o=Math.min(100,Number(sets.official.find(x=>x.id===id)?.score)||0);let total=a+p+h+o;return[a,p,h,o,total,total/2,grade(total/2)]}function render(){const rows=studentIds.map(id=>[id,students[id],...one(id)]).sort((a,b)=>b[6]-a[6]);table.querySelector('tbody').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}/40</td><td>${r[3]}/30</td><td>${r[4]}/30</td><td>${r[5]}/100</td><td>${r[6]}/200</td><td>${Number(r[7]).toFixed(2)}%</td><td>${r[8]}</td></tr>`).join('');status.textContent=ready>=4?'● Firebase Live — device အားလုံး sync ဖြစ်နေပါသည်။':'Firebase collections '+ready+'/4 ကိုဖတ်နေသည်…'}</script></body></html>
