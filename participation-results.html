<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Participation Results</title><link rel="stylesheet" href="academic.css"><style>table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #dbe3ee;text-align:center;white-space:nowrap}th{background:#0f2747;color:#fff}.live{padding:10px;background:#e8f7ee;color:#18784a;border-radius:10px;font-weight:700}.wrapx{overflow:auto}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="participation.html">← Participation</a></div><section class="hero"><h1>Participation Results</h1><p>Live Firestore data</p></section><section class="panel"><div id="out">Loading...</div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig)),out=document.getElementById('out');onSnapshot(collection(db,'participation_records'),s=>{const rows=s.docs.map(d=>d.data()).sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||''));out.innerHTML=rows.length?'<div class="live">Live Firestore Sync</div><div class="wrapx"><table><thead><tr><th>No.</th><th>Student ID</th><th>Name</th><th>Date</th><th>Time</th><th>Mark</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+r.id+'</td><td>'+r.name+'</td><td>'+r.date+'</td><td>'+r.time+'</td><td>'+r.mark+'/30</td></tr>').join('')+'</tbody></table></div>':'No participation records yet.'},e=>out.innerHTML='Firestore error: '+e.message);</script></body></html>
