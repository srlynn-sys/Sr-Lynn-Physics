<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Participation Results</title><link rel="stylesheet" href="academic.css"><style>table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #dbe3ee;text-align:center}th{background:#0f2747;color:#fff}.live{padding:10px;background:#e8f7ee;color:#18784a;border-radius:10px;font-weight:700}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="participation.html">← Participation</a></div><section class="hero"><h1>📋 Participation Results</h1><p>● LIVE — Firebase Firestore</p></section><section class="panel"><div id="out">Firebase မှ data ကို ဖတ်နေသည်...</div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig)),ref=collection(db,'participation_records');onSnapshot(ref,snap=>{const rows=snap.docs.map(d=>d.data()).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));out.innerHTML=rows.length?'<div class="live">● Firebase Live Sync — Device အားလုံးမှာ တူညီသော data ပေါ်ပါမည်။</div><div style="overflow:auto"><table><thead><tr><th>No.</th><th>Student ID</th><th>အမည်</th><th>Date</th><th>Time</th><th>Mark</th></tr></thead><tbody>'+rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+x.id+'</td><td>'+x.name+'</td><td>'+x.date+'</td><td>'+x.time+'</td><td>'+x.mark+'/30</td></tr>').join('')+'</tbody></table></div>':'No participation records yet.'},e=>out.innerHTML='Firebase error: '+e.message);</script></body></html>
