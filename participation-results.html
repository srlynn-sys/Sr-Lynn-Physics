<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Participation Results</title><link rel="stylesheet" href="academic.css"><style>table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #dbe3ee;text-align:center}th{background:#0f2747;color:#fff}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="participation.html">← Participation</a></div><section class="hero"><h1>📋 Participation Results</h1><p>Myanmar Time (UTC+06:30) • Date & time recorded exactly</p></section><section class="panel"><div id="out"></div></section></main><script>const r=JSON.parse(localStorage.getItem('participation_records')||'[]').sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));const out=document.getElementById('out');out.innerHTML=r.length?'<div style="overflow:auto"><table><thead><tr><th>No.</th><th>Student ID</th><th>Date</th><th>Time</th><th>Mark</th></tr></thead><tbody>'+r.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+x.id+'</td><td>'+x.date+'</td><td>'+x.time+'</td><td>'+x.mark+'/30</td></tr>').join('')+'</tbody></table></div>':'No participation records yet.';</script></body></html>
