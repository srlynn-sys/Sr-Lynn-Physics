<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Participation Results</title><link rel="stylesheet" href="academic.css"><style>table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #dbe3ee;text-align:center;white-space:nowrap}th{background:#0f2747;color:#fff}.live{padding:10px;background:#e8f7ee;color:#18784a;border-radius:10px;font-weight:700}.wrapx{overflow:auto}.reset{padding:10px;background:#fff4d6;color:#765b00;border-radius:10px;font-weight:700;margin:10px 0}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="participation.html">← Participation</a></div><section class="hero"><h1>Participation Results</h1><p>Live Firestore data</p></section><section class="panel"><div id="out">Loading...</div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig)),out=document.getElementById('out');let rows=[],resetAt=0;function tm(x){const v=x?.timestamp;if(v&&typeof v.toMillis==='function')return v.toMillis();return new Date(v||((x.date||'')+'T'+(x.time||''))).getTime()||0}function render(){const r=rows.filter(x=>tm(x)>=resetAt).sort((a,b)=>tm(b)-tm(a));out.innerHTML=r.length?'<div class="live">Live Firestore Sync</div>'+(resetAt?'<div class="reset">♻️ Participation Reset အပြီး data အသစ်များကိုသာ ပြထားပါသည်။</div>':'')+'<div class="wrapx"><table><thead><tr><th>No.</th><th>Student ID</th><th>Name</th><th>Date</th><th>Time</th><th>Mark</th></tr></thead><tbody>'+r.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+x.id+'</td><td>'+x.name+'</td><td>'+x.date+'</td><td>'+x.time+'</td><td>'+x.mark+'/30</td></tr>').join('')+'</tbody></table></div>':'No participation records yet.'}onSnapshot(collection(db,'participation_records'),s=>{rows=s.docs.map(d=>d.data());render()},e=>out.innerHTML='Firestore error: '+e.message);onSnapshot(doc(db,'admin_settings','tests'),s=>{const d=s.exists()?s.data():{};resetAt=Math.max(d.allResetAt?new Date(d.allResetAt).getTime():0,d.participationResetAt?new Date(d.participationResetAt).getTime():0);render()});</script></body></html>
