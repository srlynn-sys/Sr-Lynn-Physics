<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Results</title><link rel="stylesheet" href="academic.css"></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="attendance.html">← Attendance</a></div><section class="hero"><h1>📋 Attendance Results</h1><p>2026-08-10 မှ စတင်၍ School Workdays အလိုက်</p></section><section class="panel"><input id="studentId" placeholder="Student ID — ဥပမာ 11MM 003"><button id="searchBtn">🔎 ရှာမည်</button><button id="allBtn">👥 All Students</button><div id="out">Loading...</div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig,students,studentIds}from'./firebase-data.js';import{schoolDates,historicalAttendance}from'./attendance-homework-policy.js';import{forcedAbsent}from'./attendance-authority.js';const db=getFirestore(initializeApp(firebaseConfig)),out=document.getElementById('out');let records=[],selectedId='';function realRows(id){const map={};historicalAttendance(id).forEach(x=>map[x.date]=x);records.filter(x=>x.id===id&&!forcedAbsent(id,x.date)).forEach(x=>{if(x.date>='2026-08-10')map[x.date]={...map[x.date],...x,historical:false}});return schoolDates().map(date=>map[date]||{id,date,status:'Absent'})}function render(){const ids=selectedId?[selectedId]:studentIds,total=schoolDates().length||1;out.innerHTML='<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Student ID</th><th>Name</th><th>Present</th><th>Absent</th><th>Leave</th><th>Attendance %</th></tr></thead><tbody>'+ids.map(id=>{const r=realRows(id),p=r.filter(x=>x.status==='Present').length,a=r.filter(x=>x.status==='Absent').length,l=r.filter(x=>x.status==='Leave').length;return`<tr><td>${id}</td><td>${students[id]}</td><td>${p}</td><td>${a}</td><td>${l}</td><td>${(p/total*100).toFixed(2)}%</td></tr>`}).join('')+'</tbody></table></div>'}searchBtn.onclick=()=>{selectedId=studentId.value.trim().toUpperCase();if(selectedId&&!students[selectedId]){out.innerHTML='<p>Student ID မတွေ့ပါ။</p>';return}render()};allBtn.onclick=()=>{selectedId='';studentId.value='';render()};studentId.onkeydown=e=>{if(e.key==='Enter')searchBtn.click()};onSnapshot(collection(db,'attendance_records'),s=>{records=s.docs.map(d=>d.data());render()});render();</script></body></html>
