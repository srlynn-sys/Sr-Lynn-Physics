<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Results</title><link rel="stylesheet" href="academic.css"><style>table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:11px;border-bottom:1px solid #dbe3ee;text-align:center}th{background:#0f2747;color:white}.present{color:#16803c;font-weight:700}.absent{color:#c62828;font-weight:700}.leave{color:#9a6a00;font-weight:700}.empty{padding:18px;background:#f6f8fb;border-radius:12px}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="attendance.html">← Attendance</a></div><section class="hero"><h1>📋 Attendance Results</h1><p>Myanmar Time (UTC+06:30) • Date & time recorded exactly</p></section><section class="panel"><div id="out"></div></section></main><script>const rows=JSON.parse(localStorage.getItem('attendance_records')||'[]').sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));const out=document.getElementById('out');if(!rows.length){out.innerHTML='<div class="empty">Attendance records မရှိသေးပါ။</div>'}else{out.innerHTML='<div style="overflow:auto"><table><thead><tr><th>No.</th><th>Student ID</th><th>Date</th><th>Time</th><th>Status</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+r.id+'</td><td>'+r.date+'</td><td>'+r.time+'</td><td class="'+r.status.toLowerCase()+'">'+r.status+'</td></tr>').join('')+'</tbody></table></div>'}</script></body></html>
