<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Results</title><link rel="stylesheet" href="academic.css"><style>table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:11px;border-bottom:1px solid #dbe3ee;text-align:center}th{background:#0f2747;color:white}.present{color:#16803c;font-weight:700}.absent{color:#c62828;font-weight:700}.leave{color:#9a6a00;font-weight:700}.empty{padding:18px;background:#f6f8fb;border-radius:12px}.live{padding:10px;background:#e8f7ee;color:#18784a;border-radius:10px;font-weight:700}.reset{padding:10px;background:#fff4d6;color:#765b00;border-radius:10px;font-weight:700;margin-top:10px}</style></head><body><main class="wrap"><div class="top"><div class="brand">GRADE 11 PHYSICS</div><a class="back" href="attendance.html">← Attendance</a></div><section class="hero"><h1>📋 Attendance Results</h1><p>● LIVE — Firebase Firestore</p></section><section class="panel"><div id="out">Firebase မှ Attendance data ကို ဖတ်နေသည်...</div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';import{getFirestore,collection,onSnapshot,query,orderBy,doc}from'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';import{firebaseConfig}from'./firebase-data.js';const db=getFirestore(initializeApp(firebaseConfig)),ref=query(collection(db,'attendance_records'),orderBy('timestamp','desc'));let resetAt=0;let records=[];function tm(x){const v=x?.timestamp;if(v&&typeof v.toMillis==='function')return v.toMillis();return new Date(v||((x.date||'')+'T'+(x.time||''))).getTime()||0}function render(){const rows=records.filter(r=>tm(r)>=resetAt),out=document.getElementById('out');if(!rows.length){out.innerHTML='<div class="empty">Attendance records မရှိသေးပါ။</div>';return}out.innerHTML='<div class="live">● Firebase Live Sync — Device အားလုံးမှာ တူညီသော data ပေါ်ပါမည်။</div>'+(resetAt?'<div class="reset">♻️ Attendance Reset အပြီး data အသစ်များကိုသာ ပြထားပါသည်။</div>':'')+'<div style="overflow:auto"><table><thead><tr><th>No.</th><th>Student ID</th><th>အမည်</th><th>Date</th><th>Time</th><th>Status</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+r.id+'</td><td>'+r.name+'</td><td>'+r.date+'</td><td>'+r.time+'</td><td class="'+String(r.status||'').toLowerCase()+'">'+r.status+'</td></tr>').join('')+'</tbody></table></div>'}onSnapshot(ref,s=>{records=s.docs.map(d=>d.data());render()},e=>document.getElementById('out').innerHTML='<div class="empty">Firebase error: '+e.message+'</div>');onSnapshot(doc(db,'admin_settings','tests'),s=>{const d=s.exists()?s.data():{};resetAt=Math.max(d.allResetAt?new Date(d.allResetAt).getTime():0,d.attendanceResetAt?new Date(d.attendanceResetAt).getTime():0);render()});</script></body></html>
